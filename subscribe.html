<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GamnaMarks — اشتركي بالقناة</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#0d0820}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:'Baloo Bhaijaan 2',sans-serif;color:#fff;padding:12px}
  .wrap{position:relative;width:100%;max-width:460px;max-height:calc(100vh - 24px);aspect-ratio:1083/1452}
  .wrap img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
  /* مناطق الضغط فوق الصورة (بالنسبة المئوية عشان تزبط على كل الشاشات) */
  .hot{position:absolute;display:block;border-radius:60px;-webkit-tap-highlight-color:transparent;cursor:pointer}
  .hot:active{background:rgba(255,255,255,.12)}
  #ytBtn{left:18.5%;right:18.5%;top:66.6%;height:8.8%}
  #bellBtn{left:40%;right:40%;top:59.2%;height:6.4%}
  #bellNote{left:22%;right:22%;top:77.3%;height:4.2%}
  .pulse{position:absolute;left:18.5%;right:18.5%;top:66.6%;height:8.8%;border-radius:60px;pointer-events:none;
         box-shadow:0 0 0 0 rgba(255,60,60,.7);animation:pulse 1.8s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 14px rgba(255,60,60,0)}100%{box-shadow:0 0 0 0 rgba(255,60,60,0)}}
  .bottom{position:absolute;left:12%;right:12%;top:83.2%;text-align:center}
  .enterRow{display:none;align-items:center;justify-content:center;gap:8px;direction:ltr}
  .enterRow .enter{display:block;flex:1}
  .finger{font-size:34px;line-height:1;animation:point .8s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(255,200,0,.6))}
  @keyframes point{50%{transform:translateX(-10px)}}
  .wait{display:none;font-size:15px;opacity:.9}
  .enter{display:none;width:100%;padding:12px;border:none;border-radius:18px;cursor:pointer;
         font-family:inherit;font-size:18px;font-weight:800;color:#fff;
         background:linear-gradient(90deg,#3b82f6,#8b5cf6,#ec4899,#f97316);
         box-shadow:0 8px 24px rgba(139,92,246,.5);animation:pop .4s ease}
  @keyframes pop{from{transform:scale(.8);opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <img src="subscribe-card.jpg" alt="اشتركي بقناة GamnaMarks على يوتيوب وفعّلي الجرس">
  <div class="pulse"></div>
  <a id="ytBtn"   class="hot sub" href="https://www.youtube.com/@GamnaMarks?sub_confirmation=1" target="_blank" rel="noopener" aria-label="اشتركي بالقناة"></a>
  <a id="bellBtn" class="hot sub" href="https://www.youtube.com/@GamnaMarks?sub_confirmation=1" target="_blank" rel="noopener" aria-label="فعّلي الجرس"></a>
  <a id="bellNote" class="hot sub" href="https://www.youtube.com/@GamnaMarks?sub_confirmation=1" target="_blank" rel="noopener" aria-label="فعّلي الجرس"></a>
  <div class="bottom">
    <div id="wait" class="wait">⏳ اشتركي وفعّلي الجرس 🔔 وارجعي لهون…</div>
    <div id="enterRow" class="enterRow">
      <button id="enterBtn" class="enter">ادخلي اللعبة 🚀</button>
      <span class="finger">👈</span>
    </div>
  </div>
</div>

<script>
  var APP_URL = "index.html";           // رابط التطبيق
  var KEY = "gm_subscribed";

  function store(get, val){
    try{ return get ? localStorage.getItem(KEY) : localStorage.setItem(KEY, val); }catch(e){ return null; }
  }


  var clicked = false, leftAt = 0;
  var enterBtn = document.getElementById("enterBtn");
  var wait = document.getElementById("wait");

  var enterRow = document.getElementById("enterRow");
  function unlock(){ wait.style.display = "none"; enterRow.style.display = "flex"; }

  // الصورة بتظل تطلع كل مرة؛ إذا اشتركت قبل هيك بيطلعلها زر الدخول مع الإصبع على طول
  if (store(true) === "1") { unlock(); }

  var subs = document.querySelectorAll(".sub");
  for (var i = 0; i < subs.length; i++){
    subs[i].addEventListener("click", function(){
      clicked = true; leftAt = Date.now();
      if (enterRow.style.display !== "flex") wait.style.display = "block";
      setTimeout(unlock, 10000); // احتياط: بعد ١٠ ثواني
    });
  }

  // لما ترجع من يوتيوب للصفحة
  document.addEventListener("visibilitychange", function(){
    if (clicked && document.visibilityState === "visible" && Date.now() - leftAt > 3000) unlock();
  });

  enterBtn.addEventListener("click", function(){
    store(false, "1");
    try{ sessionStorage.setItem("gm_entered","1"); }catch(e){}
    location.href = APP_URL;
  });
</script>
</body>
</html>
