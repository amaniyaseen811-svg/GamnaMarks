<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GamnaMarks — اشتركي بالقناة</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#0d0820}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:'Baloo Bhaijaan 2',sans-serif;color:#fff;padding:12px}
  .wrap{position:relative;width:100%;max-width:460px;max-height:calc(100vh - 24px);aspect-ratio:1083/1452}
  .wrap img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
  /* مناطق الضغط فوق الصورة (بالنسبة المئوية عشان تزبط على كل الشاشات) */
  .hot{position:absolute;display:block;border-radius:60px;-webkit-tap-highlight-color:transparent;cursor:pointer}
  .hot:active{background:rgba(255,255,255,.12)}
  #ytBtn{left:18.5%;right:18.5%;top:66.6%;height:8.8%}
  #bellBtn{left:40%;right:40%;top:59.2%;height:6.4%}
  #bellNote{left:22%;right:22%;top:77.3%;height:4.2%}
  .pulse{position:absolute;left:18.5%;right:18.5%;top:66.6%;height:8.8%;border-radius:60px;pointer-events:none;
         box-shadow:0 0 0 0 rgba(255,60,60,.7);animation:pulse 1.8s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 14px rgba(255,60,60,0)}100%{box-shadow:0 0 0 0 rgba(255,60,60,0)}}
  .bottom{position:absolute;left:12%;right:12%;top:83.2%;text-align:center}
  .enterRow{display:none;align-items:center;justify-content:center;gap:8px;direction:ltr}
  .enterRow .enter{display:block;flex:1}
  .finger{font-size:34px;line-height:1;animation:point .8s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(255,200,0,.6))}
  @keyframes point{50%{transform:translateX(-10px)}}
  .wait{display:none;font-size:15px;opacity:.9}
  .enter{display:none;width:100%;padding:12px;border:none;border-radius:18px;cursor:pointer;
         font-family:inherit;font-size:18px;font-weight:800;color:#fff;
         background:linear-gradient(90deg,#3b82f6,#8b5cf6,#ec4899,#f97316);
         box-shadow:0 8px 24px rgba(139,92,246,.5);animation:pop .4s ease}
  @keyframes pop{from{transform:scale(.8);opacity:0}}
  .codeBox{display:none;flex-direction:column;gap:7px;width:100%;max-width:400px;margin-top:10px;text-align:center;animation:pop .4s ease}
  body.coding .wrap{max-height:calc(100vh - 200px)}
  .codeBox .lbl{font-size:14px;line-height:1.4}
  .codeBox input{width:100%;padding:10px;border-radius:14px;border:2px solid #8b5cf6;background:#1b1238;color:#fff;
       font-family:inherit;font-size:18px;text-align:center;outline:none}
  .codeBox button{padding:10px;border:none;border-radius:14px;font-family:inherit;font-size:16px;font-weight:800;color:#fff;cursor:pointer;
       background:linear-gradient(90deg,#3b82f6,#8b5cf6,#ec4899)}
  .codeBox .err{display:none;color:#ffb4b4;font-size:13px}
  #gmpPill{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:50;padding:6px 14px;border-radius:20px;
       background:linear-gradient(90deg,#f59e0b,#ec4899,#8b5cf6);color:#fff;text-decoration:none;font-size:14px;font-weight:800;
       box-shadow:0 4px 16px rgba(236,72,153,.45);white-space:nowrap;animation:pop .4s ease}
  html{scroll-behavior:smooth}
  #gmpBoard{scroll-margin-top:52px}
  .shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<div class="wrap">
  <img src="subscribe-card.jpg" alt="اشتركي بقناة GamnaMarks على يوتيوب وفعّلي الجرس">
  <div class="pulse"></div>
  <a id="ytBtn"   class="hot sub" href="https://www.youtube.com/@GamnaMarks?sub_confirmation=1" target="_blank" rel="noopener" aria-label="اشتركي بالقناة"></a>
  <a id="bellBtn" class="hot sub" href="https://www.youtube.com/@GamnaMarks?sub_confirmation=1" target="_blank" rel="noopener" aria-label="فعّلي الجرس"></a>
  <a id="bellNote" class="hot sub" href="https://www.youtube.com/@GamnaMarks?sub_confirmation=1" target="_blank" rel="noopener" aria-label="فعّلي الجرس"></a>
  <div class="bottom">
    <div id="wait" class="wait">⏳ اشتركي وفعّلي الجرس 🔔 وارجعي لهون…</div>
    <div id="enterRow" class="enterRow">
      <button id="enterBtn" class="enter">ادخلي اللعبة 🚀</button>
      <span class="finger">👈</span>
    </div>
  </div>
</div>
<div id="codeBox" class="codeBox">
      <div class="lbl">🔑 اكتبي الكود السري الموجود بآخر منشور على القناة</div>
      <input id="codeIn" type="text" autocomplete="off" placeholder="الكود السري">
      <button id="codeBtn">تأكيد ✅</button>
      <div id="codeErr" class="err">❌ الكود غلط أو قديم… شوفي آخر منشور بالقناة</div>
    </div>

<script>
  var APP_URL = "contest.html";         // بعد الكود: صفحة مسابقة النقاط، وبعدها التطبيق
  var KEY = "gm_subscribed";
  // ===== الكود السري: بيتغير لحاله كل ٣ أيام =====
  var CODES = ["نجمة","قمر","شمس","زيتونة","فراشة","غيمة","وردة","نحلة","بحر","جبل",
               "قوس قزح","سنبلة","نخلة","لؤلؤة","كوكب","برتقالة","حمامة","ياسمين","شجرة","مطر",
               "دلفين","بركان","مجرة","صقر","ليمونة","خلية","ذرة","مغناطيس","بوصلة","شلال"];
  var START = Date.UTC(2026, 10, 5);    // أول دورة: ٥ تشرين الثاني ٢٠٢٦
  var DAYS = 3, TEACHER = "amani2026";
  function period(){
    var n = new Date();
    var d = Math.floor((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) - START) / 86400000);
    return Math.floor(d / DAYS);
  }
  function codeFor(p){ var L = CODES.length; return CODES[(((p * 7 + 3) % L) + L) % L]; }
  function norm(t){
    return String(t||"").replace(/[ً-ْـ]/g,"").replace(/[أإآ]/g,"ا")
      .replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/\s+/g,"").toLowerCase();
  }
  function store(get, val, k){
    k = k || KEY;
    try{ return get ? localStorage.getItem(k) : localStorage.setItem(k, val); }catch(e){ return null; }
  }
  var clicked = false, leftAt = 0;
  var enterBtn = document.getElementById("enterBtn");
  var wait = document.getElementById("wait");
  var enterRow = document.getElementById("enterRow");
  var codeBox = document.getElementById("codeBox");
  var codeIn = document.getElementById("codeIn");
  var codeErr = document.getElementById("codeErr");
  function showEnter(){ wait.style.display = "none"; codeBox.style.display = "none"; document.body.classList.remove("coding"); enterRow.style.display = "flex"; }
  function unlock(noFocus){
    // إذا كتبت كود هالدورة قبل هيك، ما بنسألها مرة ثانية لحد ما يتغير
    if (store(true, null, "gm_code_ok") === String(period())) { showEnter(); return; }
    wait.style.display = "none"; enterRow.style.display = "none"; codeBox.style.display = "flex"; document.body.classList.add("coding"); if (!noFocus) setTimeout(function(){codeIn.focus();},300);
  }
  // مكان الكود بيطلع على طول أول ما تفتح الرابط (البنت بتاخذ الكود من القناة قبل)
  unlock(true);
  var subs = document.querySelectorAll(".sub");
  for (var i = 0; i < subs.length; i++){
    subs[i].addEventListener("click", function(){
      clicked = true; leftAt = Date.now();
      if (codeBox.style.display !== "flex" && enterRow.style.display !== "flex") wait.style.display = "block";
      setTimeout(function(){ if (enterRow.style.display !== "flex") unlock(); }, 10000);
    });
  }
  document.addEventListener("visibilitychange", function(){
    if (clicked && document.visibilityState === "visible" && Date.now() - leftAt > 3000 && enterRow.style.display !== "flex") unlock();
  });
  function checkCode(){
    var v = norm(codeIn.value);
    if (v && (v === norm(codeFor(period())) || v === TEACHER)) {
      if (v === TEACHER) store(false, "1", "gm_teacher");   // جهاز المعلمة: بيظهر زر 👩‍🏫 بشاشة الألعاب
      store(false, String(period()), "gm_code_ok");
      store(false, "1");
      showEnter();
    } else {
      codeErr.style.display = "block";
      codeBox.classList.remove("shake"); void codeBox.offsetWidth; codeBox.classList.add("shake");
    }
  }
  document.getElementById("codeBtn").addEventListener("click", checkCode);
  codeIn.addEventListener("keydown", function(e){ if (e.key === "Enter") checkCode(); });
  enterBtn.addEventListener("click", function(){
    store(false, "1");
    try{ sessionStorage.setItem("gm_entered","1"); }catch(e){}
    location.href = APP_URL;
  });
</script>
</body>
</html>
