<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GamnaMarks — اشتركي بالقناة</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#0d0820}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:'Baloo Bhaijaan 2',sans-serif;color:#fff;padding:12px}
  .wrap{position:relative;width:100%;max-width:460px;max-height:calc(100vh - 24px);aspect-ratio:1083/1452}
  .wrap img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
  /* مناطق الضغط فوق الصورة (بالنسبة المئوية عشان تزبط على كل الشاشات) */
  /* لوجو GamnaMarks الدوّار (نفس فيديو الصفحة الرئيسية) جوّا الدائرة */
  .logoSpin{position:absolute;left:37.03%;top:10.88%;width:25.85%;height:19.28%;border-radius:50%;overflow:hidden;
            pointer-events:none}
  .logoSpin video{position:absolute;left:-32.5%;top:-39.6%;width:165%;height:165%;object-fit:cover}
  .hot{position:absolute;display:block;border-radius:60px;-webkit-tap-highlight-color:transparent;cursor:pointer}
  .hot:active{background:rgba(255,255,255,.12)}
  #ytBtn{left:18.5%;right:18.5%;top:66.6%;height:8.8%}
  #bellBtn{left:40%;right:40%;top:59.2%;height:6.4%}
  #bellNote{left:22%;right:22%;top:77.3%;height:4.2%}
  .pulse{position:absolute;left:18.5%;right:18.5%;top:66.6%;height:8.8%;border-radius:60px;pointer-events:none;
         box-shadow:0 0 0 0 rgba(255,60,60,.7);animation:pulse 1.8s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 14px rgba(255,60,60,0)}100%{box-shadow:0 0 0 0 rgba(255,60,60,0)}}
  .bottom{position:absolute;left:12%;right:12%;top:83.2%;text-align:center}
  .enterRow{display:none;align-items:center;justify-content:center;gap:8px;direction:ltr}
  .enterRow .enter{display:block;flex:1}
  .finger{font-size:34px;line-height:1;animation:point .8s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(255,200,0,.6))}
  @keyframes point{50%{transform:translateX(-10px)}}
  .wait{display:none;font-size:15px;opacity:.9}
  .enter{display:none;width:100%;padding:12px;border:none;border-radius:18px;cursor:pointer;
         font-family:inherit;font-size:18px;font-weight:800;color:#fff;
         background:linear-gradient(90deg,#3b82f6,#8b5cf6,#ec4899,#f97316);
         box-shadow:0 8px 24px rgba(139,92,246,.5);animation:pop .4s ease}
  @keyframes pop{from{transform:scale(.8);opacity:0}}
  .codeBox{display:none;flex-direction:column;gap:7px;width:100%;max-width:400px;margin-top:10px;text-align:center;animation:pop .4s ease}
  body.coding .wrap{max-height:calc(100vh - 200px)}
  .codeBox .lbl{font-size:14px;line-height:1.4}
  .codeBox input{width:100%;padding:10px;border-radius:14px;border:2px solid #8b5cf6;background:#1b1238;color:#fff;
       font-family:inherit;font-size:18px;text-align:center;outline:none}
  .codeBox button{padding:10px;border:none;border-radius:14px;font-family:inherit;font-size:16px;font-weight:800;color:#fff;cursor:pointer;
       background:linear-gradient(90deg,#3b82f6,#8b5cf6,#ec4899)}
  .codeBox .err{display:none;color:#ffb4b4;font-size:13px}
  #gmpPill{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:50;padding:6px 14px;border-radius:20px;
       background:linear-gradient(90deg,#f59e0b,#ec4899,#8b5cf6);color:#fff;text-decoration:none;font-size:14px;font-weight:800;
       box-shadow:0 4px 16px rgba(236,72,153,.45);white-space:nowrap;animation:pop .4s ease}
  html{scroll-behavior:smooth}
  #gmpBoard{scroll-margin-top:52px}
  .shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  /* أعلى بنتين بالنقاط هالشهر: جوّا الصورة تحت البطاقة (بدون ما يتحرك أي إشي) */
  #topTwo{position:absolute;left:3%;right:3%;top:93.2%;height:6.5%;display:none;align-items:center;justify-content:center;gap:3%;pointer-events:none;direction:rtl}
  #topTwo .chip{position:relative;flex:1;max-width:49%;height:100%;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;
       box-shadow:0 0 12px rgba(252,211,77,.55);animation:pop .6s ease}
  #topTwo .chip::before{content:"";position:absolute;left:50%;top:50%;width:300%;aspect-ratio:1;transform:translate(-50%,-50%);
       background:conic-gradient(#fcd34d,#f472b6,#8b5cf6,#38bdf8,#f97316,#fcd34d);animation:ttSpin 3s linear infinite}
  #topTwo .chip.c2::before{animation-duration:4.2s;animation-direction:reverse}
  #topTwo .chip::after{content:"";position:absolute;inset:2px;border-radius:16px;background:#160c35}
  #topTwo .in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;line-height:1.2;white-space:nowrap;font-size:min(3vw,13px);font-weight:800;color:#fff}
  #topTwo .l2{font-size:.85em}
  #topTwo .p{color:#fff;opacity:.95}
  #topTwo .star{display:inline-block;filter:drop-shadow(0 0 4px #fcd34d);animation:ttGlow 1.4s ease-in-out infinite}
  @keyframes ttGlow{50%{transform:scale(1.3) rotate(20deg);filter:drop-shadow(0 0 8px #fcd34d)}}
  #topTwo .m{display:inline-block;animation:ttFloat 2.4s ease-in-out infinite}
  #topTwo .k{color:#fcd34d}
  @keyframes ttSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  @keyframes ttFloat{50%{transform:translateY(-2px) rotate(-8deg)}}
</style>
</head>
<body>
<div class="wrap">
  <img src="subscribe-card.jpg" alt="اشتركي بقناة GamnaMarks على يوتيوب وفعّلي الجرس">
  <div class="logoSpin"><video autoplay muted loop playsinline preload="auto"><source src="gamnamarks-logo.mp4" type="video/mp4"></video></div>
  <div class="pulse"></div>
  <div id="topTwo"></div>
  <a id="ytBtn"   class="hot sub" href="https://www.youtube.com/@GamnaMarks?sub_confirmation=1" target="_blank" rel="noopener" aria-label="اشتركي بالقناة"></a>
  <a id="bellBtn" class="hot sub" href="https://www.youtube.com/@GamnaMarks?sub_confirmation=1" target="_blank" rel="noopener" aria-label="فعّلي الجرس"></a>
  <a id="bellNote" class="hot sub" href="https://www.youtube.com/@GamnaMarks?sub_confirmation=1" target="_blank" rel="noopener" aria-label="فعّلي الجرس"></a>
  <div class="bottom">
    <div id="wait" class="wait">⏳ اشتركي وفعّلي الجرس 🔔 وارجعي لهون…</div>
    <div id="enterRow" class="enterRow">
      <button id="enterBtn" class="enter">ادخلي اللعبة 🚀</button>
      <span class="finger">👈</span>
    </div>
  </div>
</div>
<div id="codeBox" class="codeBox">
      <div class="lbl">🔑 اكتبي الكود السري الموجود بآخر منشور على القناة</div>
      <input id="codeIn" type="text" autocomplete="off" placeholder="الكود السري">
      <button id="codeBtn">تأكيد ✅</button>
      <div id="codeErr" class="err">❌ الكود غلط أو قديم… شوفي آخر منشور بالقناة</div>
    </div>

<script>
  var APP_URL = "champions.html";       // بعد الكود: شاشة البطلات، وبعدها صفحة مسابقة النقاط، وبعدها التطبيق
  var KEY = "gm_subscribed";
  // ===== الكود السري: بيتغير لحاله كل ٣ أيام =====
  var CODES = ["نجمة","قمر","شمس","زيتونة","فراشة","غيمة","وردة","نحلة","بحر","جبل",
               "قوس قزح","سنبلة","نخلة","لؤلؤة","كوكب","برتقالة","حمامة","ياسمين","شجرة","مطر",
               "دلفين","بركان","مجرة","صقر","ليمونة","خلية","ذرة","مغناطيس","بوصلة","شلال"];
  var START = Date.UTC(2026, 10, 5);    // أول دورة: ٥ تشرين الثاني ٢٠٢٦
  var DAYS = 3, TEACHER = "amani2026";
  function period(){
    var n = new Date();
    var d = Math.floor((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) - START) / 86400000);
    return Math.floor(d / DAYS);
  }
  function codeFor(p){ var L = CODES.length; return CODES[(((p * 7 + 3) % L) + L) % L]; }
  function norm(t){
    return String(t||"").replace(/[ً-ْـ]/g,"").replace(/[أإآ]/g,"ا")
      .replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/\s+/g,"").toLowerCase();
  }
  function store(get, val, k){
    k = k || KEY;
    try{ return get ? localStorage.getItem(k) : localStorage.setItem(k, val); }catch(e){ return null; }
  }
  var clicked = false, leftAt = 0, codeOk = false;
  var enterBtn = document.getElementById("enterBtn");
  var wait = document.getElementById("wait");
  var enterRow = document.getElementById("enterRow");
  var codeBox = document.getElementById("codeBox");
  var codeIn = document.getElementById("codeIn");
  var codeErr = document.getElementById("codeErr");
  function showEnter(){ wait.style.display = "none"; codeBox.style.display = "none"; document.body.classList.remove("coding"); enterRow.style.display = "flex"; }
  function unlock(noFocus){
    // الكود مطلوب كل مرة بتنفتح فيها صفحة الدخول (ما بنتذكره على الجهاز)
    wait.style.display = "none"; enterRow.style.display = "none"; codeBox.style.display = "flex"; document.body.classList.add("coding"); if (!noFocus) setTimeout(function(){codeIn.focus();},300);
  }
  // مكان الكود بيطلع على طول أول ما تفتح الرابط (البنت بتاخذ الكود من القناة قبل)
  unlock(true);
  var subs = document.querySelectorAll(".sub");
  for (var i = 0; i < subs.length; i++){
    subs[i].addEventListener("click", function(){
      clicked = true; leftAt = Date.now();
      if (codeBox.style.display !== "flex" && enterRow.style.display !== "flex") wait.style.display = "block";
      setTimeout(function(){ if (enterRow.style.display !== "flex") unlock(); }, 10000);
    });
  }
  document.addEventListener("visibilitychange", function(){
    if (clicked && document.visibilityState === "visible" && Date.now() - leftAt > 3000 && enterRow.style.display !== "flex") unlock();
  });
  function checkCode(){
    var v = norm(codeIn.value);
    if (v && (v === norm(codeFor(period())) || v === TEACHER)) {
      if (v === TEACHER) store(false, "1", "gm_teacher");   // جهاز المعلمة: بيظهر زر 👩‍🏫 بشاشة الألعاب
      store(false, String(period()), "gm_code_ok");
      codeOk = true;
      store(false, "1");
      showEnter();
    } else {
      codeErr.style.display = "block";
      codeBox.classList.remove("shake"); void codeBox.offsetWidth; codeBox.classList.add("shake");
    }
  }
  document.getElementById("codeBtn").addEventListener("click", checkCode);
  codeIn.addEventListener("keydown", function(e){ if (e.key === "Enter") checkCode(); });
  enterBtn.addEventListener("click", function(){
    if (!codeOk) { unlock(); return; }   // ما في دخول بدون الكود الصحيح
    store(false, "1");
    try{ sessionStorage.setItem("gm_entered","1"); }catch(e){}
    /* شاشة البطلات بتنفتح فوق نفس الصفحة عشان الموسيقى تضل متواصلة بدون ما توقف */
    try{
      var fr=document.createElement('iframe'); fr.src=APP_URL+'?embed=1'; fr.setAttribute('allow','autoplay; fullscreen');
      fr.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2147483647;background:#070B22';
      document.body.appendChild(fr);
    }catch(e){ location.href = APP_URL; }
  });
</script>
<script>
/* أعلى بنتين (طالبات العمرية) بالنقاط المرصودة هالشهر، وجنب كل وحدة صفها وشعبتها */
(function(){
  if(!window.fetch) return;
  var URL='https://firestore.googleapis.com/v1/projects/cursed-castle-bb43b/databases/(default)/documents:runQuery?key=AIzaSyADxQ7-3UDxYD3VTOoVrn7d6516_5bqd5Y';
  var d=new Date(), mk='m'+d.getFullYear()+(d.getMonth()<9?'0':'')+(d.getMonth()+1);
  function val(v){ if(!v) return null; if('stringValue' in v) return v.stringValue; if('integerValue' in v) return +v.integerValue;
    if('doubleValue' in v) return +v.doubleValue; if('booleanValue' in v) return v.booleanValue; return null; }
  function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function hash(str){ var a=0x811c9dc5,b=0x01000193;
    for(var i=0;i<str.length;i++){ var c=str.charCodeAt(i); a=Math.imul(a^c,16777619)>>>0; b=Math.imul(b^c,2246822519)>>>0; }
    return a.toString(36)+b.toString(36); }
  /* اسم البنت + اسم العيلة: أول كلمة وآخر كلمة من اسمها بقائمة الشعبة */
  function shortFull(n){ var w=String(n||'').trim().split(/\s+/); return w.length>1 ? w[0]+' '+w[w.length-1] : w[0]||''; }
  var rosterP=fetch('https://firestore.googleapis.com/v1/projects/cursed-castle-bb43b/databases/(default)/documents/gm_roster/current?key=AIzaSyADxQ7-3UDxYD3VTOoVrn7d6516_5bqd5Y')
    .then(function(r){return r.ok?r.json():null;}).then(function(j){
      var map={}; try{ var R=JSON.parse(j.fields.data.stringValue);
        (R.sections||[]).forEach(function(sec){ (sec.students||[]).forEach(function(n){ map['st_'+hash(sec.name+'|'+n)]=n; }); });
      }catch(e){} return map; }).catch(function(){ return {}; });
  Promise.all([rosterP, fetch(URL,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({structuredQuery:{from:[{collectionId:'gm_points'}],orderBy:[{field:{fieldPath:mk},direction:'DESCENDING'}],limit:60}})})
  .then(function(r){return r.ok?r.json():[];})]).then(function(res){
    var names=res[0]||{}, rows=res[1];
    var top=(rows||[]).filter(function(x){return x.document;}).map(function(x){
      var f=x.document.fields||{};
      var pid=x.document.name.split('/').pop();
      return {name:names[pid]?shortFull(names[pid]):val(f.display),klass:val(f.klass),type:val(f.type),banned:val(f.banned),pts:val(f[mk])||0};
    }).filter(function(o){return o.type==='student' && !o.banned && o.pts>0 && o.name;}).slice(0,2);
    if(!top.length) return;
    var box=document.getElementById('topTwo'); if(!box) return;
    box.innerHTML=top.map(function(o,i){
      return '<div class="chip c'+(i+1)+'"><div class="in">'+
        '<div><span class="m">'+(i?'🥈':'🥇')+'</span> '+esc(o.name)+' <span class="star">🌟</span></div>'+
        '<div class="l2">'+(o.klass?'<span class="k">'+esc(o.klass)+'</span> · ':'')+'<span class="p">'+o.pts+' نقطة</span></div>'+
        '</div></div>';
    }).join('');
    box.style.display='flex';
  }).catch(function(){});
})();
</script>
<audio id="gmMus" src="gm-champ-music.mp3" loop preload="auto"></audio>
<script>
/* موسيقى الأبطال من صفحة الكود، وبتكمل على شاشة البطلات */
(function(){
  var m=document.getElementById('gmMus'); if(!m) return; m.volume=.8;
  function go(){ var p=m.play(); if(p&&p.catch)p.catch(function(){}); }
  go(); /* إذا الموبايل منع الصوت، بتشتغل أول ما البنت تلمس الشاشة أو تكتب الكود */
  ['pointerdown','touchstart','keydown'].forEach(function(ev){ document.addEventListener(ev,function(){ if(m.paused)go(); },{passive:true}); });
  function save(){ try{ sessionStorage.setItem('gm_mus_t', String(m.currentTime||0)); }catch(e){} }
  window.addEventListener('pagehide',save); window.addEventListener('beforeunload',save);
})();
</script>
</body>
</html>
