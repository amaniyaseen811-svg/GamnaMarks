            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #312e81 100%);

            justify-content: center;

        }

        }

            {q: 'هل يجوز تسجيل علامة تجارية مطابقة تماماً لعلامة موجودة بالفعل؟', options: [{text: 'نعم - لو لم يعترضوا على الطلب', correct: false}, {text: 'لا - مكتب العلامات التجارية سيرفض الطلب تلقائياً', correct: true}, {text: 'محدود - يجوز في بلد مختلف', correct: false}, {text: 'نعم - إذا دفعت رسوم أعلى', correct: false}], explanation: 'مكاتب العلامات التجارية ترفض تسجيل علامات مطابقة أو متشابهة جداً تلقائياً'},
            {q: 'هل يمكن تسجيل كلمة عامة جداً (مثل "ملابس") كعلامة تجارية؟', options: [{text: 'نعم - أي كلمة يمكن تسجيلها', correct: false}, {text: 'صعب جداً - الكلمات العامة والوصفية لا تسجل لأنها ملك الجميع', correct: true}, {text: 'نعم - إذا استخدمتها كثيراً', correct: false}, {text: 'لا - العلامات التجارية فقط', correct: false}], explanation: 'الكلمات الوصفية والعامة لا تسجل كعلامات تجارية لأن الجميع يحتاجها'},
            {q: 'صاحب ماركة شهيرة لم يدفع رسوم التجديد. هل تفقد الحماية؟', options: [{text: 'لا - الحماية دائمة مدى الحياة', correct: false}, {text: 'نعم - الحماية تنتهي وتصبح ملكاً عاماً', correct: true}, {text: 'محدود - الحماية تضعف نصفياً فقط', correct: false}, {text: 'لا - إذا استخدمها بنشاط حتى بدون دفع', correct: false}], explanation: 'العلامات التجارية تحتاج تجديد دوري (عادة كل 10 سنوات). عدم الدفع يعني فقدان الحماية'}
        ]
    }
];

let currentPage = 0;
let currentQuestion = 0;
let gameState = {
    score: 0,
    answeredQuestions: 0,
    totalQuestions: 0
};

function startGame() {
    document.getElementById('coverScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.add('show');
    renderPage();
}

function renderPage() {
    const page = gamePages[currentPage];
    const container = document.getElementById('gameContainer');
    
    if (!page) {
        renderResults();
        return;
    }
    
    if (page.type === 'info') {
        renderInfoPage(page);
    } else if (page.type === 'level') {
        renderLevelPage(page);
    }
}

function renderInfoPage(page) {
    const container = document.getElementById('gameContainer');
    const progressPercent = ((currentPage + 1) / gamePages.length) * 100;
    
    container.innerHTML = `
        <div class="page active info-page">
            <h1>${page.title}</h1>
            ${page.content}
            <div class="nav-buttons">
                ${currentPage > 0 ? `<button class="nav-button prev-btn" onclick="previousPage()">← السابق</button>` : ''}
                <button class="nav-button next-btn" onclick="nextPage()">التالي →</button>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: ${progressPercent}%"></div>
            </div>
        </div>
    `;
}

function renderLevelPage(page) {
    const container = document.getElementById('gameContainer');
    gameState.totalQuestions = page.questions.length;
    currentQuestion = 0;
    
    container.innerHTML = `
        <div class="page active level-page">
            <div class="level-header">
                <h2>${page.title}</h2>
                <div class="level-info">
                    <div class="score-display">📊 النقاط: <strong>${gameState.score}</strong></div>
                    <div class="question-counter">السؤال <strong id="qNum">1</strong> من <strong>${page.questions.length}</strong></div>
                </div>
            </div>
            <div id="questionArea"></div>
            <div class="progress-bar">
                <div class="progress-fill" id="levelProgress" style="width: 0%"></div>
            </div>
        </div>
    `;
    
    renderQuestion(page.questions[0], 0);
}

function renderQuestion(question, index) {
    const area = document.getElementById('questionArea');
    
    area.innerHTML = `
        <div class="question-container">
            <div class="question-number">${index + 1}</div>
            <div class="question-text">${question.q}</div>
            <div class="options">
                ${question.options.map((opt, optIdx) => `
                    <label class="option">
                        <input type="radio" name="answer" value="${optIdx}" onchange="checkAnswer(${index}, ${optIdx}, ${opt.correct}, '${question.explanation}', ${gamePages[currentPage].questions.length})">
                        <span class="option-label">${opt.text}</span>
                    </label>
                `).join('')}
            </div>
            <div class="feedback" id="feedback"></div>
        </div>
    `;
}

function checkAnswer(qIdx, optIdx, isCorrect, explanation, totalQuestions) {
    const feedback = document.getElementById('feedback');
    const options = document.querySelectorAll('.option');
    
    options.forEach((opt, idx) => {
        opt.classList.add('disabled');
        if (idx === optIdx) {
            opt.classList.add(isCorrect ? 'correct' : 'wrong');
        }
    });
    
    const feedbackClass = isCorrect ? 'correct' : 'wrong';
    const feedbackText = isCorrect ? '✓ صحيح!' : '✗ خطأ';
    feedback.className = `feedback show ${feedbackClass}`;
    feedback.innerHTML = `
        <div class="feedback-text">${feedbackText}</div>
        <div class="answer-explanation">${explanation}</div>
    `;
    
    if (isCorrect) {
        gameState.score += 10;
        gameState.answeredQuestions++;
    }
    
    const progressPercent = ((qIdx + 1) / totalQuestions) * 100;
    document.getElementById('levelProgress').style.width = progressPercent + '%';
    
    setTimeout(() => {
        nextQuestion(totalQuestions);
    }, 2500);
}

function nextQuestion(totalQuestions) {
    const page = gamePages[currentPage];
    currentQuestion++;
    
    if (currentQuestion < page.questions.length) {
        document.getElementById('qNum').textContent = currentQuestion + 1;
        renderQuestion(page.questions[currentQuestion], currentQuestion);
    } else {
        nextPage();
    }
}

function nextPage() {
    currentPage++;
    currentQuestion = 0;
    renderPage();
    window.scrollTo(0, 0);
}

function previousPage() {
    if (currentPage > 0) {
        currentPage--;
        currentQuestion = 0;
        renderPage();
        window.scrollTo(0, 0);
    }
}

function renderResults() {
    const container = document.getElementById('gameContainer');
    const totalPossible = gamePages.filter(p => p.type === 'level').reduce((sum, p) => sum + p.questions.length, 0) * 10;
    const percentage = (gameState.score / totalPossible) * 100;
    
    let award = '';
    if (percentage >= 90) award = '💎 جائزة ذهبية - خبيرة حماية الملكية الفكرية';
    else if (percentage >= 75) award = '🥈 جائزة فضية - متخصصة في الملكية الفكرية';
    else if (percentage >= 60) award = '🥉 جائزة برونزية - متعلمة الملكية الفكرية';
    else award = '📜 شهادة الإتمام';
    
    container.innerHTML = `
        <div class="results-page">
            <div class="trophy">🏆</div>
            <div class="results-title">مبروووك! 🎉</div>
            <div class="final-score">أنهيتِ اللعبة بنجاح!</div>
            <div class="rewards-box">
                <div class="reward-item">⭐ النقاط: <strong>${gameState.score}</strong></div>
                <div class="reward-item">📊 النسبة: <strong>${percentage.toFixed(1)}%</strong></div>
                <div class="reward-item">🎓 <strong>${award}</strong></div>
                <div class="reward-item">📝 أسئلة صحيحة: <strong>${gameState.answeredQuestions}</strong></div>
            </div>
            <button class="next-btn-auto" onclick="location.reload()">🎮 لعبة جديدة</button>
        </div>
    `;
}
</script>
