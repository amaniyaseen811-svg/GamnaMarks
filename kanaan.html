<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>لغز الأرجوان — قضية أرض كنعان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --night:#141020; --night2:#1f1733; --night3:#2b2145;
  --clay:#ecdcbb; --clay2:#d6c096; --clay3:#b9a077;
  --purple:#7a2f68; --purple2:#a8478f; --purple3:#c96fb0;
  --gold:#e5ac2e; --gold2:#f7d271;
  --green:#12855a; --red:#c53049;
  --ink:#241a2e; --ink2:#4a3a55;
  --r:18px;
  --fd:'Amiri','Times New Roman',serif;
  --fb:'Tajawal','Segoe UI',system-ui,sans-serif;
}
/* ===== خلفية ساحرة تتغيّر مع كل سؤال ===== */
#kbg{position:fixed;inset:-7%;z-index:0;pointer-events:none;
  background-size:cover;background-position:center;
  opacity:0;transition:opacity 1.1s ease;
  animation:kbgA 34s ease-in-out infinite alternate;will-change:transform}
#kbg.on{opacity:.30}
#kbg.m2{animation-name:kbgB;animation-duration:29s}
#kbg.m3{animation-name:kbgC;animation-duration:37s}
#kbgVeil{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(115% 90% at 50% 8%,rgba(20,16,32,.10) 0%,rgba(20,16,32,.55) 58%,rgba(20,16,32,.86) 100%)}
#app{position:relative;z-index:1}
@keyframes kbgA{0%{transform:scale(1.05) translate(0,0)}50%{transform:scale(1.14) translate(-2%,-1.6%)}100%{transform:scale(1.07) translate(1.8%,1.4%)}}
@keyframes kbgB{0%{transform:scale(1.12) translate(1.8%,1.2%)}50%{transform:scale(1.05) translate(-1.6%,.8%)}100%{transform:scale(1.13) translate(1.2%,-1.8%)}}
@keyframes kbgC{0%{transform:scale(1.06) translate(-1.8%,.8%)}50%{transform:scale(1.15) translate(1.8%,-1.2%)}100%{transform:scale(1.05) translate(-.8%,-1.8%)}}
@media (prefers-reduced-motion:reduce){#kbg{animation:none}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--night); color:var(--clay); font-family:var(--fb);
  overflow-x:hidden; overscroll-behavior:none;
  background-image:
    radial-gradient(120% 80% at 80% -10%, rgba(122,47,104,.42), transparent 60%),
    radial-gradient(100% 70% at 10% 110%, rgba(18,133,90,.22), transparent 60%);
  background-attachment:fixed;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ============ SHELL ============ */
#app{max-width:820px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 14px 26px}
#screens{flex:1;display:flex;flex-direction:column;min-height:0}
.screen{display:none;flex:1;flex-direction:column;animation:fade .45s ease both}
.screen.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85);opacity:0}65%{transform:scale(1.04);opacity:1}100%{transform:scale(1)}}

/* ============ TOP BAR ============ */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;
  padding:9px 0 8px;background:linear-gradient(180deg,var(--night) 62%,transparent)}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(236,220,187,.09);
  border:1px solid rgba(236,220,187,.2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.chip.gold{color:var(--gold2);border-color:rgba(229,172,46,.45);background:rgba(229,172,46,.12)}
.iconbtn{width:40px;height:40px;border-radius:12px;background:rgba(236,220,187,.09);
  border:1px solid rgba(236,220,187,.2);display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.iconbtn:active{transform:scale(.92)}
.grow{flex:1}

/* ============ TABLET (SIGNATURE) ============ */
.tablet{background:linear-gradient(155deg,#3a2b16,#241a12);border:2px solid #5c4526;
  border-radius:14px;padding:10px 12px;display:flex;gap:5px;justify-content:center;flex-wrap:wrap;
  box-shadow:inset 0 3px 14px rgba(0,0,0,.6), 0 6px 20px rgba(0,0,0,.4)}
.tletter{width:30px;height:38px;display:grid;place-items:center;border-radius:7px;
  font-family:var(--fd);font-size:23px;font-weight:700;color:#6b5836;
  background:rgba(0,0,0,.3);border:1px solid #4b3a20;transition:.5s}
.tletter.on{color:#231705;background:linear-gradient(160deg,var(--gold2),var(--gold));
  border-color:var(--gold2);box-shadow:0 0 18px rgba(229,172,46,.7);animation:pop .5s}

/* ============ TYPE ============ */
h1,h2,h3{margin:0;font-family:var(--fd);font-weight:700;line-height:1.3}
.title{font-size:clamp(30px,9vw,52px);color:var(--clay);letter-spacing:-.5px}
.title em{font-style:normal;color:var(--purple3);display:block}
.sub{font-size:15px;color:var(--clay3);font-weight:500;line-height:1.8}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--purple3);margin-bottom:6px}

/* ============ BUTTONS ============ */
.btn{display:block;width:100%;padding:16px 18px;border-radius:var(--r);font-size:17px;font-weight:800;
  background:linear-gradient(160deg,var(--purple2),var(--purple));color:#fff;
  box-shadow:0 8px 22px rgba(122,47,104,.45);transition:.15s;text-align:center}
.btn:active{transform:translateY(2px) scale(.99);box-shadow:0 4px 12px rgba(122,47,104,.4)}
.btn.gold{background:linear-gradient(160deg,var(--gold2),var(--gold));color:#2a1c04;
  box-shadow:0 8px 22px rgba(229,172,46,.4)}
.btn.ghost{background:rgba(236,220,187,.08);border:1px solid rgba(236,220,187,.24);
  color:var(--clay);box-shadow:none;font-size:15px;padding:13px}
.btn.sm{padding:11px 14px;font-size:14px;border-radius:13px}
.row{display:flex;gap:10px}.row>*{flex:1}

/* ============ CARD PANEL ============ */
.panel{background:linear-gradient(165deg,rgba(236,220,187,.09),rgba(236,220,187,.04));
  border:1px solid rgba(236,220,187,.17);border-radius:22px;padding:18px;backdrop-filter:blur(6px)}

/* ============ SPEAKER / DIALOGUE ============ */
.speech{display:flex;gap:12px;align-items:flex-start;margin:12px 0;animation:fade .5s both}
.avatar{width:56px;height:56px;border-radius:16px;flex:0 0 auto;display:grid;place-items:center;
  font-size:29px;border:2px solid;background:var(--night2)}
.av-zaydan{border-color:var(--gold);background:radial-gradient(circle at 35% 30%,#4a3a20,#221a10)}
.av-kanaan{border-color:#e08a3c;background:radial-gradient(circle at 35% 30%,#4a3018,#20140a)}
.av-adonia{border-color:var(--purple3);background:radial-gradient(circle at 35% 30%,#4a2044,#1e0e1c)}
.av-shadow{border-color:#5a5a6a;background:radial-gradient(circle at 35% 30%,#2a2a34,#0a0a0e)}
.av-narr{border-color:var(--clay3);background:radial-gradient(circle at 35% 30%,#3a3020,#181410)}
.bubble{flex:1;background:rgba(236,220,187,.08);border:1px solid rgba(236,220,187,.16);
  border-radius:18px;border-top-right-radius:5px;padding:12px 15px}
.who{font-size:12px;font-weight:800;color:var(--purple3);margin-bottom:3px}
.said{font-size:16.5px;line-height:1.85;font-weight:500}
.speech.shadow .bubble{background:rgba(10,10,16,.75);border-color:#3d3d4d;border-top-right-radius:5px}
.speech.shadow .said{color:#c9c9d6;font-family:var(--fd);font-size:19px}
.speech.shadow .who{color:#8e8ea3}

/* ============ QUESTION ============ */
.qhead{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.qnum{font-family:var(--fd);font-size:14px;font-weight:700;color:var(--gold);
  border:1px solid rgba(229,172,46,.4);border-radius:9px;padding:4px 10px;flex:0 0 auto}
.qtext{font-size:clamp(19px,5vw,25px);font-weight:800;line-height:1.65;margin:6px 0 16px;color:#fff}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{width:100%;text-align:right;padding:15px 16px;border-radius:16px;font-size:16.5px;font-weight:700;
  line-height:1.6;background:linear-gradient(160deg,var(--clay),var(--clay2));color:var(--ink);
  border:2px solid transparent;box-shadow:0 5px 14px rgba(0,0,0,.35);transition:.15s;
  display:flex;gap:11px;align-items:center}
.opt:active{transform:scale(.985)}
.opt .k{width:30px;height:30px;border-radius:9px;background:rgba(36,26,46,.14);display:grid;
  place-items:center;font-family:var(--fd);font-size:17px;flex:0 0 auto}
.opt.ok{background:linear-gradient(160deg,#28c07d,var(--green));color:#fff;border-color:#7ff0bd}
.opt.no{background:linear-gradient(160deg,#e05a70,var(--red));color:#fff;opacity:.85}
.opt.dim{opacity:.42}
.opt[disabled]{cursor:default}

/* ============ FEEDBACK ============ */
.fact{margin-top:14px;background:rgba(229,172,46,.11);border:1px solid rgba(229,172,46,.35);
  border-radius:16px;padding:14px;animation:pop .4s}
.fact b{color:var(--gold2);display:block;margin-bottom:5px;font-size:14px}
.fact p{margin:0;font-size:15.5px;line-height:1.85;color:var(--clay)}

/* ============ MECHANIC: SLIDER ============ */
.slidewrap{padding:8px 2px 2px}
.slideval{text-align:center;font-family:var(--fd);font-size:40px;font-weight:700;color:var(--gold2);margin-bottom:4px}
.slidelbl{text-align:center;font-size:13px;color:var(--clay3);margin-bottom:14px}
input[type=range]{width:100%;height:36px;-webkit-appearance:none;background:none}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:9px;
  background:linear-gradient(90deg,var(--purple),var(--gold))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,var(--gold));margin-top:-13px;border:3px solid #fff;
  box-shadow:0 4px 12px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:12px;border-radius:9px;background:linear-gradient(90deg,var(--purple),var(--gold))}
input[type=range]::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:var(--gold);border:3px solid #fff}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--clay3);margin-top:2px}

/* ============ MECHANIC: SCRAMBLE ============ */
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.slot{width:52px;height:62px;border-radius:12px;border:2px dashed rgba(236,220,187,.35);
  display:grid;place-items:center;font-family:var(--fd);font-size:30px;font-weight:700;background:rgba(0,0,0,.25)}
.slot.filled{border-style:solid;border-color:var(--gold);background:linear-gradient(160deg,var(--clay),var(--clay2));color:var(--ink)}
.pool{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.tile{width:52px;height:62px;border-radius:12px;font-family:var(--fd);font-size:30px;font-weight:700;
  background:linear-gradient(160deg,var(--clay),var(--clay2));color:var(--ink);
  box-shadow:0 5px 12px rgba(0,0,0,.4);transition:.15s}
.tile:active{transform:scale(.9)}
.tile.used{opacity:.25;pointer-events:none}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}

/* ============ MECHANIC: MAP ============ */
.mapbox{position:relative;background:linear-gradient(165deg,#1c2a22,#101a16);border:1px solid rgba(236,220,187,.2);
  border-radius:20px;padding:10px;margin:6px 0 4px}
.mapbox svg{display:block;width:100%;height:auto;max-height:52vh}
.mland{fill:#2f4a38;stroke:var(--clay3);stroke-width:2}
.msea{fill:#16324a}
.mriver{stroke:#4d86b5;stroke-width:4;fill:none;stroke-linecap:round}
.hot{cursor:pointer}
.hot circle{fill:rgba(229,172,46,.28);stroke:var(--gold);stroke-width:2.5;transition:.2s}
.hot text{fill:var(--clay);font-size:11px;font-weight:800;font-family:var(--fb);text-anchor:middle}
.hot:active circle{fill:rgba(229,172,46,.6)}
.hot.ok circle{fill:#12855a;stroke:#7ff0bd;stroke-width:4}
.hot.no circle{fill:var(--red);stroke:#ffb3bf}

/* ============ MECHANIC: TORCH ============ */
.torchbox{position:relative;height:270px;border-radius:20px;overflow:hidden;margin:6px 0;
  background:#0a0810;border:1px solid rgba(236,220,187,.18);touch-action:none;cursor:grab}
.torchscene{position:absolute;inset:0;display:grid;place-items:center;padding:26px;text-align:center}
.torchscene p{font-family:var(--fd);font-size:23px;line-height:2;color:var(--clay);margin:0}
.torchmask{position:absolute;inset:0;background:#07060c;
  -webkit-mask-image:radial-gradient(circle 78px at var(--tx,50%) var(--ty,50%),transparent 0,transparent 62px,#000 78px);
  mask-image:radial-gradient(circle 78px at var(--tx,50%) var(--ty,50%),transparent 0,transparent 62px,#000 78px)}
.torchglow{position:absolute;width:170px;height:170px;border-radius:50%;pointer-events:none;
  left:var(--tx,50%);top:var(--ty,50%);transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(229,172,46,.3),transparent 68%)}
.hintline{text-align:center;font-size:13px;color:var(--clay3);margin:4px 0 10px}

/* ============ MECHANIC: REVEAL ============ */
.revealbox{position:relative;height:190px;border-radius:20px;overflow:hidden;margin:8px 0;
  display:grid;place-items:center;background:linear-gradient(160deg,var(--purple),#2b1226);
  border:1px solid rgba(236,220,187,.2)}
.revealbox span{font-size:78px;filter:blur(var(--bl,22px));transition:filter .6s;display:block}
.revbar{height:8px;border-radius:99px;background:rgba(236,220,187,.15);overflow:hidden;margin-bottom:10px}
.revbar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple2),var(--gold));width:0;transition:.5s}

/* ============ MECHANIC: TIMED ============ */
.timerbar{height:10px;border-radius:99px;background:rgba(236,220,187,.14);overflow:hidden;margin-bottom:12px}
.timerbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold),var(--red));
  width:100%;transition:width 1s linear}
.timerbar.warn i{background:var(--red)}

/* ============ MECHANIC: LISTEN ============ */
.listenbox{text-align:center;padding:22px 12px}
.bigear{width:110px;height:110px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;
  font-size:50px;background:radial-gradient(circle at 35% 30%,var(--purple2),var(--purple));
  box-shadow:0 0 0 0 rgba(168,71,143,.6);animation:ring 2s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(168,71,143,.55)}70%{box-shadow:0 0 0 34px rgba(168,71,143,0)}100%{box-shadow:0 0 0 0 rgba(168,71,143,0)}}
.hidden-q{filter:blur(9px);user-select:none;opacity:.55}

/* ============ HAND / CARDS ============ */
.handwrap{margin-top:6px}
.sectitle{font-family:var(--fd);font-size:21px;color:var(--gold2);margin:16px 0 9px;
  display:flex;align-items:center;gap:9px}
.sectitle:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(229,172,46,.5),transparent)}
.hand{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;min-height:96px}
.pcard{width:74px;height:100px;border-radius:13px;position:relative;flex:0 0 auto;
  background:linear-gradient(160deg,var(--clay),var(--clay2));color:var(--ink);
  box-shadow:0 6px 16px rgba(0,0,0,.45);border:2px solid transparent;transition:.16s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px}
.pcard:active{transform:scale(.94)}
.pcard .num{font-family:var(--fd);font-size:29px;font-weight:700;line-height:1}
.pcard .fam{font-size:20px}
.pcard .fnm{font-size:9.5px;font-weight:800;opacity:.72}
.pcard.sel{border-color:var(--gold);transform:translateY(-11px);box-shadow:0 12px 22px rgba(229,172,46,.4)}
.pcard.fake{background:linear-gradient(160deg,#54506a,#39344d);color:#e2dff0;border:2px solid #16121e}
.pcard.fake:before{content:'';position:absolute;inset:-2px;border-radius:13px;
  box-shadow:inset 0 0 0 4px #0b0910;pointer-events:none}
.pcard.new{animation:pop .45s}
.locked{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.lgroup{display:flex;gap:2px;background:rgba(229,172,46,.14);border:1px solid rgba(229,172,46,.4);
  border-radius:11px;padding:5px 7px;align-items:center}
.lgroup b{font-family:var(--fd);font-size:16px;color:var(--gold2)}
.famlegend{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:9px 0 0;font-size:11.5px;color:var(--clay3)}
.famlegend span{background:rgba(236,220,187,.08);border-radius:9px;padding:4px 9px}
.note{font-size:13.5px;color:var(--clay3);line-height:1.8;text-align:center;margin:10px 0 0}
.warnmsg{background:rgba(197,48,73,.16);border:1px solid rgba(197,48,73,.5);border-radius:14px;
  padding:11px;font-size:14px;font-weight:700;text-align:center;margin-top:10px;animation:pop .3s}

/* ============ PLAYERS / SCOREBOARD ============ */
.pbar{display:flex;gap:8px;overflow-x:auto;padding:3px 0 7px;scrollbar-width:none}
.pbar::-webkit-scrollbar{display:none}
.ptag{flex:0 0 auto;border-radius:14px;padding:8px 13px;background:rgba(236,220,187,.07);
  border:1px solid rgba(236,220,187,.18);text-align:center;min-width:92px}
.ptag.act{background:linear-gradient(160deg,var(--purple2),var(--purple));border-color:var(--purple3);
  box-shadow:0 5px 16px rgba(122,47,104,.5)}
.ptag .pn{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.ptag .ps{font-family:var(--fd);font-size:19px;color:var(--gold2);font-weight:700}
.ptag.act .ps{color:#fff}

/* ============ PASS DEVICE ============ */
.pass{text-align:center;padding:46px 16px}
.pass .em{font-size:74px;margin-bottom:10px}
.pass h2{font-size:29px;color:var(--gold2);margin-bottom:8px}

/* ============ MODE CARDS ============ */
.modes{display:flex;flex-direction:column;gap:11px;margin-top:14px}
.mode{display:flex;gap:13px;align-items:center;text-align:right;width:100%;padding:15px;
  border-radius:19px;background:linear-gradient(165deg,rgba(236,220,187,.1),rgba(236,220,187,.04));
  border:1px solid rgba(236,220,187,.18);transition:.16s}
.mode:active{transform:scale(.98)}
.mode.on{border-color:var(--gold);background:rgba(229,172,46,.13)}
.mode .ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:26px;
  background:rgba(122,47,104,.4);border:1px solid var(--purple2);flex:0 0 auto}
.mode .t{font-size:17px;font-weight:800;color:#fff}
.mode .d{font-size:13px;color:var(--clay3);line-height:1.65;margin-top:2px}

/* ============ CASE SELECT ============ */
.cases{display:flex;flex-direction:column;gap:12px}
.casebtn{display:flex;gap:13px;align-items:center;width:100%;text-align:right;padding:16px;border-radius:20px;
  background:linear-gradient(160deg,rgba(122,47,104,.35),rgba(122,47,104,.12));
  border:1px solid var(--purple2);transition:.16s}
.casebtn:active{transform:scale(.98)}
.casebtn.done{background:rgba(18,133,90,.18);border-color:var(--green)}
.casebtn.lock{opacity:.42;filter:grayscale(.6)}
.casebtn .cn{font-family:var(--fd);font-size:32px;color:var(--gold2);width:44px;text-align:center;flex:0 0 auto}
.casebtn .ct{font-size:18px;font-weight:800;color:#fff}
.casebtn .cd{font-size:13px;color:var(--clay3);margin-top:2px}

/* ============ INPUT ============ */
.field{width:100%;padding:15px;border-radius:16px;background:rgba(236,220,187,.1);
  border:2px solid rgba(236,220,187,.25);color:#fff;font-size:17px;font-weight:700;font-family:inherit;text-align:center}
.field::placeholder{color:rgba(236,220,187,.4)}
.field:focus{outline:none;border-color:var(--gold)}
.lbl{font-size:14px;font-weight:700;color:var(--clay3);margin:14px 0 7px;display:block}
.seg{display:flex;gap:7px}
.seg button{flex:1;padding:12px 6px;border-radius:13px;background:rgba(236,220,187,.08);
  border:1px solid rgba(236,220,187,.2);font-size:14px;font-weight:800;transition:.15s}
.seg button.on{background:linear-gradient(160deg,var(--gold2),var(--gold));color:#2a1c04;border-color:var(--gold2)}

/* ============ TROPHY ============ */
.trophy{text-align:center;padding:22px 8px}
.cup{font-size:96px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
.medal{display:inline-block;background:linear-gradient(160deg,var(--gold2),var(--gold));color:#2a1c04;
  border-radius:999px;padding:9px 22px;font-size:17px;font-weight:900;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}
.stat{background:rgba(236,220,187,.08);border:1px solid rgba(236,220,187,.18);border-radius:16px;padding:13px 6px}
.stat b{display:block;font-family:var(--fd);font-size:27px;color:var(--gold2)}
.stat span{font-size:11.5px;color:var(--clay3)}
.rank{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:16px;margin-bottom:8px;
  background:rgba(236,220,187,.07);border:1px solid rgba(236,220,187,.16)}
.rank.first{background:linear-gradient(160deg,rgba(229,172,46,.28),rgba(229,172,46,.1));border-color:var(--gold)}
.rank .pos{font-family:var(--fd);font-size:26px;color:var(--gold2);width:36px;text-align:center}
.rank .nm{flex:1;font-size:16px;font-weight:800}
.rank .sc{font-family:var(--fd);font-size:22px;color:var(--gold2)}

/* ============ SHADOW SCENE ============ */
.shadowscene{background:linear-gradient(180deg,#0a0810,#15111f);border:1px solid #3a3348;
  border-radius:22px;padding:20px;position:relative;overflow:hidden}
.shadowscene:before{content:'';position:absolute;inset:0;
  background:radial-gradient(60% 50% at 50% 0%,rgba(120,110,150,.22),transparent 70%)}
.shadowscene>*{position:relative}
.smoke{font-size:64px;text-align:center;filter:blur(.4px);animation:float 4s ease-in-out infinite}

/* ============ MISC ============ */
.center{text-align:center}
.mt{margin-top:16px}.mt2{margin-top:26px}
.flagline{height:5px;border-radius:99px;margin:0 0 12px;
  background:linear-gradient(90deg,#000 0 25%,#fff 25% 50%,var(--green) 50% 75%,var(--red) 75% 100%)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;
  background:rgba(20,16,32,.96);border:1px solid var(--gold);color:var(--clay);
  border-radius:16px;padding:13px 20px;font-size:15px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.6);
  animation:pop .3s;max-width:88vw;text-align:center}
.small{font-size:12.5px;color:var(--clay3);line-height:1.75}

/* ============ COVER / INTRO VIDEO ============ */
.coverwrap{position:relative;flex:1;display:flex;flex-direction:column;
  border-radius:22px;overflow:hidden;margin:10px 0;min-height:78vh;background:var(--night)}
.covervid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.92}
.covervid.full{object-fit:contain;background:#000;opacity:1}
.coverwrap:after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(20,16,32,.5) 0%,rgba(20,16,32,0) 30%,rgba(20,16,32,.82) 78%,var(--night) 100%)}
.coverui{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;
  justify-content:flex-end;padding:20px 16px 18px}
.coverfx{position:absolute;inset:0;display:none;place-items:center;padding:24px}
.coverfx.on{display:grid}
.lessonbar{position:sticky;top:52px;z-index:30;display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,var(--night) 70%,transparent);padding:8px 0 10px}
.lessontime{font-family:var(--fd);font-size:22px;font-weight:700;color:var(--gold2);
  background:rgba(229,172,46,.12);border:1px solid rgba(229,172,46,.4);border-radius:12px;padding:4px 12px}
.lic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;
  background:rgba(122,47,104,.4);border:1px solid var(--purple2);flex:0 0 auto}
.lcard{animation:fade .5s both}
.gnum{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto;
  font-family:var(--fd);font-size:22px;font-weight:700;color:#2a1c04;
  background:linear-gradient(160deg,var(--gold2),var(--gold))}
.cfx-glow{position:absolute;width:78%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(168,71,143,.55),transparent 68%);animation:float 4s ease-in-out infinite}

/* ============ MUSIC BUTTON (ثابت بكل الشاشات) ============ */
.musicbtn{position:fixed;top:10px;left:10px;z-index:95;width:46px;height:46px;border-radius:14px;
  display:grid;place-items:center;font-size:20px;background:rgba(20,16,32,.85);
  border:1px solid rgba(236,220,187,.28);color:var(--clay);backdrop-filter:blur(6px);
  box-shadow:0 4px 14px rgba(0,0,0,.5);transition:.15s}
.musicbtn:active{transform:scale(.9)}
.musicbtn.off{opacity:.55;border-color:rgba(236,220,187,.15)}
.musicbtn:after{content:attr(data-lbl);position:absolute;top:50px;left:0;font-size:10px;
  font-weight:800;color:var(--clay3);white-space:nowrap;background:rgba(20,16,32,.85);
  padding:2px 6px;border-radius:7px}

/* ===== لغة البيكر ===== */
#langPicker{
  position:fixed;top:12px;right:12px;z-index:999;
  background:rgba(20,16,32,.7);backdrop-filter:blur(8px);
  border:2px solid rgba(229,172,46,.3);border-radius:999px;
  padding:8px 12px;display:flex;gap:5px;flex-wrap:wrap;
  max-width:90vw;justify-content:center;
}
.lang-btn{
  background:rgba(236,220,187,.09);border:1.5px solid rgba(236,220,187,.2);
  border-radius:999px;padding:6px 11px;color:var(--clay);cursor:pointer;
  font-size:.85rem;font-weight:700;transition:.2s;font-family:inherit;
  white-space:nowrap;
}
.lang-btn:hover{background:rgba(229,172,46,.15);border-color:var(--gold);transform:scale(1.05)}
.lang-btn.active{background:linear-gradient(160deg,var(--gold2),var(--gold));
  color:#2a1c04;box-shadow:0 0 14px rgba(229,172,46,.5)}
@media (max-width:500px){
  #langPicker{position:static;margin:0 0 12px;gap:4px;padding:6px 8px}
  .lang-btn{font-size:.75rem;padding:5px 9px}
}
</style>
</head>
<body>
<div id="kbg"></div>
<div id="kbgVeil"></div>
<!-- لغة البيكر - 8 لغات -->
<div id="langPicker">
  <button class="lang-btn active" onclick="window.setLang('ar')" data-lang="ar">العربية</button>
  <button class="lang-btn" onclick="window.setLang('en')" data-lang="en">English</button>
  <button class="lang-btn" onclick="window.setLang('fr')" data-lang="fr">Français</button>
  <button class="lang-btn" onclick="window.setLang('es')" data-lang="es">Español</button>
  <button class="lang-btn" onclick="window.setLang('sv')" data-lang="sv">Svenska</button>
  <button class="lang-btn" onclick="window.setLang('ru')" data-lang="ru">Русский</button>
  <button class="lang-btn" onclick="window.setLang('zh')" data-lang="zh">中文</button>
  <button class="lang-btn" onclick="window.setLang('hi')" data-lang="hi">हिंदी</button>
</div>

<div id="app">
  <div class="topbar" id="topbar" style="display:none">
    <button class="iconbtn" id="btnMute" aria-label="كتم الصوت">🔊</button>
    <button class="iconbtn" id="btnReplay" aria-label="أعيدي السماع">🔁</button>
    <div class="grow"></div>
    <span class="chip gold" id="chipScore">٠</span>
    <button class="iconbtn" id="btnHome" aria-label="الرئيسية">🏠</button>
  </div>
  <div id="screens"></div>
</div>
<button class="musicbtn" id="btnMusic" data-lbl="الموسيقى" aria-label="تشغيل أو إيقاف الموسيقى">🎵</button>
<audio id="bgm" loop preload="auto"></audio>
<script>
/* ==========================================================
   لغز الأرجوان — قضية أرض كنعان
   لعبة تحقيق تعليمية | الصف السادس | المعلمة أماني داوود
   ========================================================== */

let QUESTIONS = [{"id":1,"level":1,"q":"من أول شعب سكن فلسطين وبنى حضارتها؟","options":["الكنعانيون","الرومان","العثمانيون"],"correct":0,"fact":"الكنعانيون هاجروا من الجزيرة العربية قبل 4000 سنة وبنوا أكثر من 200 مدينة في فلسطين.","hint":"اسمهم يبدأ بحرف الكاف"},{"id":2,"level":1,"q":"لماذا سميت فلسطين بأرض كنعان؟","options":["نسبةً للكنعانيين الذين سكنوها","نسبةً لجبل كنعان","نسبةً لنهر كنعان"],"correct":0,"fact":"سميت أرض كنعان نسبة إلى الكنعانيين الذين عمّروها وجعلوها جنة خضراء.","hint":"الاسم مرتبط بالسكان الأوائل"},{"id":3,"level":1,"q":"ما هي أقدم مدينة في فلسطين والعالم؟","options":["أريحا","القدس","غزة"],"correct":0,"fact":"أريحا أقدم مدينة مأهولة في التاريخ، بناها الكنعانيون وتسمى مدينة القمر.","hint":"تقع في غور الأردن"},{"id":4,"level":1,"q":"كم يقدّر عمر مدينة أريحا؟","options":["حوالي 10 آلاف سنة","حوالي 1000 سنة","حوالي 500 سنة"],"correct":0,"fact":"تل السلطان في أريحا يثبت أن عمرها 10,000 سنة، وفيها أقدم سور في العالم.","hint":"أقدم من الأهرامات بكثير"},{"id":5,"level":1,"q":"ماذا تعني كلمة كنعان؟","options":["الأرض المنخفضة وأرض الأرجوان","الأرض المرتفعة","الأرض الصحراوية"],"correct":0,"fact":"كنعان تعني الأرض المنخفضة، وأيضاً أرض الأرجوان لأنهم اشتهروا بصناعة اللون الأرجواني الثمين.","hint":"لها معنيان مرتبطان بالطبيعة"},{"id":6,"level":1,"q":"أين تقع فلسطين؟","options":["في قلب بلاد الشام وجنوب غرب آسيا","في شمال أفريقيا","في شرق أوروبا"],"correct":0,"fact":"موقع فلسطين استراتيجي يتوسط ثلاث قارات: آسيا وأفريقيا وأوروبا.","hint":"في قلب العالم العربي"},{"id":7,"level":1,"q":"ما عاصمة فلسطين؟","options":["القدس","رام الله","نابلس"],"correct":0,"fact":"القدس عاصمة فلسطين الأبدية، فيها المسجد الأقصى وكنيسة القيامة.","hint":"أولى القبلتين"},{"id":8,"level":1,"q":"ما اسم القدس الكنعاني القديم؟","options":["يبوس","أورشليم","إيليا"],"correct":0,"fact":"يبوس هو الاسم الكنعاني الأصلي للقدس نسبة لليبوسيين الكنعانيين الذين سكنوها.","hint":"يبدأ بحرف الياء"},{"id":9,"level":1,"q":"من بنى مدينة القدس أول مرة؟","options":["اليبوسيون الكنعانيون","الرومان","الإغريق"],"correct":0,"fact":"بنى اليبوسيون الكنعانيون القدس قبل 5000 سنة وجعلوها حصناً منيعاً.","hint":"فرع من الكنعانيين"},{"id":10,"level":1,"q":"ما البحر الذي يحدّ فلسطين غرباً؟","options":["البحر المتوسط","البحر الأحمر","بحر العرب"],"correct":0,"fact":"البحر المتوسط يعطي فلسطين ساحلاً جميلاً طوله 224 كم ومناخاً معتدلاً.","hint":"نفس البحر الذي يطل على يافا وحيفا"},{"id":11,"level":1,"q":"ما النهر الرئيسي في فلسطين؟","options":["نهر الأردن","نهر النيل","نهر الفرات"],"correct":0,"fact":"نهر الأردن ينبع من جبل الشيخ ويصب في البحر الميت وطوله 251 كم.","hint":"يصب في البحر الميت"},{"id":12,"level":1,"q":"ما مناخ فلسطين؟","options":["مناخ البحر المتوسط معتدل","مناخ صحراوي حار جداً","مناخ قطبي بارد"],"correct":0,"fact":"مناخ فلسطين متنوع: ساحل معتدل، جبل بارد شتاءً، وغور حار، وهذا سر غناها الزراعي.","hint":"مثل مناخ لبنان"},{"id":13,"level":2,"q":"اذكري 3 مدن كنعانية مشهورة ما زالت موجودة؟","options":["أريحا والقدس (يبوس) والخليل","لندن وباريس وروما","القاهرة وبغداد ودمشق فقط"],"correct":0,"fact":"أريحا، يبوس (القدس)، الخليل، نابلس، عكا، يافا، بيسان، مجدو - كلها كنعانية الأصل.","hint":"مدن فلسطينية نعرفها اليوم"},{"id":14,"level":2,"q":"بماذا اشتهر الكنعانيون في الزراعة؟","options":["زراعة القمح والزيتون والعنب","زراعة الأرز فقط","لم يهتموا بالزراعة"],"correct":0,"fact":"الكنعانيون أول من زرع الزيتون في العالم، وشجرة الزيتون رمز فلسطين حتى اليوم.","hint":"ثلاثة محاصيل متوسطية مشهورة"},{"id":15,"level":2,"q":"بماذا اشتهر الكنعانيون في الصناعة؟","options":["صناعة الأرجوان والزجاج والفخار","صناعة السيارات","صناعة البلاستيك"],"correct":0,"fact":"الأرجوان كان أغلى صبغة في العالم القديم، يستخرج من أصداف البحر ويصدر للملوك.","hint":"صناعات يدوية قديمة ثمينة"},{"id":16,"level":2,"q":"ماذا اخترع الكنعانيون وأهدوه للعالم؟","options":["الأبجدية / الكتابة الأبجدية","الإنترنت","الكهرباء"],"correct":0,"fact":"الأبجدية الكنعانية (22 حرفاً) هي أم كل أبجديات العالم، منها العربية والعبرية واللاتينية.","hint":"اختراع ساعد البشرية على الكتابة بسهولة"},{"id":17,"level":2,"q":"ما هي تضاريس فلسطين؟","options":["سهول ساحلية وجبال وغور وصحراء النقب","صحراء فقط","جبال جليدية فقط"],"correct":0,"fact":"في 27 ألف كم² تجد كل التضاريس: ساحل، جبل، غور، صحراء - فلسطين قارة مصغرة!","hint":"متنوعة جداً رغم صغر المساحة"},{"id":18,"level":2,"q":"ما هي بحيرة فلسطين المشهورة؟","options":["بحيرة طبريا","بحيرة فيكتوريا","بحيرة قارون"],"correct":0,"fact":"بحيرة طبريا عذبة وجميلة، تنخفض 212 م تحت سطح البحر وتغذي نهر الأردن.","hint":"في شمال فلسطين"},{"id":19,"level":2,"q":"ما هو البحر الميت؟","options":["أخفض نقطة في العالم وأكثرها ملوحة","بحر عادي مثل المتوسط","نهر كبير"],"correct":0,"fact":"البحر الميت -427 متر تحت سطح البحر، ملوحته 10 أضعاف البحر العادي ولا تعيش فيه أسماك.","hint":"يمكنك أن تطفو على سطحه دون سباحة!"},{"id":20,"level":2,"q":"لماذا فلسطين غنية زراعياً؟","options":["تنوع مناخها وتضاريسها وتربتها الخصبة","لأنها تستورد كل شيء","لأنها صحراء"],"correct":0,"fact":"من برتقال يافا إلى عنب الخليل وزيتون الجليل - تنوع المناخ جعل فلسطين سلة غذاء.","hint":"السبب طبيعي جغرافي"},{"id":21,"level":2,"q":"ما اللغة التي تكلمها الكنعانيون؟","options":["اللغة الكنعانية السامية القريبة من العربية","اللغة الإنجليزية","اللغة الصينية"],"correct":0,"fact":"الكنعانية قريبة جداً من العربية: كلمات مثل بيت، ملك، شمس، يم (بحر) ما زالت نفسها!","hint":"من نفس عائلة اللغة العربية"},{"id":22,"level":2,"q":"كيف كانت بيوت الكنعانيين؟","options":["من الطين والحجر بسقوف خشبية","من الحديد والزجاج","خيام فقط"],"correct":0,"fact":"بيوت الكنعانيين متينة من حجر وطين، بجدران سميكة تحمي من الحر والبرد، وبعضها ما زال قائماً!","hint":"مواد طبيعية متوفرة في الجبل"},{"id":23,"level":2,"q":"ما ديانة الكنعانيين؟","options":["وثنية يعبدون بعل وعشتار","مسلمون","مسيحيون"],"correct":0,"fact":"عبد الكنعانيون قوى الطبيعة: بعل إله المطر، وعشتار إلهة الخصب، قبل مجيء الديانات السماوية.","hint":"قبل الإسلام والمسيحية"},{"id":24,"level":2,"q":"ماذا بنى الكنعانيون للدفاع عن مدنهم؟","options":["أسوار عالية وأبراج مثل سور أريحا","خنادق مائية فقط","لم يبنوا شيئاً"],"correct":0,"fact":"سور أريحا عرضه 3 أمتار وارتفاعه 7 أمتار، /* ==========================================================

   ========================================================== */
const Voice = {
  ready:false, muted:false, v:null, last:null, unlocked:false,
  init(){
    if(!('speechSynthesis' in window)) return;
    const pick = () => {
      const vs = speechSynthesis.getVoices();
      if(!vs.length) return;
      this.v = vs.find(x=>/^ar-SA/i.test(x.lang)) || vs.find(x=>/^ar-EG/i.test(x.lang))
            || vs.find(x=>/^ar-JO/i.test(x.lang)) || vs.find(x=>/^ar/i.test(x.lang)) || null;
      this.ready = true;
    };
    pick();
    speechSynthesis.onvoiceschanged = pick;
  },
  unlock(){ // مطلوب على الآيفون: أول صوت بعد لمسة
    if(this.unlocked || !('speechSynthesis' in window)) return;
    try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); this.unlocked=true; }catch(e){}
  },
  say(text, who='narr'){
    if(!text) return;
    this.last = {text, who};
    if(this.muted || !('speechSynthesis' in window)) return;
    try{
      speechSynthesis.cancel();
      const c = CAST[who] || CAST.narr;
      const u = new SpeechSynthesisUtterance(String(text).replace(/[«»…]/g,' '));
      if(this.v) u.voice = this.v;
      u.lang = (this.v && this.v.lang) || 'ar';
      u.rate = c.rate; u.pitch = c.pitch; u.volume = 1;
      u.onstart = ()=>{ if(window.Music) Music.duck(true); };
      u.onend = u.onerror = ()=>{ if(window.Music) Music.duck(false); };
      speechSynthesis.speak(u);
    }catch(e){}
  },
  queue(list){ // [{t,who}]
    if(this.muted || !('speechSynthesis' in window)) return;
    try{
      speechSynthesis.cancel();
      list.forEach((item,i)=>{
        const c = CAST[item.who] || CAST.narr;
        const u = new SpeechSynthesisUtterance(String(item.t).replace(/[«»…]/g,' '));
        if(this.v) u.voice = this.v;
        u.lang = (this.v && this.v.lang) || 'ar';
        u.rate = c.rate; u.pitch = c.pitch;
        if(i===0) u.onstart = ()=>{ if(window.Music) Music.duck(true); };
        if(i===list.length-1) u.onend = u.onerror = ()=>{ if(window.Music) Music.duck(false); };
        speechSynthesis.speak(u);
      });
      this.last = {queue:list};
    }catch(e){}
  },
  replay(){
    if(!this.last) return;
    if(this.last.queue) this.queue(this.last.queue);
    else this.say(this.last.text, this.last.who);
  },
  stop(){ try{ speechSynthesis.cancel(); }catch(e){} if(window.Music) Music.duck(false); }
};

/* ==========================================================
   الموسيقى — زر تخطّي/إيقاف ثابت بكل شاشات اللعبة
   ========================================================== */
/* لا يوجد ملف موسيقى مضمّن حالياً — ضعي base64 هنا لتشتغل الموسيقى تلقائياً */
const MUSIC_B64 = '';

const Music = {
  el:null, on:true, vol:0.30, started:false,
  init(){
    this.el = document.getElementById('bgm');
    if(!this.el || !MUSIC_B64){ this.el = null; this.on = false; return; }
    this.el.src = 'data:audio/mpeg;base64,' + MUSIC_B64;
    this.el.loop = true;
    this.el.volume = this.vol;
  },
  play(){
    if(!this.el || !this.on) return;
    const p = this.el.play();
    if(p && p.catch) p.catch(()=>{});
    this.started = true;
  },
  pause(){ if(this.el){ try{ this.el.pause(); }catch(e){} } },
  toggle(){
    this.on = !this.on;
    if(this.on) this.play(); else this.pause();
    this.paint();
  },
  /* يخفّض الموسيقى وقت ما يحكي الراوي حتى يضل الصوت العربي واضح */
  duck(down){
    if(!this.el) return;
    const target = down ? this.vol*0.32 : this.vol;
    const step = (target - this.el.volume)/6;
    let i = 0;
    clearInterval(this._f);
    this._f = setInterval(()=>{
      i++;
      this.el.volume = Math.max(0, Math.min(1, this.el.volume + step));
      if(i>=6){ clearInterval(this._f); this.el.volume = target; }
    }, 45);
  },
  paint(){
    const b = document.getElementById('btnMusic');
    if(!b) return;
    if(!MUSIC_B64){ b.style.display = 'none'; return; }
    b.textContent = this.on ? '🎵' : '🔕';
    b.classList.toggle('off', !this.on);
    b.dataset.lbl = this.on ? 'الموسيقى' : 'مكتومة';
  }
};
window.Music = Music;   /* حتى تشتغل حراسة الخفض داخل محرّك النطق */

const AR_NUM = n => String(n).replace(/\d/g, d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=rnd(i+1);[b[i],b[j]]=[b[j],b[i]];} return b; };

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2600);
}

function newPlayer(name){
  return {name, hand:[], locked:[], letters:0, score:0, hints:0, right:0, wrong:0};
}
function P(){ return G.players[G.turn] || G.players[0]; }

/* ---------- سحب ورقة ---------- */
function drawCard(){
  const d = DIFF[G.diff];
  const isFake = Math.random() < d.fakes;
  const fam = FAMKEYS[rnd(4)];
  const num = 1 + rnd(9);
  return {id:++G.deckSerial, fam, num, fake:isFake, sel:false};
}

/* ---------- التحقق من المجموعة ---------- */
function checkGroup(cards){
  const d = DIFF[G.diff];
  if(cards.length !== d.run) return {ok:false, why:`المجموعة لازم تكون ${AR_NUM(d.run)} أوراق بالضبط.`};
  if(cards.some(c=>c.fake)) return {ok:false, why:'في ورقة مزوّرة بالمجموعة! ارميها أول.'};
  const sameFam = cards.every(c=>c.fam===cards[0].fam);
  if(sameFam){
    const ns = cards.map(c=>c.num).sort((a,b)=>a-b);
    let seq = true;
    for(let i=1;i<ns.length;i++) if(ns[i] !== ns[i-1]+1) seq=false;
    if(seq) return {ok:true, kind:'تسلسل'};
    return {ok:false, why:'نفس العائلة بس الأرقام مش متتابعة.'};
  }
  const sameNum = cards.every(c=>c.num===cards[0].num);
  const famsUniq = new Set(cards.map(c=>c.fam)).size === cards.length;
  if(sameNum && famsUniq) return {ok:true, kind:'مجموعة'};
  return {ok:false, why:'لازم إما نفس العائلة بأرقام متتابعة، أو نفس الرقم من عائلات مختلفة.'};
}

/* ---------- عدد المجموعات المتوقّعة ---------- */
function lettersPerGroup(){
  const maxGroups = Math.floor(34 / DIFF[G.diff].run);
  return Math.max(1, Math.ceil(TABLET_LETTERS.length / maxGroups));
}

/* ==========================================================
   محرّك الأسئلة
   ========================================================== */
let curQ = null, answered = false, hintUsed = false, tStart = 0, timerH = null;

function startCase(i){
  G.caseIdx = i;
  const c = CASES[i];
  G.caseQs = QUESTIONS.filter(q=>q.id>=c.from && q.id<=c.to);
  G.qPtr = 0;
  const open = [
    ['zaydan', i===0 ? 'أول خيط عنا في تل السلطان. بس قبل ما ندخل، لازم أتأكد إنك بتعرفي الأرض اللي بتحققي فيها.'
      : i===1 ? 'الخيط الثاني بياخدنا لمدن كنعان. هون الناس زرعوا وصنعوا واخترعوا شي غيّر الدنيا كلها.'
      : 'القدس مش بس مدينة… هي القلب. وكل غازي بالتاريخ حاول ياخدها، وكل مرة رجعت لأهلها.'],
    ['kanaan', i===1 ? 'شي بتستعمليه إنتِ كل يوم بالمدرسة… وما بتعرفي إنهم هم اللي عملوه!'
      : `${AR_NUM(G.caseQs.length)} أسئلة، وبعدها بنفتح الباب!`]
  ];
  playScene(open, nextQ, `<div class="eyebrow">القضية ${c.n}</div><h2 style="font-size:26px">${c.t}</h2>`);
}

function nextQ(){
  if(G.qPtr >= G.caseQs.length){ endCase(); return; }
  curQ = G.caseQs[G.qPtr];
  answered = false; hintUsed = false; tStart = Date.now();
  clearInterval(timerH);
  renderQ();
}

function passTurn(){
  if(G.players.length<2) return false;
  G.turn = (G.turn+1) % G.players.length;
  return G.mode==='duel'; // نخبّي الشاشة بين اللاعبتين فقط
}

function renderQ(){
  const q = curQ;
  if(window.setQuestionBG) setQuestionBG(q.id);
  const mech = MECH[q.id] || 'cards';
  const head = `
    <div class="qhead">
      <span class="qnum">سؤال ${AR_NUM(q.id)}</span>
      ${G.players.length>1 ? `<span class="chip">دور: ${P().name}</span>`:''}
      <div class="grow"></div>
      <button class="iconbtn" id="hintBtn" aria-label="تلميح">💡</button>
    </div>`;
  const body = ({
    cards:mCards, map:mMap, slider:mSlider, scramble:mScramble,
    listen:mListen, torch:mTorch, reveal:mReveal, timed:mTimed
  }[mech])(q);

  show(head + body + `<div id="fb"></div>`);
  $('hintBtn').onclick = ()=>{
    if(hintUsed) return;
    hintUsed = true;
    const p = P(); p.hints++;
    if(p.hints>3) p.score = Math.max(0,p.score-5);
    toast('💡 ' + q.hint);
    Voice.say(q.hint,'kanaan');
  };
}

function mSlider(q){

/* ==========================================================
   ٤) الحروف المبعثرة (شيفرة)
   ========================================================== */
function mScramble(q){
  const c = SCRAMBLE_Q[q.id];
  const chars = Array.from(c.word);
  const pool = shuffle(chars.map((ch,i)=>({ch,i})));
  let filled = [];
  setTimeout(()=>{
    Voice.queue([{t:q.q,who:'zaydan'},{t:'فُكّي الشيفرة: رتّبي الحروف.',who:'kanaan'}]);
    const draw = ()=>{
      S.querySelectorAll('.slot').forEach((s,i)=>{
        const f = filled[i];
        s.textContent = f ? f.ch : '';
        s.classList.toggle('filled', !!f);
      });
      S.querySelectorAll('.tile').forEach(t=>
        t.classList.toggle('used', filled.some(f=>f && f.i===+t.dataset.i)));
      $('confirm').style.opacity = filled.filter(Boolean).length===chars.length ? 1 : .45;
    };
    S.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
      if(answered) return;
      const i = +t.dataset.i;
      if(filled.some(f=>f && f.i===i)) return;
      const slot = filled.findIndex(f=>!f);
      const at = slot===-1 ? filled.length : slot;
      if(at>=chars.length) return;
      filled[at] = {ch:t.textContent, i};
      Voice.say(t.textContent,'narr');
      draw();
    });
    S.querySelectorAll('.slot').forEach((s,i)=>s.onclick=()=>{
      if(answered) return; filled[i]=null; draw();
    });
    $('confirm').onclick = ()=>{
      if(answered) return;
      const word = filled.map(f=>f?f.ch:'').join('');
      if(word.length<chars.length){ toast('كمّلي كل الحروف أول'); return; }
      const ok = word === c.word;
      if(!ok){ S.querySelector('.slots').classList.add('shake'); setTimeout(()=>{
        S.querySelector('.slots').classList.remove('shake'); },420); }
      resolve(ok, ()=>{
        S.querySelectorAll('.slot').forEach((s,i)=>{ s.textContent = chars[i]; s.classList.add('filled');
          s.style.background = ok? 'linear-gradient(160deg,#28c07d,#12855a)':'linear-gradient(160deg,#e0a92b,#a87a12)';
          s.style.color='#fff'; });
      });
    };
    draw();
  },40);
  return `<div class="qtext">${q.q}</div>
  <p class="hintline">🔐 ${c.tip}</p>
  <div class="panel">
    <div class="slots">${chars.map(()=>`<div class="slot"></div>`).join('')}</div>
    <div class="pool">${pool.map(p=>`<button class="tile" data-i="${p.i}">${p.ch}</button>`).join('')}</div>
  </div>
  <button class="btn gold mt" id="confirm">فُكّي الشيفرة</button>`;
}

/* ==========================================================
   ٦) المصباح في الظلام
   ========================================================== */
function mTorch(q){
  const c = TORCH_Q[q.id];
  setTimeout(()=>{
    Voice.queue([{t:'المكان معتم. استعملي المصباح.',who:'kanaan'},{t:q.q,who:'zaydan'}]);
    const box = $('torch');
    const move = (e)=>{
      const r = box.getBoundingClientRect();
      const pt = e.touches ? e.touches[0] : e;
      const x = ((pt.clientX - r.left)/r.width*100), y = ((pt.clientY - r.top)/r.height*100);
      box.style.setProperty('--tx', Math.max(0,Math.min(100,x))+'%');
      box.style.setProperty('--ty', Math.max(0,Math.min(100,y))+'%');
    };
    box.addEventListener('mousemove', move);
    box.addEventListener('touchmove', e=>{e.preventDefault();move(e);}, {passive:false});
    box.addEventListener('touchstart', move, {passive:true});
    bindOpts(q);
  },40);
  return `<div class="qtext">${q.q}</div>
  <p class="hintline">🔦 حرّكي إصبعك على الصورة لتضيئي المكان</p>
  <div class="torchbox" id="torch">
    <div class="torchscene"><p>${c.scene.replace(/\n/g,'<br>')}</p></div>
    <div class="torchmask"></div><div class="torchglow"></div>
  </div>
  ${optsHTML(q)}`;
}

function mReveal(q){

  setTimeout(()=>{
    Voice.say('الصورة مش واضحة. اضغطي لتنجلي شوي شوي.','kanaan');
    $('revBtn').onclick = ()=>{
      step = Math.min(4, step+1);
      $('revEm').style.setProperty('--bl', (22 - step*5.5)+'px');
      $('revFill').style.width = (step*25)+'%';
      if(step===2) Voice.say(q.q,'zaydan');
      if(step>=4){
        $('revCap').textContent = c.cap;
        $('revBtn').textContent = 'الصورة انجلت — اختاري 👇';
        $('revBtn').disabled = true; $('revBtn').style.opacity = .5;
        S.querySelectorAll('.opt').forEach(o=>o.style.display='flex');
      }
    };
    bindOpts(q);
  },40);
  return `<div class="qtext">${q.q}</div>
  <div class="revbar"><i id="revFill"></i></div>
  <div class="revealbox"><span id="revEm" style="--bl:22px">${c.em}</span></div>
  <p class="hintline" id="revCap">؟؟؟</p>
  <button class="btn" id="revBtn">اجلي الصورة 🔍</button>
  <div class="opts mt">${q.options.map((o,i)=>
    `<button class="opt" data-i="${i}" style="display:none"><span class="k">${['أ','ب','ج'][i]}</span><span>${o}</span></button>`).join('')}</div>`;
}

/* ==========================================================
   ٨) السؤال المؤقّت
   ========================================================== */
function mTimed(q){
  const c = TIMED_Q[q.id];
  let left = c.sec;
  setTimeout(()=>{
    Voice.queue([{t:'بسرعة! الوقت بيركض!',who:'kanaan'},{t:q.q,who:'zaydan'}]);
    bindOpts(q);
    timerH = setInterval(()=>{
      left--;
      const pct = Math.max(0,left/c.sec*100);
      const bar = $('tbar'); if(!bar){ clearInterval(timerH); return; }
      bar.style.width = pct+'%';
      if(left<=5) bar.parentElement.classList.add('warn');
      if(left<=0){
        clearInterval(timerH);
        if(!answered) resolve(false, ()=>{
          S.querySelectorAll('.opt').forEach(x=>{ x.disabled=true;
            x.classList.add(+x.dataset.i===q.correct?'ok':'dim'); });
        }, 'خلص الوقت!');
      }
      const lb = $('tleft'); if(lb) lb.textContent = AR_NUM(Math.max(0,left));
    },1000);
  },40);
  return `<div class="qtext">${q.q}</div>
    <div class="qhead"><span class="chip gold">⏱ <b id="tleft">${AR_NUM(c.sec)}</b> ثانية</span></div>
    <div class="timerbar"><i id="tbar"></i></div>
    ${optsHTML(q)}`;
}

/* ==========================================================
   نتيجة الإجابة
   ========================================================== */
function resolve(ok, paint, forcedMsg){
  if(answered) return;
  answered = true;
  clearInterval(timerH);
  const p = P();
  const secs = (Date.now()-tStart)/1000;
  paint && paint();

  let gained = null, pts = 0;
  if(ok){
    p.right++;
    pts = 10;
    if(!hintUsed) pts += 5;
    if(secs < 10) pts += 3;
    p.score += pts;
    gained = drawCard();
    p.hand.push(gained);
    Voice.queue([
      {t:['أحسنتِ يا '+p.name, 'ممتاز يا '+p.name, 'برافو عليكِ'][rnd(3)], who:'zaydan'},
      {t:curQ.fact, who:'zaydan'}
    ]);
  }else{
    p.wrong++;
    
    // ✅ تفعيل نظام الأخطاء
    if(typeof KanaaErrorSystem !== 'undefined') {
      const gameEnded = KanaaErrorSystem.addError(curQ.id, p.name);
      if(gameEnded) {
        setTimeout(() => location.reload(), 3000);
        return;
      }
    }
    
    Voice.queue([
      {t: forcedMsg || 'ولا يهمّك. المحقّق الشاطر بيغلط ليتعلّم.', who:'zaydan'},
      {t: curQ.fact, who:'zaydan'}
    ]);
  }

  const fb = $('fb');
  fb.innerHTML = `
    ${ok ? `<div class="fact" style="background:rgba(18,133,90,.16);border-color:rgba(18,133,90,.5)">
        <b>✔ إجابة صحيحة — +${AR_NUM(pts)} نقطة</b>
        <p>${curQ.fact}</p></div>`
      : `<div class="fact" style="background:rgba(197,48,73,.14);border-color:rgba(197,48,73,.45)">
        <b>${forcedMsg||'ولا يهمّك — هيك بنتعلّم'}</b>
        <p>${curQ.fact}</p></div>`}
    ${gained ? cardGainedHTML(gained) : ''}
    <button class="btn gold mt" id="cont">${G.qPtr>=G.caseQs.length-1?'خلّصنا القضية ◀':'السؤال الجاي ◀'}</button>
    ${p.hand.length ? `<button class="btn ghost mt" id="openHand">أوراقي (${AR_NUM(p.hand.length)}) 🃏</button>`:''}
  `;
  if(fb.scrollIntoView) fb.scrollIntoView({behavior:'smooth', block:'nearest'});
  paintScore();
  bindFeedback();
}

/* يحفظ شاشة النتيجة ليقدر يرجّعها بعد ما تفتح الطالبة أوراقها */
function bindFeedback(){
  const snap = S.innerHTML;
  const restore = ()=>{ S.innerHTML = snap; $('topbar').style.display='flex'; paintScore(); bindFeedback(); };
  $('cont').onclick = ()=>{
    G.qPtr++;
    if(G.players.length>1){
      const hide = passTurn();
      if(hide){ scrPass(nextQ); return; }
    }
    nextQ();
  };
  if($('openHand')) $('openHand').onclick = ()=> scrHand(restore);
}

/* ==========================================================
   شاشة الأوراق (لعبة الهاند)
   ========================================================== */
function scrHand(back){
  const p = P();
  const d = DIFF[G.diff];
  const sel = ()=>p.hand.filter(c=>c.sel);

  const draw = ()=>{
    show(`
      <div class="eyebrow mt">أوراق ${p.name}</div>
      <h2 style="font-size:25px">كوّني مجموعة من ${AR_NUM(d.run)} أوراق</h2>
      ${tabletHTML(p.letters)}
      <div class="sectitle">🃏 بإيدك</div>
      <div class="hand" id="hand">
        ${p.hand.length? p.hand.map(c=>{
          const f = FAMS[c.fam];
          const num = d.showNum || c.flipped ? AR_NUM(c.num) : '؟';
          return `<button class="pcard ${c.sel?'sel':''} ${c.fake?'fake':''}" data-id="${c.id}">
            <div class="fam">${c.fake?'🕳️':f.icon}</div>
            <div class="num">${c.fake?'✖':num}</div>
            <div class="fnm">${c.fake?'مزوّرة':f.name}</div>
          </button>`;
        }).join('') : `<p class="note">ما في أوراق بعد — جاوبي صح وبتجيك أوراق.</p>`}
      </div>
      <div class="famlegend">
        ${FAMKEYS.map(k=>`<span>${FAMS[k].icon} ${FAMS[k].name}</span>`).join('')}
      </div>
      <p class="note">${d.showNum?'':'أول ضغطة بتقلب الورقة وتوريكِ رقمها، والثانية بتختارها.<br>'}
        <b style="color:var(--gold2)">تسلسل</b>: نفس العائلة بأرقام متتابعة ·
        <b style="color:var(--gold2)">مجموعة</b>: نفس الرقم من عائلات مختلفة</p>
      <div id="msg"></div>
      <div class="row mt">
        <button class="btn sm" id="lock">ثبّتي المجموعة ✔</button>
        <button class="btn sm ghost" id="drop">ارمي المحدّد 🗑</button>
      </div>
      ${p.locked.length? `<div class="sectitle">🏅 مجموعاتك المثبّتة</div>
        <div class="locked">${p.locked.map(g=>`<div class="lgroup">
          ${g.map(c=>`<b>${FAMS[c.fam].icon}${AR_NUM(c.num)}</b>`).join('')}
        </div>`).join('')}</div>`:''}
      <button class="btn gold mt2" id="back">رجوع للتحقيق ◀</button>
    `);

    S.querySelectorAll('.pcard').forEach(b=>{
      const c = p.hand.find(x=>x.id===+b.dataset.id);
      b.onclick = ()=>{
        if(!d.showNum && !c.flipped){ c.flipped = true; draw(); return; }
        c.sel = !c.sel; draw();
      };
    });

    $('lock').onclick = ()=>{
      const cs = sel();
      const r = checkGroup(cs);
      if(!r.ok){ $('msg').innerHTML = `<div class="warnmsg">${r.why}</div>`;
        Voice.say(r.why,'kanaan'); return; }
      p.hand = p.hand.filter(c=>!c.sel);
      cs.forEach(c=>c.sel=false);
      p.locked.push(cs);
      const add = lettersPerGroup();
      p.letters = Math.min(TABLET_LETTERS.length, p.letters + add);
      p.score += 25;
      Voice.queue([{t:'مجموعة صحيحة! '+r.kind, who:'kanaan'},
                   {t:'حرف رجع على اللوح.', who:'zaydan'}]);
      toast('✨ مجموعة ' + r.kind + ' — حرف رجع على اللوح!');
      draw();
    };
    $('drop').onclick = ()=>{
      const cs = sel();
      if(!cs.length){ $('msg').innerHTML = `<div class="warnmsg">اختاري ورقة أول.</div>`; return; }
      const fakes = cs.filter(c=>c.fake).length;
      p.hand = p.hand.filter(c=>!c.sel);
      if(fakes){ p.score += fakes*5; toast('👏 كشفتِ '+AR_NUM(fakes)+' ورقة مزوّرة — +'+AR_NUM(fakes*5));
        Voice.say('شاطرة! كشفتِ ورقة الظلّ.','zaydan'); }
      else toast('رميتِ '+AR_NUM(cs.length)+' ورقة');
      draw();
    };
    $('back').onclick = back;
  };
  draw();
}

const BOSS_IDS = [9, 16, 34];
let bossPtr = 0, bossP = 0;

function startBoss(){
  bossPtr = 0; bossP = 0; G.turn = 0;
  playScene([
    ['shadow','وصلتِ. ما توقّعت.'],
    ['shadow','ثلاثة أسئلة. إذا غلطتِ… بمحي اسمك كمان.'],
    ['zaydan','ما تخافي. إنتِ بتعرفي. بس تنفّسي وجاوبي.']
  ], bossQ, `<div class="shadowscene"><div class="smoke">🕶️</div>
      <p class="center" style="font-family:var(--fd);font-size:20px;color:#b9b9cc">قاعة اللوح</p></div>`);
}

function bossQ(){
  if(bossPtr >= BOSS_IDS.length){ bossEnd(); return; }
  G.turn = bossP;
  curQ = QUESTIONS.find(q=>q.id===BOSS_IDS[bossPtr]);
  answered = false; hintUsed = true; tStart = Date.now();
  let left = 18;
  show(`
    ${speechHTML('shadow', ['جاوبي… إذا بتقدري.','ما زلتِ واقفة؟','السؤال الأخير.'][bossPtr])}
    <div class="qhead"><span class="qnum">مواجهة ${AR_NUM(bossPtr+1)}/٣</span>
      ${G.players.length>1?`<span class="chip">${P().name}</span>`:''}
      <div class="grow"></div><span class="chip gold">⏱ <b id="tleft">${AR_NUM(left)}</b></span></div>
    <div class="timerbar"><i id="tbar"></i></div>
    <div class="qtext">${curQ.q}</div>
    ${optsHTML(curQ)}
    <div id="fb"></div>
  `);
  Voice.queue([{t:'جاوبي إذا بتقدري.',who:'shadow'},{t:curQ.q,who:'zaydan'}]);

  const finish = (ok)=>{
    if(answered) return; answered = true; clearInterval(timerH);
    const p = P();
    if(ok){ p.score += 30; p.right++; } else p.wrong++;
    S.querySelectorAll('.opt').forEach(x=>{ x.disabled=true;
      x.classList.add(+x.dataset.i===curQ.correct?'ok':'dim'); });
    $('fb').innerHTML = `<div class="fact"><b>${ok?'✔ صحيح — الظلّ تراجع!':'✖ الظلّ ضحك… بس ما خسرتِ'}</b>
      <p>${curQ.fact}</p></div>
      <button class="btn gold mt" id="nx">كمّلي ◀</button>`;
    Voice.say(ok?'صحيح! الظلّ تراجع.':'ولا يهمّك. كمّلي.', ok?'kanaan':'zaydan');
    $('nx').onclick = ()=>{
      bossP++;
      if(bossP >= G.players.length){ bossP = 0; bossPtr++; }
      if(bossPtr < BOSS_IDS.length && G.players.length>1 && G.mode==='duel'){
        G.turn = bossP; scrPass(bossQ); return;
      }
      bossQ();
    };
  };

  S.querySelectorAll('.opt').forEach(b=>{
    b.onclick = ()=> finish(+b.dataset.i===curQ.correct);
  });
  timerH = setInterval(()=>{
    left--; const bar=$('tbar'); if(!bar){clearInterval(timerH);return;}
    bar.style.width = Math.max(0,left/18*100)+'%';
    const lb=$('tleft'); if(lb) lb.textContent = AR_NUM(Math.max(0,left));
    if(left<=0){ clearInterval(timerH); finish(false); }
  },1000);
}

function bossEnd(){
  playScene([
    ['narr','الممحاة انكسرت. والظلّ بدأ يتفتّت إلى حروف عربية مضيئة… طارت كلها نحو اللوح.'],
    ['shadow','أنا… النسيان. وإنتِ… ذاكرة.'],
    ['zaydan','شفتي؟ ما كان لازم سلاح… كان لازم معرفة.'],

}

/* ---------- شاشة الكأس ---------- */
function scrCup(){
  const p = P();
  const totalQuestions = 34;
  const accuracy = ((p.right / totalQuestions) * 100).toFixed(1);
  const mins = Math.max(1, Math.round((Date.now() - window.G.started) / 60000));
  
  // حساب التقدير
  let grade, gradeColor, gradeArabic;
  if(accuracy >= 90) {
    grade = 'A+'; gradeColor = '#10b981'; gradeArabic = '🌟 ممتاز جداً';
  } else if(accuracy >= 80) {
    grade = 'A'; gradeColor = '#06b6d4'; gradeArabic = '⭐ ممتاز';
  } else if(accuracy >= 70) {
    grade = 'B'; gradeColor = '#f59e0b'; gradeArabic = '👍 جيد جداً';
  } else if(accuracy >= 60) {
    grade = 'C'; gradeColor = '#f97316'; gradeArabic = '📌 جيد';
  } else {
    grade = 'D'; gradeColor = '#ef4444'; gradeArabic = '⚠️ يحتاج تحسّن';
  }
  
  show(`
    <div class="trophy">
      <div class="cup">🏆</div>
      <h2 style="font-size:30px;color:var(--gold2)">🎉 ألف مبروك 🎉</h2>
      <p class="sub mt">${p.name}، حلّيتِ القضايا الثلاث وواجهتِ الظلّ.</p>
      <div class="medal">${AR_NUM(p.score)} نقطة</div>
      
      <!-- ✅ إحصائيات محسّنة -->
      <div style="background: linear-gradient(135deg, ${gradeColor}22, ${gradeColor}11); 
                  border: 2px solid ${gradeColor}; border-radius: 18px; padding: 24px; margin: 24px 0;">
        <div style="font-size: 48px; font-weight: bold; color: ${gradeColor}; margin-bottom: 8px;">${grade}</div>
        <div style="font-size: 18px; color: ${gradeColor}; font-weight: 600;">${gradeArabic}</div>
        <div style="font-size: 12px; color: var(--clay3); margin-top: 8px;">
          دقتك: ${accuracy}% | الوقت: ${mins} دقيقة | إجابات صحيحة: ${AR_NUM(p.right)}/${AR_NUM(totalQuestions)}
        </div>
      </div>
      
      ${tabletHTML(p.letters)}
      <p class="sub mt">بقي شغل صغير… ورقتان عمل والمارد بينتظرك.</p>
    </div>
    <button class="btn gold mt2" id="ws1">📋 ورقة العمل الأولى</button>
  `);
  Voice.queue([{t:'ألف مبروك!',who:'kanaan'},
    {t:`${p.name}، حلّيتِ القضايا الثلاث. بقي ورقتان عمل والمارد.`,who:'zaydan'}]);
  $('ws1').onclick = ()=> scrWS(1);
}

/* ---------- أوراق العمل ---------- */
function scrWS(n){
  const list = n===1 ? WS1 : WS2;
  const state = list.map(()=>null);   // null | 'ok' | 'no'
  const title = n===1 ? '📋 ورقة العمل الأولى' : '🔥 ورقة العمل الثانية';
  const desc  = n===1 ? 'أسئلة مباشرة عن أرض كنعان' : 'أسئلة تحليل واستنتاج — ركّزي!';

  const draw = ()=>{
    const done = state.filter(Boolean).length;
    const right = state.filter(s=>s==='ok').length;
    show(`
      <div class="eyebrow mt">${n===1?'ورقة عمل ١':'ورقة عمل ٢'}</div>
      <h2 style="font-size:26px">${title}</h2>
      <p class="sub" style="font-size:14px">${desc}</p>
      <div class="chip gold" style="margin:10px 0">✔ ${AR_NUM(right)} من ${AR_NUM(list.length)}</div>
      ${list.map((item,i)=>`
        <div class="panel mt" data-q="${i}">
          <div class="qhead"><span class="qnum">${AR_NUM(i+1)}</span>
            <div class="grow"></div>
            <button class="iconbtn sayq" data-i="${i}" aria-label="اسمعي السؤال">🔊</button></div>
          <div style="font-size:17px;font-weight:800;line-height:1.7;color:#fff">${item.q}</div>
          <div class="opts mt">
            ${item.opts.map(o=>{
              let cls='';
              if(state[i]) cls = (o===item.ans) ? 'ok' : 'dim';
              return `<button class="opt ${cls}" data-q="${i}" data-o="${o.replace(/"/g,'&quot;')}"
                ${state[i]?'disabled':''}><span>${o}</span></button>`;
            }).join('')}
          </div>
          ${state[i] ? `<div class="fact mt" style="${state[i]==='ok'
            ? 'background:rgba(18,133,90,.16);border-color:rgba(18,133,90,.5)'
            : 'background:rgba(197,48,73,.14);border-color:rgba(197,48,73,.45)'}">
            <b>${state[i]==='ok'?'✔ صحيح':'✖ الجواب الصحيح: '+item.ans}</b>
            <p>${item.why}</p></div>`:''}
        </div>`).join('')}
      <button class="btn ${done===list.length?'gold':'ghost'} mt2" id="nx" ${done<list.length?'disabled style="opacity:.45"':''}>
        ${done<list.length ? `حلّي كل الأسئلة (${AR_NUM(done)}/${AR_NUM(list.length)})`
          : (n===1 ? 'ورقة العمل الثانية ◀' : 'المارد بينتظرك 🧞‍♂️')}
      </button>
    `);

    S.querySelectorAll('.sayq').forEach(b=>b.onclick=()=>Voice.say(list[+b.dataset.i].q,'zaydan'));
    S.querySelectorAll('.opt').forEach(b=>{
      b.onmousedown = b.ontouchstart = ()=>Voice.say(b.dataset.o,'narr');
      b.onclick = ()=>{
        const i = +b.dataset.q;
        if(state[i]) return;
        const ok = b.dataset.o === list[i].ans;
        state[i] = ok ? 'ok' : 'no';
        const p = P();
        if(ok){ p.score += 10; p.right++; } else p.wrong++;
        Voice.queue([{t: ok?'صحيح!':'الجواب الصحيح: '+list[i].ans, who: ok?'kanaan':'zaydan'},
                     {t: list[i].why, who:'zaydan'}]);
        draw();
        const el = S.querySelector(`.panel[data-q="${i}"]`);
        if(el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth', block:'center'});
      };
    });
    $('nx').onclick = ()=>{ if(done<list.length) return; n===1 ? scrWS(2) : scrGenie(); };
  };
  Voice.say(n===1?'ورقة العمل الأولى. أسئلة مباشرة.':'ورقة العمل الثانية. هاي أصعب، ركّزي منيح.','zaydan');
  draw();
}

const COVER_SRC = 'kanaan_cover.mp4';

/* ---------- ١) الكوفر المتحرك ---------- */
function scrCover(){
  show(`
    <div class="coverwrap">
      <video id="cv" class="covervid" muted playsinline autoplay loop preload="auto"
             poster="" aria-hidden="true"><source src="${COVER_SRC}" type="video/mp4"></video>
      <div class="coverfx" id="cfx"></div>
      <div class="coverui">
        <div class="flagline" style="max-width:230px;margin:0 auto 16px"></div>
        <div class="eyebrow center">تحقيق · الصف السادس</div>
        <h1 class="title center">لغز الأرجوان<em>قضية أرض كنعان</em></h1>
        <div class="grow"></div>
        <button class="btn gold" id="go">ابدئي التحقيق 🔊</button>
        <p class="small center mt">اضغطي الزر لتشغيل الصوت العربي — مطلوب مرة واحدة فقط.</p>
        <button class="btn ghost mt" id="teacherBtn">لوحة المعلمة</button>
        <button class="btn ghost mt" id="guideBtn">🍎 دليل المعلمة</button>
        <p class="small center mt" style="opacity:.6">إعداد: المعلمة أماني داوود · منصة PlayVerse</p>
      </div>
    </div>
  `, {bare:true});

  /* إذا ما انفتح ملف الكوفر، بنشغّل بديل متحرك بالكود */
  const v = $('cv');
  const fallback = ()=>{
    const fx = $('cfx');
    if(!fx || !$('cv')) return;              // غادرنا الشاشة — لا شيء نعمله
    $('cv').style.display = 'none';
    fx.innerHTML = `<div class="cfx-glow"></div>${tabletHTML(11)}`;
    fx.classList.add('on');
  };
  v.addEventListener('error', fallback);
  setTimeout(()=>{ const c = $('cv'); if(c && !c.videoWidth) fallback(); }, 2200);

  $('go').onclick = ()=>{ Voice.unlock(); Music.play(); scrVideo(); };
  $('teacherBtn').onclick = ()=>{ Voice.unlock(); scrTeacher(); };
  $('guideBtn').onclick = ()=>{ Voice.unlock(); scrGuide(scrCover); };
}

/* ---------- ٢) فيديو المقدّمة ---------- */
function scrVideo(){
  show(`
    <div class="coverwrap">
      <video id="iv" class="covervid full" playsinline autoplay preload="auto" controls>
        <source src="${INTRO_SRC}" type="video/mp4"></video>
      <div class="coverui" style="justify-content:flex-end;pointer-events:none">
        <button class="btn ghost" id="skip" style="pointer-events:auto">تخطّي المقدّمة ⏭</button>
      </div>
    </div>
  `, {bare:true});

  const v = $('iv');
  /* الفيديو جايب موسيقاه معه — بنوقّف موسيقى اللعبة حتى ما يتراكبوا */
  Music.pause();
  v.muted = false; v.volume = 1;
  Voice.stop();                 /* الفيديو إله سرده الخاص — بنسكّت راوي اللعبة */
  let ended = false;
  const finish = ()=>{ if(ended) return; ended = true; Voice.stop();
    try{v.pause();}catch(e){} scrLesson(); };

  v.addEventListener('ended', finish);
  v.addEventListener('error', finish);
  setTimeout(()=>{ if(!ended && $('iv') && !$('iv').videoWidth) finish(); }, 2800);
  $('skip').onclick = finish;

  /* بعض المتصفحات بتمنع تشغيل فيديو فيه صوت — إذا منعته، بنكتمه ونعيد */
  const tryPlay = ()=>{
    const pl = v.play();
    if(pl && pl.catch) pl.catch(()=>{
      v.muted = true;
      const p2 = v.play();
      if(p2 && p2.catch) p2.catch(()=>finish());
    });
  };
  tryPlay();
}

  const go = ()=>{ clearInterval(h); Voice.stop(); scrMode(); };
  $('skip').onclick = go;

  h = setInterval(()=>{
    left--;
    const sec = $('lsec'); if(!sec){ clearInterval(h); return; }
    const m = Math.floor(left/60), s = left%60;
    sec.textContent = AR_NUM(m)+':'+AR_NUM(String(s).padStart(2,'0'));

  /* ============ قائمة الكلمات الممنوعة الأوّلية ============
     المعلمة تقدر تزيد/تشيل من لوحة التحكم بدون رفع الملف من جديد.
     الكلمات القصيرة (٣ أحرف أو أقل) تُطابَق ككلمة كاملة فقط،
     عشان ما تمنع كلمات بريئة مثل "كسر" أو "مكسور".            */
  var BASE_WORDS = [
    'كلب', 'حمار', 'غبي', 'احمق', 'تافه', 'حقير', 'وسخ', 'خنزير',
    'زباله', 'قذر', 'سافل', 'متخلف', 'بهيمه', 'لعنه', 'يلعن',
    'كس', 'طيز', 'خرا', 'عرص', 'شرموط', 'منيوك', 'زق', 'زبي',
    'fuck', 'shit', 'bitch', 'idiot', 'stupid', 'ugly', 'dumb'
  ];

  /* ============ أدوات ============ */
  function lang() {
    var c = 'ar';
    try { c = localStorage.getItem('pv_lang') || 'ar'; } catch (e) { }
    return T[c] ? c : 'ar';
  }
  function t() {
    var o = T[lang()] || T.ar;
    /* مفاتيح الكتابة الحرة قد تكون غير مترجمة في كل اللغات */
    var k = ['freeOn','freeOff','write','sendBtn','tooLong','badWord','noNum'];
    for (var i = 0; i < k.length; i++) if (!o[k[i]]) o[k[i]] = T.en[k[i]];
    return o;
  }
  function isRTL() { var c = lang(); return c === 'ar' || c === 'he' || c === 'fa'; }

  /* تطبيع النص العربي: تشكيل، مدّ، ألف/همزة، ة/ه، ى/ي، أرقام بدل حروف */
  function norm(s) {
    if (!s) return '';
    s = String(s).toLowerCase();
    s = s.replace(/[\u064B-\u065F\u0670\u0640]/g, '');      // تشكيل + المدّ ـ
    s = s.replace(/[أإآا]/g, 'ا').replace(/ة/g, 'ه')
      .replace(/[ىي]/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي');
    s = s.replace(/3/g, 'ع').replace(/7/g, 'ح').replace(/5/g, 'خ')
      .replace(/9/g, 'ص').replace(/8/g, 'ق').replace(/2/g, 'ا').replace(/6/g, 'ط');
    s = s.replace(/[^\p{L}\p{N}]+/gu, ' ').replace(/\s+/g, ' ').trim();
    return s;
  }

  var wordList = BASE_WORDS.slice();

  function isBad(text) {
    var n = norm(text);
    if (!n) return false;
    var tokens = n.split(' ');
    for (var i = 0; i < wordList.length; i++) {
      var w = norm(wordList[i]);
      if (!w) continue;
      if (w.length <= 3) {                       // كلمة قصيرة → مطابقة تامة
        if (tokens.indexOf(w) !== -1) return true;
      } else {                                    // كلمة طويلة → تضمين
        if (n.indexOf(w) !== -1) return true;
      }
    }
    return false;
  }

  var FB = null, fbPromise = null;
  function initFB() {
    if (FB) return Promise.resolve(FB);
    if (fbPromise) return fbPromise;
    fbPromise = (async function () {
      try {
        var a = await import(SDK + 'firebase-app.js');
        var f = await import(SDK + 'firebase-firestore.js');
        var app;
        try { app = a.getApp('pvchat'); }
        catch (e) { app = a.initializeApp(FB_CONFIG, 'pvchat'); }
        FB = Object.assign({ db: f.getFirestore(app) }, f);
        return FB;
      } catch (e) { console.warn('[PVChat] Firebase off', e); return null; }
    })();
    return fbPromise;
  }
