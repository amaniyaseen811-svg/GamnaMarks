.pvc-genie b{position:absolute;bottom:16%;left:0;right:0;text-align:center;
  font-family:inherit;font-weight:900;font-size:clamp(1.2rem,5.4vw,1.8rem);
  color:#eaf6ff;text-shadow:0 0 10px rgba(90,180,255,.95),0 2px 10px rgba(0,0,0,.9);
  opacity:0;animation:pvcGenieTxt 3.2s ease forwards;padding:0 18px}
@keyframes pvcGenieBg{0%{opacity:0}18%{opacity:1}72%{opacity:1}100%{opacity:0}}
@keyframes pvcGenieUp{
  0%{transform:translateY(46%) scale(.55);opacity:0}
  30%{transform:translateY(0) scale(1.05);opacity:1}
  46%{transform:translateY(0) scale(1)}
  72%{transform:translateY(0) scale(1);opacity:1}
  100%{transform:translateY(-12%) scale(.94);opacity:0}}
@keyframes pvcGenieTxt{0%{opacity:0;transform:translateY(14px)}
  38%{opacity:1;transform:translateY(0)}74%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .pvc-genie,.pvc-genie img,.pvc-genie b{animation-duration:.6s}}
.pvc-toast{position:fixed;bottom:84px;inset-inline-start:16px;z-index:99992;
  background:rgba(0,0,0,.85);color:#fff;padding:9px 14px;border-radius:12px;font-size:13px;
  font-family:inherit;opacity:0;transition:opacity .25s}
.pvc-toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.pvc-fly{animation-duration:.01ms}}
.pvc-launch{position:fixed;bottom:82px;inset-inline-start:16px;z-index:99990;
  width:56px;height:56px;border-radius:50%;border:0;cursor:pointer;font-size:24px;
  background:var(--navy2,#0f2350);color:var(--gold,#e0b73c);
  border:1.5px solid var(--line,rgba(224,183,60,.35));
  box-shadow:0 8px 22px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.pvc-launch:active{transform:scale(.93)}
.pvc-dlg{position:fixed;inset:0;z-index:99995;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.62);padding:18px;font-family:inherit}
.pvc-dlg.on{display:flex}
.pvc-box{width:min(360px,100%);background:var(--navy2,#0f2350);color:var(--ink,#eaf0ff);
  border:1.5px solid var(--line,rgba(224,183,60,.28));border-radius:18px;padding:16px;
  box-shadow:0 16px 44px rgba(0,0,0,.5);max-height:88vh;overflow-y:auto}
.pvc-box h4{margin:0 0 4px;font-size:17px;color:var(--gold,#e0b73c)}
.pvc-box p{margin:0 0 10px;font-size:12.5px;opacity:.8;line-height:1.6}
.pvc-b{width:100%;padding:12px;border-radius:12px;border:0;cursor:pointer;margin-top:8px;
  font:inherit;font-weight:800;font-size:15px;
  background:linear-gradient(180deg,var(--gold2,#f6d976),var(--gold,#e0b73c));color:#20180a}
.pvc-b.alt{background:var(--teal,#2ec6b6);color:#04231f}
.pvc-b.gh{background:transparent;color:inherit;border:1px solid var(--line,rgba(255,255,255,.25));font-weight:700}
.pvc-write{display:flex;gap:6px;margin-top:8px}
.pvc-write input{flex:1;padding:10px;border-radius:12px;font:inherit;font-size:14px;
  border:1px solid var(--line,rgba(255,255,255,.2));background:rgba(0,0,0,.28);color:inherit;
  text-align:inherit}
.pvc-write button{padding:10px 14px;border-radius:12px;border:0;cursor:pointer;font:inherit;
  font-weight:800;background:var(--gold,#e0b73c);color:#20180a}
.pvc-code{text-align:center;font-size:30px;font-weight:900;letter-spacing:5px;
  color:var(--gold,#e0b73c);padding:10px 0}
`;

  var fab, badge, panel, headTitle, bodyEl, footEl, tabsEl, toastEl;
  var tab = 'msgs';

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  function toast(msg) {
    if (!toastEl) { toastEl = el('div', 'pvc-toast'); document.body.appendChild(toastEl); }
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function () { toastEl.classList.remove('on'); }, 2200);
  }

  function buildUI() {
    var st = el('style'); st.textContent = CSS; document.head.appendChild(st);

    fab = el('button', 'pvc-fab', '💬');
    badge = el('span', 'pvc-badge', '0');
    fab.appendChild(badge);
    fab.onclick = togglePanel;
    document.body.appendChild(fab);

    panel = el('div', 'pvc-panel');
    panel.dir = isRTL() ? 'rtl' : 'ltr';

    var head = el('div', 'pvc-head');
    headTitle = el('b', null, t().chat);
    var x = el('button', 'pvc-x', '✕'); x.onclick = togglePanel;
    head.appendChild(headTitle); head.appendChild(x);

    tabsEl = el('div', 'pvc-tabs');
    bodyEl = el('div', 'pvc-body');
    footEl = el('div', 'pvc-foot');

    panel.appendChild(head); panel.appendChild(tabsEl);
    panel.appendChild(bodyEl); panel.appendChild(footEl);
    document.body.appendChild(panel);

    renderTabs();
    renderFoot();
    renderBody();
  }

  function renderTabs() {
    tabsEl.innerHTML = '';
    var list = [['msgs', t().msgs], ['emoji', t().emoji]];
    if (S.role === 'teacher') list.push(['teacher', t().teacher]);
    list.forEach(function (p) {
      var b = el('button', 'pvc-tab' + (tab === p[0] ? ' on' : ''), p[1]);
      b.onclick = function () { tab = p[0]; renderTabs(); renderBody(); renderFoot(); };
      tabsEl.appendChild(b);
    });
  }

  function togglePanel() {
    S.panelOpen = !S.panelOpen;
    panel.classList.toggle('on', S.panelOpen);
    if (S.panelOpen) {
      S.unread = 0; updateBadge(); renderBody();
      if (S.name) showGenie();
    }
  }

  function updateBadge() {
    badge.style.display = S.unread > 0 ? 'flex' : 'none';
    badge.textContent = S.unread > 9 ? '9+' : String(S.unread);
  }

  /* ---------- عرض الرسائل ---------- */
  function msgText(m) {
    var L = T[lang()];
    if (typeof m.x === 'string') return m.x;
    if (m.p === -1) return '✋ ' + (L.hand.replace(' ✋', ''));
    if (typeof m.e === 'number') return EMOJI[m.e] || '•';
    var isT = (m.r === 't') || (typeof m.n === 'string' && m.n.indexOf('👩‍🏫') === 0);
    var arr = isT ? L.tph : L.ph;
    return arr[m.p] != null ? arr[m.p] : '…';
  }

  function renderBody() {
    if (tab === 'teacher') return renderTeacher();
    bodyEl.innerHTML = '';
    var list = S.msgs.filter(function (m) { return typeof m.e !== 'number'; });
    if (!list.length) { bodyEl.appendChild(el('div', 'pvc-empty', '—')); return; }
    list.forEach(function (m) {
      var isT = (m.r === 't') || (typeof m.n === 'string' && m.n.indexOf('👩‍🏫') === 0);
      var cls = 'pvc-msg' + (isT ? ' t' : '') + (m.p === -1 ? ' hand' : '');
      var who = esc(m.n);
      bodyEl.appendChild(el('div', cls, '<span class="who">' + who + ':</span> ' + esc(msgText(m))));
    });
    bodyEl.scrollTop = bodyEl.scrollHeight;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  /* ---------- أسفل اللوحة ---------- */
  function renderFoot() {
    footEl.innerHTML = '';
    if (tab === 'teacher') return;

    if (!S.open && S.role !== 'teacher') {
      footEl.appendChild(el('div', 'pvc-note', t().isClosed)); return;
    }
    if (S.muted.indexOf(S.name) !== -1 && S.role !== 'teacher') {
      footEl.appendChild(el('div', 'pvc-note', t().isMuted)); return;
    }

    if (tab === 'emoji') {
      var grid = el('div', 'pvc-emo');
      EMOJI.forEach(function (e, i) {
        var b = el('button', null, e);
        b.onclick = function () { send({ e: i }); };
        grid.appendChild(b);
      });
      footEl.appendChild(grid);
      return;
    }

    var chips = el('div', 'pvc-chips');
    var arr = (S.role === 'teacher') ? t().tph : t().ph;
    arr.forEach(function (txt, i) {
      var b = el('button', 'pvc-chip', txt);
      b.onclick = function () { send({ p: i }); };
      chips.appendChild(b);
    });
    footEl.appendChild(chips);

    if (S.role !== 'teacher') {
      var h = el('button', 'pvc-hand', t().hand);
      h.onclick = function () { send({ p: -1 }); };
      footEl.appendChild(h);
    }

    /* الكتابة الحرة — المعلمة دائمًا، والطالبات فقط إذا فتحتها المعلمة */
    if (S.free || S.role === 'teacher') {
      var wrap = el('div', 'pvc-write');
      var inp = el('input');
      inp.placeholder = t().write; inp.maxLength = 120;
      var bs = el('button', null, t().sendBtn);
      function doSend() {
        var v = inp.value.trim();
        if (!v) return;
        if (v.length > 120) { toast(t().tooLong); return; }
        if (isBad(v)) { toast(t().badWord); return; }
        if (/\d[\s.\-]?\d[\s.\-]?\d[\s.\-]?\d[\s.\-]?\d[\s.\-]?\d/.test(v)) { toast(t().noNum); return; }
        inp.value = '';
        send({ x: v });
      }
      bs.onclick = doSend;
      inp.onkeydown = function (e) { if (e.key === 'Enter') doSend(); };
      wrap.appendChild(inp); wrap.appendChild(bs);
      footEl.appendChild(wrap);
    }
  }

  /* ---------- لوحة المعلمة ---------- */
  function renderTeacher() {
    bodyEl.innerHTML = '';
    footEl.innerHTML = '';

    var tools = el('div', 'pvc-tools');
    var bClose = el('button', null, S.open ? t().closeChat : t().openChat);
    bClose.onclick = function () { setRoom({ open: !S.open }); };
    var bClear = el('button', null, t().clear);
    var clearArmed = false;
    bClear.onclick = function () {
      if (!clearArmed) {
        clearArmed = true;
        bClear.textContent = '⚠️ تأكيد المسح';
        setTimeout(function () { clearArmed = false; bClear.textContent = t().clear; }, 4000);
        return;
      }
      clearMsgs();
    };
    var bFree = el('button', null, S.free ? '✏️ ' + t().freeOn : '🔒 ' + t().freeOff);
    if (S.free) { bFree.style.background = 'var(--teal,#2ec6b6)'; bFree.style.color = '#04231f'; }
    bFree.onclick = function () { setRoom({ free: !S.free }); };
    tools.appendChild(bClose); tools.appendChild(bClear); tools.appendChild(bFree);
    bodyEl.appendChild(tools);

    /* أيادٍ مرفوعة */
    bodyEl.appendChild(el('div', 'pvc-h3', t().hands));
    var hands = [];
    S.msgs.forEach(function (m) { if (m.p === -1 && hands.indexOf(m.n) === -1) hands.push(m.n); });
    if (!hands.length) bodyEl.appendChild(el('div', 'pvc-note', t().none));
    else {
      var hl = el('div', 'pvc-list');
      hands.forEach(function (n) { hl.appendChild(el('div', 'pvc-row', '<span>✋ ' + esc(n) + '</span>')); });
      bodyEl.appendChild(hl);
    }

    /* الطلاب + الكتم */
    var names = [];
    S.msgs.forEach(function (m) {
      if (m.r !== 't' && m.n && names.indexOf(m.n) === -1) names.push(m.n);
    });
    S.muted.forEach(function (n) { if (names.indexOf(n) === -1) names.push(n); });
    if (names.length) {
      bodyEl.appendChild(el('div', 'pvc-h3', '👥'));
      var ul = el('div', 'pvc-list');
      names.forEach(function (n) {
        var row = el('div', 'pvc-row', '<span>' + esc(n) + '</span>');
        var isM = S.muted.indexOf(n) !== -1;
        var b = el('button', null, isM ? t().unmute : t().mute);
        b.onclick = function () {
          var m = S.muted.slice();
          if (isM) m = m.filter(function (x) { return x !== n; }); else m.push(n);
          setRoom({ muted: m });
        };
        row.appendChild(b); ul.appendChild(row);
      });
      bodyEl.appendChild(ul);
    }

    /* الكلمات الممنوعة */
    bodyEl.appendChild(el('div', 'pvc-h3', t().filter));
    var inp = el('input', 'pvc-in'); inp.placeholder = t().addWord;
    var save = el('button', 'pvc-hand', t().save);
    save.style.background = 'var(--gold,#e0b73c)'; save.style.color = '#20180a';
    save.onclick = function () {
      var v = inp.value.trim(); if (!v) return;
      if (wordList.indexOf(v) === -1) wordList.push(v);
      inp.value = ''; saveWords(); renderTeacher();
    };
    bodyEl.appendChild(inp); bodyEl.appendChild(save);

    var wl = el('div', 'pvc-list'); wl.style.marginTop = '8px';
    wordList.forEach(function (w) {
      var row = el('div', 'pvc-row', '<span>' + esc(w) + '</span>');
      var b = el('button', null, '✕');
      b.onclick = function () {
        wordList = wordList.filter(function (x) { return x !== w; });
        saveWords(); renderTeacher();
      };
      row.appendChild(b); wl.appendChild(row);
    });
    bodyEl.appendChild(wl);
  }

  /* ============ الإيموجي الطائرة ============ */
  function fly(i) {
    var e = el('div', 'pvc-fly', EMOJI[i] || '✨');
    e.style.insetInlineStart = (10 + Math.random() * 70) + '%';
    e.style.bottom = '90px';
    document.body.appendChild(e);
    setTimeout(function () { e.remove(); }, 2200);
  }

  /* ============ ظهور المارد ============ */
  var genieShown = false;
  function showGenie() {
    if (genieShown) return;                 /* مرة واحدة في كل جلسة لعب */
    genieShown = true;
    var w = el('div', 'pvc-genie');
    var im = el('img'); im.src = GENIE; im.alt = '';
    var tx = el('b', null, 'أهلاً يا ' + esc(S.name) + '! 🧞');
    w.appendChild(im); w.appendChild(tx);
    document.body.appendChild(w);
    setTimeout(function () { w.remove(); }, 3300);
  }

  /* ============ فايربيس: قراءة/كتابة ============ */
  /* معرّف اللعبة من اسم الملف → كل لعبة شات مستقل */
  function pvGameId(){ try{ var p=(location.pathname||'').split('/').pop()||''; p=p.replace(/\.html?$/i,'').toLowerCase().replace(/[^a-z0-9_-]/g,''); return p||'game'; }catch(e){ return 'game'; } }
  function pvRoomKey(){ return S.room + '__' + pvGameId(); }
  function roomRef(f) { return f.doc(f.db, 'pv_rooms', pvRoomKey()); }
  function msgsRef(f) { return f.collection(f.db, 'pv_rooms', pvRoomKey(), 'msgs'); }

  async function send(payload) {
    if (!S.room || !S.name) return;
    if (!S.open && S.role !== 'teacher') { toast(t().isClosed); return; }
    if (S.muted.indexOf(S.name) !== -1 && S.role !== 'teacher') { toast(t().isMuted); return; }
    var now = Date.now();
    if (now - S.lastSend < 1500) { toast(t().slow); return; }
    S.lastSend = now;

    if (typeof payload.e === 'number') fly(payload.e);   // عرض فوري عند المُرسِل

    var f = await initFB(); if (!f) return;
    /* ملاحظة: نرسل دور 's' حتى تقبله قواعد الفايربيس الحالية،
       والتمييز يتم عبر وسم الاسم بعلامة المعلمة. */
    var nm = String(S.name).slice(0, 20);
    if (S.role === 'teacher') nm = '👩‍🏫 ' + nm;
    var doc = { n: nm.slice(0, 24), r: 's', ts: now };
    if (typeof payload.x === 'string') doc.x = payload.x.slice(0, 120);
    else if (typeof payload.e === 'number') doc.e = payload.e;
    else doc.p = payload.p;
    try { await f.addDoc(msgsRef(f), doc); } catch (e) { console.warn('[PVChat] send', e); }
  }

  async function setRoom(patch) {
    var f = await initFB(); if (!f) return;
    try {
      await f.setDoc(roomRef(f), Object.assign({ open: S.open, free: S.free, muted: S.muted }, patch), { merge: true });
    } catch (e) { console.warn('[PVChat] room', e); }
  }

  async function clearMsgs() {
    var f = await initFB(); if (!f) return;
    try {
      var snap = await f.getDocs(msgsRef(f));
      var jobs = []; snap.forEach(function (d) { jobs.push(f.deleteDoc(d.ref)); });
      await Promise.all(jobs);
      toast(t().cleared);
    } catch (e) { console.warn('[PVChat] clear', e); }
  }

  async function loadWords() {
    var f = await initFB(); if (!f) return;
    try {
      var d = await f.getDoc(f.doc(f.db, 'pv_config', 'filter'));
      if (d.exists() && Array.isArray(d.data().list)) {
        var extra = d.data().list;
        wordList = BASE_WORDS.concat(extra.filter(function (w) {
          return BASE_WORDS.indexOf(w) === -1;
        }));
      }
    } catch (e) { }
  }

  async function saveWords() {
    var f = await initFB(); if (!f) return;
    try {
      await f.setDoc(f.doc(f.db, 'pv_config', 'filter'), { list: wordList }, { merge: true });
      toast(t().saved);
    } catch (e) { console.warn('[PVChat] words', e); }
  }

  /* ============ التشغيل ============ */
  async function start() {
    if (S.started) return;
    S.started = true;
    var f = await initFB(); if (!f) return;

    await loadWords();

    /* حالة الغرفة */
    S.unsubRoom = f.onSnapshot(roomRef(f), function (d) {
      var v = d.exists() ? d.data() : {};
      S.open = v.open !== false;
      S.free = v.free === true;          /* الافتراضي: مغلقة */
      S.muted = Array.isArray(v.muted) ? v.muted : [];
      renderFoot();
      if (tab === 'teacher') renderTeacher();
    }, function () { });

    /* المعلمة تنشئ مستند الغرفة أول مرة */
    if (S.role === 'teacher') setRoom({ open: true, free: S.free === true });

    /* الرسائل */
    var q = f.query(msgsRef(f), f.orderBy('ts', 'desc'), f.limit(40));
    var first = true;
    S.unsubMsgs = f.onSnapshot(q, function (snap) {
      var arr = []; snap.forEach(function (d) { arr.push(d.data()); });
      arr.reverse();

      if (!first) {
        snap.docChanges().forEach(function (ch) {
          if (ch.type !== 'added') return;
          var m = ch.doc.data();
          if (m.n === S.name) return;                       // لا نكرر رسائلنا
          if (typeof m.e === 'number') fly(m.e);
          else if (!S.panelOpen) { S.unread++; updateBadge(); }
        });
      }
      first = false;
      S.msgs = arr;
      if (S.panelOpen) renderBody();
      if (tab === 'teacher') renderTeacher();
    }, function () { });

    fab.style.display = 'flex';
  }

  function stop() {
    if (S.unsubMsgs) { S.unsubMsgs(); S.unsubMsgs = null; }
    if (S.unsubRoom) { S.unsubRoom(); S.unsubRoom = null; }
    S.started = false; S.msgs = []; S.unread = 0;
    if (fab) { fab.style.display = 'none'; updateBadge(); }
    if (panel) { panel.classList.remove('on'); S.panelOpen = false; }
  }


  /* ============ طبقة الغرفة المستقلة (تعمل بأي لعبة) ============ */
  var launchBtn = null, dlg = null;
  var LS_ROOM = 'pv_room', LS_NAME = 'pv_name', LS_ROLE = 'pv_role';
  var LS_TROOM = 'pv_teacher_room';      /* غرفة المعلمة المحفوظة */
  var TEACHER_PASS = 'amani2026';

  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { } }

  /* يحاول التقاط اسم اللاعب من اللعبة نفسها إن وُجد */
  function guessName() {
    var c = ['playerName', 'elmName', 'pvName', 'userName'];
    for (var i = 0; i < c.length; i++) {
      try { if (typeof window[c[i]] === 'string' && window[c[i]].length > 1) return window[c[i]]; } catch (e) { }
    }
    try { if (window.G && typeof G.name === 'string' && G.name.length > 1) return G.name; } catch (e) { }
    return lsGet(LS_NAME);
  }

  function buildLauncher() {
    if (launchBtn) return;
    if (!document.body) return;
    launchBtn = el('button', 'pvc-launch', '🏫');
    launchBtn.title = 'غرفة الصف';
    launchBtn.onclick = openDialog;
    document.body.appendChild(launchBtn);

    dlg = el('div', 'pvc-dlg');
    dlg.onclick = function (e) { if (e.target === dlg) closeDialog(); };
    document.body.appendChild(dlg);
  }

  function closeDialog() { if (dlg) dlg.classList.remove('on'); }

  function openDialog() {
    if (!dlg) return;
    dlg.dir = isRTL() ? 'rtl' : 'ltr';
    var box = el('div', 'pvc-box');

    /* ===== داخل غرفة بالفعل ===== */
    if (S.room && S.name) {
      box.appendChild(el('h4', null, '🏫 غرفة الصف'));
      box.appendChild(el('div', 'pvc-code', esc(S.room)));
      box.appendChild(el('p', null,
        S.role === 'teacher'
          ? '👩‍🏫 أنتِ المعلمة — أعطي هذا الكود للطالبات'
          : '👤 ' + esc(S.name)));

      if (S.role === 'teacher') {
        var bLeave = el('button', 'pvc-b gh', 'إغلاق اللوحة (الغرفة تبقى محفوظة)');
        bLeave.onclick = closeDialog;
        var bDel = el('button', 'pvc-b gh', '🗑️ حذف الغرفة نهائيًا');
        bDel.style.color = 'var(--red,#e2504a)';
        var armed = false;
        bDel.onclick = function () {
          if (!armed) {                       /* ضغطة أولى: تأكيد */
            armed = true;
            bDel.textContent = '⚠️ اضغطي مرة أخرى للتأكيد';
            setTimeout(function () {
              armed = false; bDel.textContent = '🗑️ حذف الغرفة نهائيًا';
            }, 4000);
            return;
          }
          lsDel(LS_ROOM); lsDel(LS_ROLE); lsDel(LS_TROOM);
          stop(); S.room = ''; S.role = 'student';
          closeDialog();
        };
        box.appendChild(bLeave); box.appendChild(bDel);
      } else {
        var bOut = el('button', 'pvc-b gh', 'خروج من الغرفة');
        bOut.onclick = function () {
          lsDel(LS_ROOM); lsDel(LS_ROLE);
          stop(); S.room = ''; S.role = 'student';
          closeDialog();
        };
        var bC = el('button', 'pvc-b', 'إغلاق');
        bC.onclick = closeDialog;
        box.appendChild(bOut); box.appendChild(bC);
      }

      dlg.innerHTML = ''; dlg.appendChild(box); dlg.classList.add('on');
      return;
    }

    /* ===== شاشة الدخول ===== */
    box.appendChild(el('h4', null, '🏫 غرفة الصف'));
    box.appendChild(el('p', null, 'اكتبي اسمك وكود الغرفة الذي أعطتك إياه المعلمة.'));

    var nIn = el('input', 'pvc-in'); nIn.placeholder = 'الاسم'; nIn.maxLength = 24;
    nIn.value = guessName();
    box.appendChild(nIn);

    function name() {
      var v = nIn.value.trim();
      if (v.length < 2) { toast('اكتبي اسمك'); return null; }
      if (isBad(v)) { toast(t().badName); return null; }
      return v;
    }

    /* انضمام — الطريق الأساسي للطالبات */
    var cIn = el('input', 'pvc-in');
    cIn.placeholder = 'كود الغرفة (٦ أرقام)'; cIn.inputMode = 'numeric'; cIn.maxLength = 6;
    var bJoin = el('button', 'pvc-b alt', '👤 انضمام');
    bJoin.onclick = function () {
      var v = name(); if (!v) return;
      var c = cIn.value.trim();
      if (!/^\d{6}$/.test(c)) { toast('اكتبي كود من ٦ أرقام'); return; }
      lsSet(LS_NAME, v); lsSet(LS_ROOM, c); lsSet(LS_ROLE, 'student');
      begin(c, v, 'student'); closeDialog();
    };
    box.appendChild(cIn); box.appendChild(bJoin);

    /* قسم المعلمة — محمي بكلمة السر */
    var sep = el('div', 'pvc-h3', '— للمعلمة فقط —');
    sep.style.textAlign = 'center'; sep.style.marginTop = '14px';
    box.appendChild(sep);

    /* حقل كلمة سر المعلمة — مخفي حتى تضغط الزر */
    var pIn = el('input', 'pvc-in');
    pIn.type = 'password'; pIn.placeholder = 'كلمة سر المعلمة';
    pIn.style.display = 'none';

    var bGo = el('button', 'pvc-b', '✅ إنشاء / فتح الغرفة');
    bGo.style.display = 'none';

    var bT = el('button', 'pvc-b gh', '👩‍🏫 دخول المعلمة');
    bT.onclick = function () {
      pIn.style.display = 'block';
      bGo.style.display = 'block';
      bT.style.display = 'none';
      setTimeout(function () { pIn.focus(); }, 60);
    };

    function teacherGo() {
      var v = name(); if (!v) return;
      if (pIn.value.trim() !== TEACHER_PASS) { toast('كلمة السر غير صحيحة'); return; }

      var code = lsGet(LS_TROOM);
      if (!code) code = String(Math.floor(100000 + Math.random() * 900000));

      lsSet(LS_NAME, v); lsSet(LS_ROOM, code);
      lsSet(LS_ROLE, 'teacher'); lsSet(LS_TROOM, code);
      begin(code, v, 'teacher'); closeDialog(); openDialog();
    }
    bGo.onclick = teacherGo;
    pIn.onkeydown = function (e) { if (e.key === 'Enter') teacherGo(); };

    box.appendChild(bT); box.appendChild(pIn); box.appendChild(bGo);

    var bX = el('button', 'pvc-b gh', 'إلغاء');
    bX.onclick = closeDialog;
    box.appendChild(bX);

    dlg.innerHTML = ''; dlg.appendChild(box); dlg.classList.add('on');
    setTimeout(function () { if (!nIn.value) nIn.focus(); }, 60);
  }

  function begin(room, name, role) {
    if (!fab) buildUI();
    stop();
    S.room = room; S.name = name; S.role = role || 'student';
    renderTabs(); renderFoot();
    start();
  }

  /* تشغيل تلقائي: زر الغرفة يظهر بأي لعبة، ولو في غرفة محفوظة بيكمل عليها */
  function auto() {
    // ✅ عرض الفيديو أولاً قبل اللعبة
    showIntroVideo();
  }
  
  // ✅ شاشة الفيديو التفاعلية
  function showIntroVideo() {
    if (!fab) buildUI();
    
    const videoContainer = document.createElement('div');
    videoContainer.id = 'videoContainer';
    videoContainer.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    `;
    
    const video = document.createElement('video');
    video.id = 'introVideo';
    video.style.cssText = `
      width: 100%;
      height: 100%;
      object-fit: cover;
    `;
    video.src = 'kanaan_intro.mp4';
    video.autoplay = true;
    video.controls = false;
    
    // زر تخطي الفيديو
    const skipBtn = document.createElement('button');
    skipBtn.textContent = '⏭️ تخطي الفيديو';
    skipBtn.style.cssText = `
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 30px;
      background: rgba(229, 172, 46, 0.9);
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10000;
    `;
    
    videoContainer.appendChild(video);
    videoContainer.appendChild(skipBtn);
    document.body.appendChild(videoContainer);
    
    // عند انتهاء الفيديو
    video.onended = function() {
      goToGame();
    };
    
    // عند الضغط على التخطي
    skipBtn.onclick = function() {
      goToGame();
    };
  }
  
  // ✅ الذهاب للعبة الفعلية
  function goToGame() {
    const videoContainer = document.getElementById('videoContainer');
    if (videoContainer) {
      videoContainer.remove();
    }
    
    // استكمال البداية العادية
    if (!fab) buildUI();
    buildLauncher();
    var n = lsGet(LS_NAME), ro = lsGet(LS_ROLE) || 'student';
    var tr = lsGet(LS_TROOM);
    var r = (ro === 'teacher' && tr) ? tr : lsGet(LS_ROOM);
    if (r && n) begin(r, n, ro);
  }

  /* ============ الواجهة البرمجية ============ */
  window.PVChat = {
    /* PVChat.attach(G) — يراقب حالة اللعبة ويشغّل الشات تلقائيًا */
    attach: function (G) {
      if (!G || window.PVChat._attached) return;
      window.PVChat._attached = true;
      if (!fab) buildUI();
      var lastKey = '';
      setInterval(function () {
        var room = G.room || '';
        var role = (G.mode === 'host') ? 'teacher' : 'student';
        // في وضع "host" المعلمة ما بتدخل اسم، فبنعطيها اسمًا داخليًا
        var name = G.name || (role === 'teacher' ? 'teacher' : '');
        var key = room + '|' + name + '|' + role;
        if (key === lastKey) return;
        lastKey = key;
        stop();
        if (room && name) {
          S.room = room; S.name = name; S.role = role;
          renderTabs(); renderFoot();
          start();
        }
      }, 800);
    },

    /* PVChat.badName('...') — true إذا الاسم فيه كلمة ممنوعة */
    badName: function (n) { return isBad(n); },

    /* رسالة التنبيه الجاهزة عند رفض الاسم */
    badNameMsg: function () { return t().badName; },

    /* تشغيل يدوي بدون attach */
    startWith: function (room, name, role) {
      if (!fab) buildUI();
      stop(); S.room = room; S.name = name; S.role = role || 'student';
      renderTabs(); renderFoot(); start();
    },

    stop: stop,
    words: function () { return wordList.slice(); },

    /* PVChat.auto() — للألعاب اللي ما فيها وضع غرفة صف */
    auto: auto,
    openRoom: openDialog
  };

  /* حمّل قائمة الكلمات مبكرًا حتى يعمل badName قبل بدء اللعب */
  initFB().then(function () { loadWords(); });

  /* تشغيل تلقائي إذا اللعبة ما نادت attach() خلال ثانيتين */
  function bootAuto() {
    setTimeout(function () { if (!window.PVChat._attached) auto(); }, 1500);
  }
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', bootAuto);
  else bootAuto();
})();

    return out;
  }

  function updateFab() {
    if (!fab) return;
    fab.style.display = (MY.room && MY.name) ? 'flex' : 'none';
    fab.classList.toggle('live', live);

  /* ============ الأدوار ============ */

  function renderTeacher() {

    bodyEl.appendChild(el('div', 'pvm-h3', TX('كم مايك مفتوح معًا؟', 'Mics open at once')));
    var stp = el('div', 'pvm-step');

    /* رافعات اليد + الطالبات المسموح لهن */
    bodyEl.appendChild(el('div', 'pvm-h3', '✋ ' + TX('الطلبات والمايكات', 'Requests & mics')));
    var ids = [], seen = {};
    Object.keys(handMap).forEach(function (id) { if (!seen[id]) { seen[id] = 1; ids.push(id); } });
    ctrl.speakers.forEach(function (id) { if (!seen[id]) { seen[id] = 1; ids.push(id); } });
    if (!ids.length) {
      bodyEl.appendChild(el('div', 'pvm-note', TX('لا توجد طلبات بعد. الطالبة تضغط «اطلبي المايك» فيظهر اسمها هنا.', 'No requests yet. When a student taps “Raise hand”, her name shows here.')));
    } else {
      var openCount = ctrl.speakers.length;
      var list = el('div', 'pvm-list');
      /* المسموح لهن أولًا، ثم رافعات اليد */
      ids.sort(function (a, b) {
        var oa = ctrl.speakers.indexOf(a) !== -1 ? 0 : 1;
        var ob = ctrl.speakers.indexOf(b) !== -1 ? 0 : 1;
        return oa - ob;
      });
      ids.forEach(function (id) {
        var on = ctrl.speakers.indexOf(id) !== -1;
        var nm = (ctrl.names && ctrl.names[id]) || (handMap[id] && handMap[id].name) || (liveMap[id] && liveMap[id].name) || '؟';
        var talking = !!liveMap[id];
        var cls = 'pvm-row' + (on ? ' spk' : ' rz');
        var row = el('div', cls);
        row.appendChild(el('span', 'nm', (on ? (talking ? '🎤 ' : '🔈 ') : '✋ ') + esc(nm)));
        var b = el('button', on ? 'off' : '', on ? TX('إغلاق', 'Close') : TX('افتحي', 'Open'));
        if (!on && openCount >= ctrl.micMax) b.disabled = true;
        b.onclick = on ? function () { revoke(id); } : function () { grant(id, nm); };
        row.appendChild(b);
        list.appendChild(row);
      });
      bodyEl.appendChild(list);
    }

    var ca = el('button', 'pvm-b pvm-closeall', '🔇 ' + TX('إغلاق كل المايكات', 'Close all mics'));
    ca.onclick = closeAll; bodyEl.appendChild(ca);

    bodyEl.appendChild(musicBtn());
    if (!audioOK) {
      var ba = el('button', 'pvm-b', '🔊 ' + TX('تشغيل الصوت', 'Enable sound'));
      ba.onclick = enableAudio; bodyEl.appendChild(ba);
    }
  }

  /* ============ تحكم المعلمة ============ */
  async function writeCtrl(patch) {
    var f = await initFB(); if (!f) return;
    try {
      await f.setDoc(ctrlRef(f), Object.assign({ on: true, micMax: ctrl.micMax, speakers: ctrl.speakers, names: ctrl.names, hostId: MY.id }, patch), { merge: true });
    } catch (e) { console.warn('[PVMic] ctrl', e); }
  }
  function setMicMax(n) {
    n = Math.max(1, Math.min(8, n | 0));
    var sp = ctrl.speakers.slice(0, n);
    writeCtrl({ micMax: n, speakers: sp });
  }
  async function grant(id, nm) {
    if (ctrl.speakers.indexOf(id) !== -1) return;
    if (ctrl.speakers.length >= ctrl.micMax) return;
    var sp = ctrl.speakers.concat([id]);
    var names = Object.assign({}, ctrl.names); names[id] = nm || id;
    await writeCtrl({ speakers: sp, names: names });
    /* أزل طلب رفع اليد بعد المنح */
    var f = await initFB(); if (f) { try { await f.deleteDoc(handRef(f, id)); } catch (e) { } }
  }
  async function revoke(id) {
    var sp = ctrl.speakers.filter(function (x) { return x !== id; });
    await writeCtrl({ speakers: sp });
    /* المعلمة تُطفئ مايك الطالبة فعليًا: تحذف مستند بثّها */
    var f = await initFB(); if (f) { try { await f.deleteDoc(liveRef(f, id)); } catch (e) { } }
  }
  async function closeAll() {
    await writeCtrl({ speakers: [] });
    var f = await initFB(); if (!f) return;
    var ids = Object.keys(liveMap);
    ids.forEach(function (id) { if (id !== MY.id) { f.deleteDoc(liveRef(f, id)).catch(function () { }); } });
  }

  /* ============ رفع اليد ============ */
  async function raiseHand() {
    raised = true; render();
    var f = await initFB(); if (!f) return;
    try { await f.setDoc(handRef(f, MY.id), { name: MY.name, ts: Date.now() }, { merge: true }); } catch (e) { }
  }
  async function lowerHand() {
    raised = false; render();
    var f = await initFB(); if (!f) return;
    try { await f.deleteDoc(handRef(f, MY.id)); } catch (e) { }
  }

  /* ============ موسيقى اللعبة: كتم يدوي + هدوء تلقائي عند الكلام ============ */
  function anySpeaking() { return live || Object.keys(liveMap).length > 0; }
  function applyMusic() {
    try {
      if (window.bgMusic) window.bgMusic.muted = (musicMuted || anySpeaking());
    } catch (e) { }
  }
  function musicBtn() {
    var b = el('button', 'pvm-b', musicMuted
      ? ('🔇 ' + TX('الموسيقى مكتومة — اضغطي للتشغيل', 'Music muted — tap to play'))
      : ('🎵 ' + TX('كتم موسيقى اللعبة', 'Mute game music')));
    if (musicMuted) { b.style.background = '#e2504a'; b.style.color = '#fff'; b.style.border = '0'; }
    b.onclick = function () { musicMuted = !musicMuted; applyMusic(); render(); };
    return b;
  }

  /* ============ الصوت ============ */
  function enableAudio() {
    audioOK = true;
    Object.keys(lisConns).forEach(function (id) {
      var c = lisConns[id]; if (c && c.audio) { try { c.audio.play(); } catch (e) { } }
    });
    render();
  }

  /* ============ بدء/إيقاف التحدث ============ */
  async function startTalking() {
    if (!iAmGranted()) return;
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    } catch (e) {
      msgLine(TX('لم يُسمح باستخدام المايك. من إعدادات المتصفح اسمحي للميكروفون ثم أعيدي المحاولة.',
        'Microphone permission denied. Allow the mic in your browser settings and try again.'));
      return;
    }
    live = true; audioOK = true;
    var f = await initFB();
    if (f) { try { await f.setDoc(liveRef(f, MY.id), { name: MY.name, role: MY.role, ts: Date.now() }, { merge: true }); } catch (e) { } }
    startSpeakerListener();
    startLiveHeartbeat();
    updateFab(); render();
  }
  async function stopTalking() {
    hardStopMic();
    var f = await initFB();
    if (f) { try { await f.deleteDoc(liveRef(f, MY.id)); } catch (e) { } }
    updateFab(); render();
  }
  function hardStopMic() {
    live = false;
    stopLiveHeartbeat();
    if (unsubSpkQ) { try { unsubSpkQ(); } catch (e) { } unsubSpkQ = null; }
    Object.keys(spkConns).forEach(function (id) { closeSpk(id); });
    if (localStream) {
      localStream.getTracks().forEach(function (tr) { try { tr.stop(); } catch (e) { } });
      localStream = null;
    }
  }
  function startLiveHeartbeat() {
    stopLiveHeartbeat();
    liveHbTimer = setInterval(function () {
      if (!live) return;
      initFB().then(function (f) { if (f) f.setDoc(liveRef(f, MY.id), { ts: Date.now() }, { merge: true }).catch(function () { }); });
    }, LIVE_HB);
  }
  function stopLiveHeartbeat() { if (liveHbTimer) { clearInterval(liveHbTimer); liveHbTimer = null; } }

  function msgLine(msg) {
    if (!bodyEl) return;
    var n = el('div', 'pvm-note', esc(msg)); n.style.color = '#ffb3b3';
    bodyEl.insertBefore(n, bodyEl.firstChild);
    setTimeout(function () { try { n.remove(); } catch (e) { } }, 6000);
  }

  /* =========================================================
     WebRTC — أنا مستمعة: أتصل بكل متحدث فعليًا
     ========================================================= */
  function reconcileListen() {
    var f = FB;
    var want = {};
    Object.keys(liveMap).forEach(function (id) {
      if (id === MY.id) return;
      var l = liveMap[id];
      if (Date.now() - (l.ts || 0) > LIVE_TTL) return;
      want[id] = true;
      if (!lisConns[id]) ensureListen(id);
    });
    Object.keys(lisConns).forEach(function (id) { if (!want[id]) closeListen(id); });
    updateFab();
    if (panelOpen) render();
  }

  async function ensureListen(spkId) {
    if (lisConns[spkId]) return;
    var f = await initFB(); if (!f) return;
    var pc = new RTCPeerConnection(ICE);
    var conn = { pc: pc, spk: spkId, audio: null, cands: {}, remoteSet: false };
    lisConns[spkId] = conn;

    try { pc.addTransceiver('audio', { direction: 'recvonly' }); } catch (e) { }

    pc.ontrack = function (ev) {
      var a = conn.audio;
      if (!a) {
        a = document.createElement('audio');
        a.autoplay = true; a.playsInline = true; a.setAttribute('playsinline', '');
        conn.audio = a; audioBox.appendChild(a);
      }
      a.srcObject = ev.streams[0];
      if (audioOK) { try { a.play(); } catch (e) { } }
    };
    pc.onicecandidate = function (ev) {
      if (!ev.candidate) return;
      var patch = { cl: f.arrayUnion(ev.candidate.toJSON()) };
      f.setDoc(pairRef(f, spkId, MY.id), Object.assign({ spk: spkId, lis: MY.id }, patch), { merge: true }).catch(function () { });
    };
    pc.oniceconnectionstatechange = function () {
      var s = pc.iceConnectionState;
      if (s === 'failed') { closeListen(spkId); setTimeout(reconcileListen, 1200); }
    };

    conn.unsub = f.onSnapshot(pairRef(f, spkId, MY.id), async function (snap) {
      if (!snap.exists()) return;
      var d = snap.data() || {};
      try {
        if (d.answer && !conn.remoteSet) {
          conn.remoteSet = true;
          await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
        }
        if (Array.isArray(d.cs) && pc.remoteDescription) {
          d.cs.forEach(function (c) {
            var k = JSON.stringify(c); if (conn.cands[k]) return; conn.cands[k] = 1;
            pc.addIceCandidate(new RTCIceCandidate(c)).catch(function () { });
          });
        }
      } catch (e) { console.warn('[PVMic] listen', e); }
    }, function () { });

    try {
      var offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await f.setDoc(pairRef(f, spkId, MY.id), { spk: spkId, lis: MY.id, offer: { type: offer.type, sdp: offer.sdp }, answer: null, cs: [], cl: [] }, { merge: false });
    } catch (e) { console.warn('[PVMic] offer', e); }
  }

  function closeListen(spkId) {
    var c = lisConns[spkId]; if (!c) return;
    delete lisConns[spkId];
    if (c.unsub) { try { c.unsub(); } catch (e) { } }
    if (c.pc) { try { c.pc.close(); } catch (e) { } }
    if (c.audio) { try { c.audio.srcObject = null; c.audio.remove(); } catch (e) { } }
    initFB().then(function (f) { if (f) f.deleteDoc(pairRef(f, spkId, MY.id)).catch(function () { }); });
  }

  /* =========================================================
     WebRTC — أنا متحدثة: أردّ على كل مستمعة تطلبني
     ========================================================= */
  function startSpeakerListener() {
    if (unsubSpkQ) return;
    initFB().then(function (f) {
      if (!f || !live) return;
      var q = f.query(pairsCol(f), f.where('spk', '==', MY.id));
      unsubSpkQ = f.onSnapshot(q, function (snap) {
        snap.forEach(function (docu) { handleListenerPair(docu.id, docu.data()); });
      }, function () { });
    });
  }

  async function handleListenerPair(pairId, d) {
    if (!live || !d) return;
    var lisId = d.lis; if (!lisId || lisId === MY.id) return;
    var f = await initFB(); if (!f) return;
    var conn = spkConns[lisId];

    if (!conn) {
      if (!d.offer) return;
      var pc = new RTCPeerConnection(ICE);
      conn = { pc: pc, lis: lisId, cands: {}, answered: false };
      spkConns[lisId] = conn;
      if (localStream) localStream.getTracks().forEach(function (tr) { pc.addTrack(tr, localStream); });
      pc.onicecandidate = function (ev) {
        if (!ev.candidate) return;
        f.setDoc(pairRef(f, MY.id, lisId), { cs: f.arrayUnion(ev.candidate.toJSON()) }, { merge: true }).catch(function () { });
      };
      pc.oniceconnectionstatechange = function () {
        var s = pc.iceConnectionState;
        if (s === 'failed' || s === 'disconnected' || s === 'closed') {
          setTimeout(function () {
            var cc = spkConns[lisId];
            if (cc && (cc.pc.iceConnectionState === 'failed' || cc.pc.iceConnectionState === 'closed')) {
              closeSpk(lisId);
              f.deleteDoc(pairRef(f, MY.id, lisId)).catch(function () { });
            }
          }, 2500);
        }
      };
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(d.offer));
        var ans = await pc.createAnswer();
        await pc.setLocalDescription(ans);
        conn.answered = true;
        await f.setDoc(pairRef(f, MY.id, lisId), { answer: { type: ans.type, sdp: ans.sdp } }, { merge: true });
      } catch (e) { console.warn('[PVMic] answer', e); }
    }

    if (Array.isArray(d.cl) && conn.pc.remoteDescription) {
      d.cl.forEach(function (c) {
        var k = JSON.stringify(c); if (conn.cands[k]) return; conn.cands[k] = 1;
        conn.pc.addIceCandidate(new RTCIceCandidate(c)).catch(function () { });
      });
    }
  }

  function closeSpk(lisId) {
    var c = spkConns[lisId]; if (!c) return;
    delete spkConns[lisId];
    if (c.pc) { try { c.pc.close(); } catch (e) { } }
  }

  /* ============ التشغيل ============ */
  async function start() {
    if (started) return;
    started = true;
    buildUI();
    updateFab();                 /* أظهري زر المايك فورًا عند الدخول للغرفة */
    var f = await initFB();
    if (!f) {                    /* الشبكة لم تجهز بعد → أعيدي المحاولة */
      started = false;
      setTimeout(function () { if (MY.room && MY.name) start(); }, 4000);
      return;
    }

    if (MY.role === 'teacher') {
      f.getDoc(ctrlRef(f)).then(function (d) {
        if (!d.exists()) writeCtrl({ on: true, micMax: 1, speakers: [], names: {} });
      }).catch(function () { });
    }

    unsubCtrl = f.onSnapshot(ctrlRef(f), function (d) {
      fbConnected = true;
      var v = d.exists() ? d.data() : {};
      ctrl.on = v.on !== false;
      ctrl.micMax = Math.max(1, Math.min(8, v.micMax || 1));
      ctrl.speakers = Array.isArray(v.speakers) ? v.speakers : [];
      ctrl.names = v.names || {};
      /* سُحب إذني وأنا أتحدث → أغلق مايكي فورًا */
      if (!iAmGranted() && live) stopTalking();
      updateFab();
      if (panelOpen) render();
    }, function () { });

    unsubLive = f.onSnapshot(liveCol(f), function (snap) {
      fbConnected = true;
      var m = {};
      snap.forEach(function (docu) { m[docu.id] = docu.data() || {}; });
      liveMap = m;
      reconcileListen();
    }, function () { });

    /* المعلمة فقط تراقب رفع الأيادي وتنظّف القديم */
    if (MY.role === 'teacher') {
      unsubHands = f.onSnapshot(handsCol(f), function (snap) {
        var h = {};
        snap.forEach(function (docu) { h[docu.id] = docu.data() || {}; });
        handMap = h;
        if (panelOpen) render();
      }, function () { });

      pruneTimer = setInterval(function () {
        var now = Date.now();
        Object.keys(liveMap).forEach(function (id) {
          if (id !== MY.id && now - (liveMap[id].ts || 0) > LIVE_TTL + 10000) {
            f.deleteDoc(liveRef(f, id)).catch(function () { });
          }
        });
      }, 15000);
    }

    updateFab();
  }

  function stop() {
    if (!started) return;
    started = false;
    [unsubCtrl, unsubLive, unsubHands, unsubSpkQ].forEach(function (u) { if (u) { try { u(); } catch (e) { } } });
    unsubCtrl = unsubLive = unsubHands = unsubSpkQ = null;
    if (pruneTimer) { clearInterval(pruneTimer); pruneTimer = null; }
    hardStopMic();
    Object.keys(lisConns).forEach(function (id) { closeListen(id); });
    Object.keys(spkConns).forEach(function (id) { closeSpk(id); });
    liveMap = {}; handMap = {}; raised = false;
    var f = FB;
    if (f && MY.room && MY.id) {
      f.deleteDoc(handRef(f, MY.id)).catch(function () { });
      f.deleteDoc(liveRef(f, MY.id)).catch(function () { });
    }
    updateFab();
    if (panel) { panel.classList.remove('on'); panelOpen = false; }
  }

  function begin(room, name, role) {
    stop();
    MY.id = myMicId(); MY.room = room; MY.name = name; MY.role = role || 'student';
    buildUI(); updateFab();
    start();
  }

  /* ============ الربط مع حالة الغرفة (نفس مفاتيح PVChat) ============ */
  var lastKey = '';
  function poll() {
    var name = lsGet('pv_name');
    var role = lsGet('pv_role') || 'student';
    var troom = lsGet('pv_teacher_room');
    var room = (role === 'teacher' && troom) ? troom : lsGet('pv_room');
    var key = room + '|' + name + '|' + role;
    if (key === lastKey) return;
    lastKey = key;
    if (room && name) begin(room, name, role);
    else stop();
  }

  window.addEventListener('pagehide', function () { hardStopMic(); });
  window.addEventListener('beforeunload', function () { hardStopMic(); });

  window.PVMic = { _v: 2, refresh: poll, stop: stop };

  function boot() {
    buildUI();
    poll();
    setInterval(poll, 1200);
    setInterval(function () { applyMusic(); if (panelOpen) render(); }, 2000);  /* تحديث + كتم الموسيقى */
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else setTimeout(boot, 300);
})();

<script src="kanaan-translations.js"></script>

<script>
/* ======================================================================
   خلفيات ساحرة تتغيّر مع كل سؤال — مشاهد كنعانية مرسومة داخل الملف
   (SVG خفيف، بلا صور خارجية، فلا يزيد حجم اللعبة تقريباً)
   ====================================================================== */
(function(){
  'use strict';
  var W=1200, H=800;
  function sky(a,b){ return '<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0" stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient></defs>'
    + '<rect width="'+W+'" height="'+H+'" fill="url(#sk)"/>'; }
  function stars(n,seed){ var o='',x,y,r,i;
    for(i=0;i<n;i++){ x=(seed*97*(i+3))%W; y=((seed*53*(i+7))%(H*0.55));
      r=((i%3)+1)*0.9;
      o+='<circle cx="'+x.toFixed(0)+'" cy="'+y.toFixed(0)+'" r="'+r+'" fill="#f7d271" opacity="'+(0.25+(i%4)*0.13).toFixed(2)+'"/>'; }
    return o; }
  function moon(cx,cy,r){ return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#f7d271" opacity=".55"/>'
    + '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*1.9)+'" fill="#f7d271" opacity=".08"/>'; }
  function hills(y,c,o){ return '<path d="M0 '+H+' L0 '+y+' Q '+(W*0.18)+' '+(y-90)+' '+(W*0.36)+' '+(y-20)
    + ' Q '+(W*0.58)+' '+(y+70)+' '+(W*0.74)+' '+(y-40)+' Q '+(W*0.9)+' '+(y-110)+' '+W+' '+(y-30)
    + ' L '+W+' '+H+' Z" fill="'+c+'" opacity="'+o+'"/>'; }
  function wall(x,y,w,h,c){ var o='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>',i;
    for(i=0;i<7;i++) o+='<rect x="'+(x+i*(w/7))+'" y="'+(y-26)+'" width="'+(w/13)+'" height="28" fill="'+c+'"/>';
    return o; }
  function olive(cx,by,sc,c1,c2){
    return '<g transform="translate('+cx+','+by+') scale('+sc+')">'
      + '<path d="M-8 0 L-4 -70 L4 -70 L8 0 Z" fill="'+c2+'"/>'
      + '<ellipse cx="0" cy="-92" rx="62" ry="40" fill="'+c1+'" opacity=".92"/>'
      + '<ellipse cx="-38" cy="-72" rx="34" ry="24" fill="'+c1+'" opacity=".8"/>'
      + '<ellipse cx="38" cy="-74" rx="32" ry="22" fill="'+c1+'" opacity=".8"/></g>'; }
  function jar(cx,by,sc,c){ return '<g transform="translate('+cx+','+by+') scale('+sc+')">'
      + '<path d="M-30 0 Q-46 -46 -22 -78 L-16 -96 L16 -96 L22 -78 Q46 -46 30 0 Z" fill="'+c+'"/>'
      + '<rect x="-20" y="-104" width="40" height="12" rx="5" fill="'+c+'"/>'
      + '<path d="M-30 -50 Q0 -36 30 -50" stroke="#f7d271" stroke-width="3" fill="none" opacity=".5"/></g>'; }
  function shell(cx,cy,sc,c){ var o='<g transform="translate('+cx+','+cy+') scale('+sc+')">',i;
    o+='<path d="M-46 20 Q-46 -40 0 -44 Q46 -40 46 20 Z" fill="'+c+'"/>';
    for(i=-3;i<=3;i++) o+='<path d="M0 -42 L'+(i*13)+' 20" stroke="#2b2145" stroke-width="2" opacity=".35"/>';
    return o+'</g>'; }
  function tablet(cx,cy,sc,c,ink){
    var g='<g transform="translate('+cx+','+cy+') scale('+sc+')">'
      + '<rect x="-110" y="-140" width="220" height="280" rx="18" fill="'+c+'"/>', i, j;
    for(i=0;i<6;i++) for(j=0;j<4;j++)
      g+='<rect x="'+(-86+j*46)+'" y="'+(-112+i*42)+'" width="26" height="26" rx="5" fill="'+ink+'" opacity=".45"/>';
    return g+'</g>'; }
  function city(y,c){ var o='',i,w,h,x;
    for(i=0;i<11;i++){ w=60+((i*37)%60); h=70+((i*53)%140); x=i*(W/11)-10;
      o+='<rect x="'+x+'" y="'+(y-h)+'" width="'+w+'" height="'+h+'" fill="'+c+'" opacity="'+(0.55+(i%3)*0.14).toFixed(2)+'"/>';
      o+='<path d="M'+x+' '+(y-h)+' L'+(x+w/2)+' '+(y-h-26)+' L'+(x+w)+' '+(y-h)+' Z" fill="'+c+'" opacity=".7"/>'; }
    return o; }
  function ship(cx,cy,sc,sail){ return '<g transform="translate('+cx+','+cy+') scale('+sc+')">'
      + '<path d="M-90 0 Q0 34 90 0 L70 26 Q0 46 -70 26 Z" fill="#3b2b1c"/>'
      + '<rect x="-4" y="-120" width="8" height="120" fill="#3b2b1c"/>'
      + '<path d="M4 -114 L86 -18 L4 -18 Z" fill="'+sail+'" opacity=".9"/>'
      + '<path d="M-4 -100 L-72 -22 L-4 -22 Z" fill="'+sail+'" opacity=".72"/></g>'; }
  function waves(y,c){ var o='',i;
    for(i=0;i<5;i++) o+='<path d="M0 '+(y+i*26)+' q 150 -18 300 0 t 300 0 t 300 0 t 300 0" stroke="'+c
      + '" stroke-width="4" fill="none" opacity="'+(0.4-i*0.06).toFixed(2)+'"/>';
    return o; }

  var SCENES=[
    /* 1 · ليل كنعان فوق المدينة */
    sky('#1b1030','#3a1f4f')+stars(46,7)+moon(980,150,54)+hills(560,'#2b2145','.9')+city(640,'#4a2a55'),
    /* 2 · سور أريحا وبرجها */
    sky('#241634','#5a3550')+stars(28,3)+moon(210,140,44)+hills(600,'#33223f','.85')
      +wall(140,470,780,190,'#b9a077')+'<rect x="820" y="360" width="150" height="300" fill="#d6c096"/>'
      +'<rect x="838" y="330" width="114" height="34" fill="#b9a077"/>',
    /* 3 · بستان الزيتون */
    sky('#1d1330','#4b2f46')+stars(22,11)+hills(580,'#2a2140','.9')
      +olive(230,700,1.25,'#12855a','#5a4326')+olive(560,720,1.0,'#0f6f4c','#5a4326')
      +olive(900,690,1.35,'#12855a','#5a4326'),
    /* 4 · لوح الأبجدية */
    sky('#191128','#40234a')+stars(34,5)+moon(1040,130,40)
      +tablet(600,430,1.35,'#d6c096','#3a2b18')+hills(700,'#2b2145','.9'),
    /* 5 · أصداف الأرجوان */
    sky('#1a1030','#5c2758')+stars(26,13)+waves(520,'#c96fb0')
      +shell(320,600,1.5,'#a8478f')+shell(640,650,1.2,'#7a2f68')+shell(930,590,1.7,'#c96fb0'),
    /* 6 · سفينة الأرجوان */
    sky('#161029','#3c2050')+stars(40,17)+moon(190,160,48)+waves(600,'#5b4a7a')
      +ship(680,600,1.35,'#a8478f'),
    /* 7 · جِرار الفخّار */
    sky('#1c1229','#4a2e3e')+stars(20,19)+hills(620,'#2e2340','.9')
      +jar(280,720,1.4,'#b9a077')+jar(560,740,1.1,'#d6c096')+jar(860,715,1.5,'#a68b5f'),
    /* 8 · وادي الأردن */
    sky('#151029','#37244d')+stars(50,23)+moon(1000,170,50)
      +hills(500,'#2a1f3d','.95')+city(600,'#3a2a4d')+hills(660,'#221a33','.92')
      +olive(160,760,1.0,'#0f5f42','#3b2b1c')+olive(1050,770,1.15,'#0f5f42','#3b2b1c')
      +waves(690,'#3f6f7a')
  ];

  var URIS = SCENES.map(function(inner){
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'
      + inner + '</svg>');
  });

  var MOT=['','m2','m3'], step=-1;
  window.setQuestionBG = function(n){
    var el=document.getElementById('kbg');
    if(!el) return;
    n = (typeof n==='number' && isFinite(n)) ? n : 0;
    if(n===step) return;
    step=n;
    var img=URIS[n % URIS.length], mo=MOT[n % MOT.length];
    el.classList.remove('on');
    setTimeout(function(){
      el.classList.remove('m2','m3');
      if(mo) el.classList.add(mo);
      el.style.backgroundImage='url("'+img+'")';
      el.classList.add('on');
    },170);
  };
  window.clearQuestionBG = function(){
    step=-1;
    var el=document.getElementById('kbg');
    if(el) el.classList.remove('on');
  };
})();
</script>

<script>
/* ======================================================================
   وصلة الترجمة — تربط kanaan-translations.js باللعبة
   بدونها يبقى القاموس محمّلاً في الذاكرة دون أن تستعمله اللعبة.
   ====================================================================== */
(function(){
  'use strict';

  function savedLang(){
    try { return localStorage.getItem('pv_lang') || 'ar'; } catch(e) { return 'ar'; }
  }

  /* ---------- (أ) الأسئلة الأربعة والثلاثون ---------- */
  function applyQuestions(lc){
    if (typeof QUESTIONS_I18N === 'undefined') return 0;
    if (!QUESTIONS_I18N[lc]) return 0;
    var out;
    if (typeof getTranslatedQuestions === 'function') {
      out = getTranslatedQuestions(lc);
    } else {
      out = QUESTIONS_I18N[lc].map(function(it, i){
        return { id:i+1, level: i<12 ? 1 : (i<24 ? 2 : 3),
                 q:it.q, options:it.o, correct:0, fact:it.f, hint:it.h };
      });
    }
    /* نحافظ على ترتيب ومعرّفات اللعبة الأصلية ونبدّل النصوص فقط */
    if (typeof QUESTIONS !== 'undefined' && QUESTIONS.length === out.length) {
      for (var i = 0; i < QUESTIONS.length; i++) {
        QUESTIONS[i].q       = out[i].q;
        QUESTIONS[i].options = out[i].options;
        QUESTIONS[i].fact    = out[i].fact;
        QUESTIONS[i].hint    = out[i].hint;
      }
      return QUESTIONS.length;
    }
    return 0;
  }

  /* ---------- (ب) نصوص الواجهة ---------- */
  function ui(lc){
    if (typeof UI_TRANSLATIONS === 'undefined') return {};
    return UI_TRANSLATIONS[lc] || UI_TRANSLATIONS.ar || {};
  }

  function applyUI(lc){
    var t = ui(lc), n = 0;
    if (!t.start) return 0;

    /* عناصر ثابتة موسومة */
    var marked = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < marked.length; i++) {
      var k = marked[i].getAttribute('data-i18n');
      if (t[k]) { marked[i].textContent = t[k]; n++; }
    }

    /* زر التلميح */
    var hb = document.getElementById('hintBtn');
    if (hb && t.hint) { hb.setAttribute('aria-label', t.hint.replace(':','')); n++; }

    return n;
  }

  /* نصوص تُبنى داخل الجافاسكربت — نتيحها للّعبة عبر دالة واحدة */
  window.KT = function(key){
    var t = ui(savedLang());
    return t[key] || key;
  };

  /* ---------- (ج) التطبيق عند التحميل ---------- */
  function boot(){
    var lc = savedLang();
    var q = applyQuestions(lc);
    var u = applyUI(lc);
    document.documentElement.setAttribute('data-pv-lang', lc);
    if (window.console && console.log) {
      console.log('🌐 الترجمة: لغة ' + lc + ' · أسئلة مترجمة: ' + q + ' · عناصر واجهة: ' + u);
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  /* لإعادة التطبيق يدوياً عند الحاجة */
  window.applyKanaanLang = function(lc){
    lc = lc || savedLang();
    applyQuestions(lc);
    applyUI(lc);
  };
})();
</script>
