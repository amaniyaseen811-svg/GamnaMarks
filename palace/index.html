<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | GamnaMarks</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  <meta id="palace-vp" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style id="palace-style">
html,body{margin:0;background:#120a24}
@media (pointer:coarse){html,body{height:100%;overflow:hidden}#unity-container{position:fixed!important;left:0!important;top:0!important;width:100%!important;height:100%!important;transform:none!important}#unity-canvas{width:100%!important;height:100%!important}#unity-footer,#unity-loading-bar{display:none!important}}
#palace-load{position:fixed;left:0;top:0;right:0;bottom:0;z-index:9999;background:radial-gradient(circle,#2e1858,#0b0618);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:Tahoma,Arial,sans-serif;direction:rtl;text-align:center;padding:20px;box-sizing:border-box}
#palace-load h1{font-size:28px;margin:0 0 8px;color:#ffd76a}
#palace-msg{margin:0 0 20px;opacity:.9;font-size:15px;line-height:1.7}
#palace-bar{width:80%;max-width:420px;height:14px;border-radius:8px;background:rgba(255,255,255,.15);overflow:hidden;direction:ltr}
#palace-fill{height:100%;width:0;background:linear-gradient(90deg,#ffd76a,#ff8ad8);transition:width .3s}
#palace-pct{margin-top:12px;font-size:22px;font-weight:bold}
#palace-err{margin-top:10px;font-size:12px;opacity:.6;direction:ltr}
#palace-rotate{display:none;position:fixed;left:0;top:0;right:0;bottom:0;z-index:9998;background:#120a24;color:#fff;font-family:Tahoma,Arial,sans-serif;direction:rtl;text-align:center;flex-direction:column;align-items:center;justify-content:center;padding:30px;box-sizing:border-box}
#palace-rotate b{font-size:70px;display:block;margin-bottom:16px;animation:palace-turn 2s infinite}
#palace-rotate div{font-size:22px;line-height:1.8;color:#ffd76a}
@keyframes palace-turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (pointer:coarse) and (orientation:portrait){#palace-rotate{display:flex}}
</style>
<script id="palace-join">
var palaceFiles = {dataUrl:['palace.data.unityweb.part1','palace.data.unityweb.part2','palace.data.unityweb.part3','palace.data.unityweb.part4','palace.data.unityweb.part5','palace.data.unityweb.part6','palace.data.unityweb.part7']};
function palaceShow() {
  if (document.getElementById('palace-load')) return;
  var d = document.createElement('div'); d.id = 'palace-load';
  d.innerHTML = '<h1>قصر المغذيات</h1><div id="palace-msg">جاري تحميل اللعبة...<br>أول مرة بتاخد شوية وقت، استنّي وما تسكّري الصفحة</div>' +
    '<div id="palace-bar"><div id="palace-fill"></div></div><div id="palace-pct">0%</div>';
  document.body.appendChild(d);
}
function palaceSet(p, msg) {
  palaceShow(); p = Math.max(0, Math.min(100, Math.round(p)));
  document.getElementById('palace-fill').style.width = p + '%';
  document.getElementById('palace-pct').textContent = p + '%';
  if (msg) document.getElementById('palace-msg').innerHTML = msg;
}
function palaceFail(e) {
  palaceSet(0, 'تعذّر تحميل اللعبة 😔<br>تأكدي من الإنترنت، وحدّثي الصفحة وجرّبي مرة ثانية<div id="palace-err"></div>');
  var x = document.getElementById('palace-err'); if (x && e) x.textContent = String(e && e.message ? e.message : e);
}
function palaceFit() {
  if (!window.matchMedia || !matchMedia('(pointer:coarse)').matches) return;
  var w = window.innerWidth + 'px', h = window.innerHeight + 'px';
  ['unity-container', 'unity-canvas'].forEach(function (id) {
    var el = document.getElementById(id); if (!el) return;
    el.style.setProperty('width', w, 'important'); el.style.setProperty('height', h, 'important');
  });
  window.scrollTo(0, 0);
}
window.addEventListener('resize', function () { palaceFit(); setTimeout(palaceFit, 300); });
window.addEventListener('orientationchange', function () { setTimeout(palaceFit, 300); });
function palaceRotateMsg() {
  if (document.getElementById('palace-rotate')) return;
  var r = document.createElement('div'); r.id = 'palace-rotate';
  r.innerHTML = '<b>📱</b><div>لفّي الموبايل بالعرض<br>عشان تلعبي</div>';
  document.body.appendChild(r);
}
function palaceStart(script, config) {
  palaceRotateMsg(); palaceFit();
  palaceSet(0);
  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
  var keys = Object.keys(palaceFiles), total = 0, done = 0;
  keys.forEach(function (k) { total += palaceFiles[k].length; });
  var base = total > 0 ? 90 : 0;
  var types = { codeUrl: 'application/wasm', frameworkUrl: 'application/javascript' };
  var chain = Promise.resolve();
  keys.forEach(function (k) {
    var bufs = [];
    palaceFiles[k].forEach(function (p) {
      chain = chain.then(function () {
        return fetch('Build/' + p).then(function (r) {
          if (!r.ok) throw new Error('missing ' + p);
          return r.arrayBuffer();
        }).then(function (b) { bufs.push(b); done++; palaceSet(base * done / total); });
      });
    });
    chain = chain.then(function () {
      var opt = types[k] ? { type: types[k] } : undefined;
      config[k] = URL.createObjectURL(new Blob(bufs, opt));
      bufs = null;
    });
  });
  chain.then(function () {
    if (total > 0) config.cacheControl = function (url) { return url.indexOf('blob:') === 0 ? 'no-store' : 'must-revalidate'; };
    palaceSet(base, 'خلص التحميل تقريبًا... عم نجهّز القصر ✨');
    var ol = script.onload;
    script.onload = function () {
      var orig = window.createUnityInstance;
      if (orig) window.createUnityInstance = function (c, cf, prog) {
        return orig(c, cf, function (p) { if (prog) prog(p); palaceSet(base + (100 - base) * p); })
          .then(function (u) { var d = document.getElementById('palace-load'); if (d) d.parentNode.removeChild(d); return u; },
                function (e) { palaceFail(e); throw e; });
      };
      if (ol) return ol.apply(this, arguments);
    };
    document.body.insertBefore(script, null);
  }).catch(function (e) { palaceFail(e); console.error(e); });
}
</script>
</head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">GamnaMarks</div>
      </div>
    </div>
    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/palace.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/palace.data.unityweb",
        frameworkUrl: buildUrl + "/palace.framework.js.unityweb",
        codeUrl: buildUrl + "/palace.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "DefaultCompany",
        productName: "GamnaMarks",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas container in a window that can be maximized to fullscreen:
        fullscreenContainer.style.width = "960px";
        fullscreenContainer.style.height = "600px";
      }


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => {
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      palaceStart(script, config);

    </script>
  </body>
</html>
