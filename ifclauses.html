<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>أكاديمية إلمورا — If Clauses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#080a11;
  --stone:#141a27;
  --stone-2:#1d2536;
  --parch:#f3e6c8;
  --parch-dim:#cbbb98;
  --gold:#d8a33f;
  --gold-soft:#f0cd82;
  --crimson:#8d2130;
  --spell:#8fd8ff;
  --curse:#57bd6a;
  --wrong:#c0392b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--parch);
  font-family:'Tajawal',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:0;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(216,163,63,.13), transparent 60%),
    radial-gradient(900px 500px at 50% 110%, rgba(141,33,48,.14), transparent 60%);
}

/* ---------- الإطار ---------- */
.frame{
  position:relative;z-index:1;
  width:100%;max-width:760px;min-height:100dvh;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0d1119,#0a0d14);
}

/* ---------- الشريط العلوي ---------- */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  background:rgba(10,13,20,.9);
  border-bottom:1px solid rgba(216,163,63,.25);
  position:sticky;top:0;z-index:20;backdrop-filter:blur(8px);
}
.icon-btn{
  background:rgba(216,163,63,.1);
  border:1px solid rgba(216,163,63,.35);
  color:var(--gold-soft);
  width:36px;height:36px;border-radius:9px;
  font-size:15px;cursor:pointer;display:grid;place-items:center;
  transition:.2s;
}
.icon-btn:hover{background:rgba(216,163,63,.22)}
.icon-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lives{display:flex;gap:4px;font-size:17px;letter-spacing:1px}
.life{filter:drop-shadow(0 0 5px rgba(141,33,48,.9))}
.life.lost{opacity:.2;filter:grayscale(1)}
.spacer{flex:1}
.trophy{
  font-family:'Cinzel',serif;font-size:13px;color:var(--gold-soft);
  border:1px solid rgba(216,163,63,.3);border-radius:20px;padding:5px 12px;
  background:rgba(216,163,63,.07);
}

/* ---------- المشهد ---------- */
.stage{flex:1;display:flex;flex-direction:column}
/* ---------- الإطار السحري ---------- */
.scene-wrap{
  position:relative;margin:12px 12px 0;padding:5px;
  border-radius:18px;overflow:hidden;
  background:#120f08;
  box-shadow:0 10px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(216,163,63,.35);
}
.scene-wrap .halo{
  position:absolute;top:50%;left:50%;width:190%;aspect-ratio:1;
  transform:translate(-50%,-50%);
  background:conic-gradient(#d8a33f,#f7e3ad,#8d2130,#8fd8ff,#d8a33f);
  animation:spin 9s linear infinite;opacity:.85;
}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

.scene-img{
  position:relative;width:100%;z-index:2;
  aspect-ratio:3/4;overflow:hidden;background:#0a0d14;
  border-radius:14px;
}
/* الخلفية: نسخة مكبّرة ومموّهة تملا الفراغ */
.scene-img .bg{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;filter:blur(22px) saturate(1.2) brightness(.55);
  transform:scale(1.25);
  animation:bgDrift 24s ease-in-out infinite alternate;
}
@keyframes bgDrift{
  0%{transform:scale(1.25) translate(-2%,-2%)}
  100%{transform:scale(1.35) translate(2%,2%)}
}

/* الصورة الأساسية: كاملة بدون أي قص */
.scene-img .fg{
  position:absolute;inset:0;width:100%;height:100%;z-index:1;
  object-fit:contain;
  filter:drop-shadow(0 6px 24px rgba(0,0,0,.65));
  animation:fadeIn 1s ease-out both, breathe 16s ease-in-out 1s infinite alternate;
}
@keyframes fadeIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:scale(1)}}
@keyframes breathe{
  0%{transform:scale(1)}
  100%{transform:scale(1.035)}
}

/* زوايا ذهبية */
.cnr{position:absolute;width:26px;height:26px;z-index:4;pointer-events:none;
  border:2px solid var(--gold-soft);opacity:.9;
  filter:drop-shadow(0 0 5px rgba(216,163,63,.8));}
.cnr.tl{top:8px;left:8px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.cnr.tr{top:8px;right:8px;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.cnr.bl{bottom:8px;left:8px;border-right:0;border-top:0;border-radius:0 0 0 8px}
.cnr.br{bottom:8px;right:8px;border-left:0;border-top:0;border-radius:0 0 8px 0}

/* وهج سحري يمر فوق المشهد */
.scene-img .glow{
  position:absolute;inset:-30%;pointer-events:none;z-index:2;
  background:radial-gradient(circle at 50% 50%, rgba(216,163,63,.18), transparent 55%);
  animation:sweep 13s ease-in-out infinite alternate;
}
@keyframes sweep{
  0%{transform:translate(-22%,-14%)}
  100%{transform:translate(22%,14%)}
}

/* الشرارات الطايرة */
.sparks{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:3}
.sparks i{
  position:absolute;bottom:-14px;display:block;border-radius:50%;
  background:#ffe9b0;
  box-shadow:0 0 8px 2px rgba(255,214,120,.85);
  animation:rise linear infinite;
}
@keyframes rise{
  0%{transform:translateY(0) translateX(0) scale(.5);opacity:0}
  12%{opacity:1}
  70%{opacity:.9}
  100%{transform:translateY(-115%) translateX(var(--dx)) scale(1.1);opacity:0}
}

/* ---------- لوح الرقّ ---------- */
.panel{
  flex:1;padding:18px 16px 30px;
  display:flex;flex-direction:column;gap:14px;
  animation:riseUp .5s ease-out both;
}
@keyframes riseUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.narr{
  font-size:16.5px;line-height:1.85;color:var(--parch);
  background:rgba(243,230,200,.05);
  border-inline-start:3px solid var(--gold);
  border-radius:0 10px 10px 0;padding:13px 15px;
}
.narr strong{color:var(--gold-soft)}

.quest{
  font-family:'Cinzel',serif;direction:ltr;text-align:left;
  font-size:19px;line-height:1.7;color:#fff;
  background:linear-gradient(180deg,rgba(216,163,63,.14),rgba(216,163,63,.05));
  border:1px solid rgba(216,163,63,.4);border-radius:12px;
  padding:16px 18px;
}
.quest .blank{color:var(--gold);letter-spacing:2px}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;align-items:center;gap:12px;
  background:var(--stone);border:1px solid rgba(216,163,63,.22);
  border-radius:11px;padding:13px 15px;
  font-family:'Cinzel',serif;font-size:17px;color:var(--parch);
  cursor:pointer;transition:.18s;text-align:left;direction:ltr;width:100%;
}
.opt .tag{
  font-size:12px;width:24px;height:24px;flex:none;border-radius:6px;
  display:grid;place-items:center;
  background:rgba(216,163,63,.16);color:var(--gold-soft);
}
.opt:hover:not(:disabled){background:var(--stone-2);border-color:var(--gold);transform:translateX(-3px)}
.opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.opt:disabled{cursor:default}
.opt.good{background:rgba(87,189,106,.16);border-color:var(--curse);color:#dcffe4}
.opt.bad{background:rgba(192,57,43,.16);border-color:var(--wrong);color:#ffdcd8}
.opt.ar{font-family:'Tajawal',sans-serif;direction:rtl;text-align:right;font-size:16px}
.opt.ar:hover:not(:disabled){transform:translateX(3px)}

/* أقفال */
.opt.lock-gold{border-color:rgba(216,163,63,.6)}
.opt.lock-silver{border-color:rgba(190,200,215,.55)}
.opt.lock-pink{border-color:rgba(226,160,170,.55)}

.hint{
  font-size:14px;line-height:1.8;color:var(--parch-dim);
  background:rgba(143,216,255,.07);border:1px dashed rgba(143,216,255,.3);
  border-radius:10px;padding:11px 13px;
}
.hint b{color:var(--spell)}

.cta{
  font-family:'Tajawal',sans-serif;font-weight:700;font-size:17px;
  background:linear-gradient(180deg,var(--gold),#b5822c);
  color:#1a1206;border:none;border-radius:11px;padding:14px;
  cursor:pointer;width:100%;transition:.2s;
  box-shadow:0 5px 20px rgba(216,163,63,.28);
}
.cta:hover{filter:brightness(1.09);transform:translateY(-1px)}
.cta:focus-visible{outline:2px solid #fff;outline-offset:2px}
.cta.ghost{
  background:transparent;color:var(--gold-soft);
  border:1px solid rgba(216,163,63,.5);box-shadow:none;margin-top:10px;
}
.cta.ghost:hover{background:rgba(216,163,63,.12)}
.cta.dark{background:linear-gradient(180deg,var(--crimson),#5e131f);color:#ffe9ec;box-shadow:0 5px 20px rgba(141,33,48,.3)}

/* ---------- الغلاف ---------- */
.cover{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-height:100dvh}
.cover-bg{position:absolute;inset:0}
.cover-bg video{width:100%;height:100%;object-fit:cover}
.cover-bg img{width:100%;height:100%;object-fit:cover;animation:kenburns 26s ease-in-out infinite alternate}
.cover-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,17,.55),rgba(8,10,17,.78) 45%,rgba(8,10,17,.97))}
.cover-in{position:relative;z-index:2;padding:26px 20px 40px;text-align:center}
.kicker{font-family:'Cinzel',serif;font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px}
.title{font-family:'Amiri',serif;font-weight:700;font-size:clamp(30px,8vw,46px);line-height:1.25;color:#fff;text-shadow:0 0 26px rgba(216,163,63,.45)}
.title span{color:var(--gold-soft);display:block;font-family:'Cinzel',serif;font-size:.48em;letter-spacing:5px;margin-top:8px}
.sub{font-size:15.5px;color:var(--parch-dim);margin:14px auto 22px;max-width:430px;line-height:1.9}

/* ---------- شاشة الفيديو ---------- */
.vidscreen{position:relative;flex:1;min-height:100dvh;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.vidscreen video{width:100%;max-height:100dvh;object-fit:contain;background:#000}
.vidbar{position:absolute;bottom:0;left:0;right:0;padding:16px;z-index:5;
  display:flex;gap:10px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.vidbar .cta{flex:1}

/* ---------- بطاقة القاعدة ---------- */
.rule{
  background:var(--stone);border:1px solid rgba(216,163,63,.28);
  border-radius:13px;padding:15px;
}
.rule h3{
  font-family:'Cinzel',serif;font-size:16px;color:var(--gold);
  display:flex;align-items:center;gap:9px;margin-bottom:9px;direction:ltr;
}
.rule h3 em{
  font-style:normal;font-family:'Tajawal';font-size:12.5px;
  color:var(--parch-dim);font-weight:500;
}
.rule .form{
  direction:ltr;text-align:left;font-family:'Cinzel',serif;font-size:14.5px;
  background:rgba(8,10,17,.55);border-radius:8px;padding:9px 11px;color:var(--gold-soft);margin-bottom:8px;
}
.rule .ex{direction:ltr;text-align:left;font-family:'Cinzel',serif;font-size:14.5px;color:#fff;opacity:.92}
.rule p{font-size:14px;color:var(--parch-dim);line-height:1.8;margin-bottom:8px}

/* ---------- أنماط اللعب ---------- */
.mode{
  display:flex;align-items:center;gap:14px;width:100%;text-align:right;
  background:var(--stone);border:1px solid rgba(216,163,63,.28);
  border-radius:14px;padding:15px;color:var(--parch);cursor:pointer;
  font-family:'Tajawal',sans-serif;transition:.2s;margin-bottom:10px;
}
.mode:hover{background:var(--stone-2);border-color:var(--gold);transform:translateX(3px)}
.mode .mi{width:44px;height:44px;flex:none;border-radius:12px;display:grid;
  place-items:center;font-size:22px;background:rgba(216,163,63,.15)}
.mode .mt{font-weight:700;font-size:16px}
.mode .md{font-size:13px;color:var(--parch-dim);margin-top:2px}

.field{
  width:100%;background:var(--stone);border:1px solid rgba(216,163,63,.35);
  border-radius:11px;padding:14px;color:var(--parch);font-family:'Tajawal',sans-serif;
  font-size:16px;text-align:center;margin-bottom:10px;
}
.field:focus{outline:2px solid var(--gold);outline-offset:1px}

.lbrow{
  display:flex;align-items:center;gap:11px;padding:11px 13px;
  border-bottom:1px solid rgba(216,163,63,.14);font-size:14.5px;
}
.lbrow .rk{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-family:'Cinzel',serif;font-size:13px;background:rgba(216,163,63,.16);color:var(--gold-soft)}
.lbrow .rk.g1{background:var(--gold);color:#1a1206}
.lbrow .rk.g2{background:#c8ccd4;color:#1a1206}
.lbrow .rk.g3{background:#c98a52;color:#1a1206}
.lbrow .nm{flex:1;font-weight:500}
.lbrow .sc{font-family:'Cinzel',serif;color:var(--gold-soft);font-size:15px}
.lbrow .dt{font-size:11px;color:var(--parch-dim)}
.lbbox{background:var(--stone);border:1px solid rgba(216,163,63,.22);
  border-radius:13px;overflow:hidden;max-height:56vh;overflow-y:auto}
.lbempty{padding:26px;text-align:center;color:var(--parch-dim);font-size:14px}

/* ---------- صناديق المارد ---------- */
.gifts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gift{
  background:linear-gradient(180deg,rgba(143,216,255,.14),rgba(20,26,38,.9));
  border:1px solid rgba(143,216,255,.4);border-radius:13px;
  padding:20px 10px;font-size:30px;cursor:pointer;transition:.2s;
  display:grid;place-items:center;
}
.gift:hover{transform:translateY(-3px);border-color:var(--spell);
  box-shadow:0 6px 20px rgba(143,216,255,.28)}
.gift:disabled{opacity:.35;cursor:default;transform:none}
.giftout{
  font-size:16px;line-height:1.9;text-align:center;color:#dff3ff;
  background:rgba(143,216,255,.12);border:1px solid rgba(143,216,255,.45);
  border-radius:12px;padding:15px;
}

/* ---------- الجوائز ---------- */
.prize{display:grid;place-items:center;padding:8px 0 4px}
.prize svg{width:min(58vw,230px);height:auto;
  filter:drop-shadow(0 0 26px rgba(216,163,63,.65));
  animation:float 3.4s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0) rotate(-1.5deg)}to{transform:translateY(-12px) rotate(1.5deg)}}
.prize.gem svg{filter:drop-shadow(0 0 30px rgba(143,216,255,.75))}

.wsheet{display:flex;flex-direction:column;gap:11px}
.wsbtn{
  display:flex;align-items:center;gap:13px;text-align:right;
  background:var(--stone);border:1px solid rgba(216,163,63,.3);
  border-radius:13px;padding:15px;color:var(--parch);cursor:pointer;
  font-family:'Tajawal',sans-serif;font-size:16px;transition:.2s;width:100%;
}
.wsbtn:hover{background:var(--stone-2);border-color:var(--gold);transform:translateX(3px)}
.wsbtn .n{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;
  font-family:'Cinzel',serif;font-size:17px;background:rgba(216,163,63,.18);color:var(--gold-soft)}
.wsbtn small{display:block;color:var(--parch-dim);font-size:13px;margin-top:2px}
.wsbtn.hard .n{background:rgba(141,33,48,.28);color:#ffc2cb}

.ws-body{direction:ltr;text-align:left;line-height:1.95;font-size:15px}
.ws-body .ws-h{display:block;direction:rtl;text-align:right;color:var(--gold-soft);margin:12px 0 4px}
.ws-body .ws-h:first-child{margin-top:0}
.ws-ans{border-color:rgba(87,189,106,.5)}

/* ---------- النهاية ---------- */
.end{text-align:center;padding:10px 0}
.end .big{font-family:'Amiri',serif;font-size:30px;color:var(--gold-soft);margin-bottom:10px}
.end .score{font-family:'Cinzel',serif;font-size:15px;color:var(--parch-dim);margin-bottom:6px}

.flash{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0}
.flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:0}30%{opacity:.85}100%{opacity:0}}
.flash.win{background:radial-gradient(circle at 50% 50%,rgba(143,216,255,.9),transparent 65%)}
.flash.lose{background:radial-gradient(circle at 50% 50%,rgba(192,57,43,.85),transparent 65%)}

.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media(min-width:761px){
  body{padding:0}
  .scene-img{aspect-ratio:4/3}
  .frame{min-height:100dvh;border-inline:1px solid rgba(216,163,63,.15)}
}
</style>
</head>

  /* ============ قائمة الكلمات الممنوعة الأوّلية ============
     المعلمة تقدر تزيد/تشيل من لوحة التحكم بدون رفع الملف من جديد.
     الكلمات القصيرة (٣ أحرف أو أقل) تُطابَق ككلمة كاملة فقط،
     عشان ما تمنع كلمات بريئة مثل "كسر" أو "مكسور".            */
  var BASE_WORDS = [
    'كلب', 'حمار', 'غبي', 'احمق', 'تافه', 'حقير', 'وسخ', 'خنزير',
    'زباله', 'قذر', 'سافل', 'متخلف', 'بهيمه', 'لعنه', 'يلعن',
    'كس', 'طيز', 'خرا', 'عرص', 'شرموط', 'منيوك', 'زق', 'زبي',
    'fuck', 'shit', 'bitch', 'idiot', 'stupid', 'ugly', 'dumb'
  ];

  /* ============ أدوات ============ */
  function lang() {
    var c = 'ar';
    try { c = localStorage.getItem('pv_lang') || 'ar'; } catch (e) { }
    return T[c] ? c : 'ar';
  }
  function t() {
    var o = T[lang()] || T.ar;
    /* مفاتيح الكتابة الحرة قد تكون غير مترجمة في كل اللغات */
    var k = ['freeOn','freeOff','write','sendBtn','tooLong','badWord','noNum'];
    for (var i = 0; i < k.length; i++) if (!o[k[i]]) o[k[i]] = T.en[k[i]];
    return o;
  }
  function isRTL() { var c = lang(); return c === 'ar' || c === 'he' || c === 'fa'; }

  /* تطبيع النص العربي: تشكيل، مدّ، ألف/همزة، ة/ه، ى/ي، أرقام بدل حروف */
  function norm(s) {
    if (!s) return '';
    s = String(s).toLowerCase();
    s = s.replace(/[\u064B-\u065F\u0670\u0640]/g, '');      // تشكيل + المدّ ـ
    s = s.replace(/[أإآا]/g, 'ا').replace(/ة/g, 'ه')
      .replace(/[ىي]/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي');
    s = s.replace(/3/g, 'ع').replace(/7/g, 'ح').replace(/5/g, 'خ')
      .replace(/9/g, 'ص').replace(/8/g, 'ق').replace(/2/g, 'ا').replace(/6/g, 'ط');
    s = s.replace(/[^\p{L}\p{N}]+/gu, ' ').replace(/\s+/g, ' ').trim();
    return s;
  }

  var wordList = BASE_WORDS.slice();

  function isBad(text) {
    var n = norm(text);
    if (!n) return false;
    var tokens = n.split(' ');
    for (var i = 0; i < wordList.length; i++) {
      var w = norm(wordList[i]);
      if (!w) continue;
      if (w.length <= 3) {                       // كلمة قصيرة → مطابقة تامة
        if (tokens.indexOf(w) !== -1) return true;
      } else {                                    // كلمة طويلة → تضمين
        if (n.indexOf(w) !== -1) return true;
      }
    }
    return false;
  }

    fbPromise = (async function () {

        var a = await import(SDK + 'firebase-app.js');
        var f = await import(SDK + 'firebase-firestore.js');
        var app;
        try { app = a.getApp('pvchat'); }
        catch (e) { app = a.initializeApp(FB_CONFIG, 'pvchat'); }
        FB = Object.assign({ db: f.getFirestore(app) }, f);
        return FB;
      } catch (e) { console.warn('[PVChat] Firebase off', e); return null; }
    })();
    return fbPromise;
  }

.pvc-write input{flex:1;padding:10px;border-radius:12px;font:inherit;font-size:14px;
  border:1px solid var(--line,rgba(255,255,255,.2));background:rgba(0,0,0,.28);color:inherit;
  text-align:inherit}
.pvc-write button{padding:10px 14px;border-radius:12px;border:0;cursor:pointer;font:inherit;
  font-weight:800;background:var(--gold,#e0b73c);color:#20180a}
.pvc-code{text-align:center;font-size:30px;font-weight:900;letter-spacing:5px;
  color:var(--gold,#e0b73c);padding:10px 0}
`;

  var fab, badge, panel, headTitle, bodyEl, footEl, tabsEl, toastEl;
  var tab = 'msgs';

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  function toast(msg) {
    if (!toastEl) { toastEl = el('div', 'pvc-toast'); document.body.appendChild(toastEl); }
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function () { toastEl.classList.remove('on'); }, 2200);
  }

  function buildUI() {
    var st = el('style'); st.textContent = CSS; document.head.appendChild(st);

    fab = el('button', 'pvc-fab', '💬');
    badge = el('span', 'pvc-badge', '0');
    fab.appendChild(badge);
    fab.onclick = togglePanel;
    document.body.appendChild(fab);

    panel = el('div', 'pvc-panel');
    panel.dir = isRTL() ? 'rtl' : 'ltr';

    var head = el('div', 'pvc-head');
    headTitle = el('b', null, t().chat);
    var x = el('button', 'pvc-x', '✕'); x.onclick = togglePanel;
    head.appendChild(headTitle); head.appendChild(x);

    tabsEl = el('div', 'pvc-tabs');
    bodyEl = el('div', 'pvc-body');
    footEl = el('div', 'pvc-foot');

    panel.appendChild(head); panel.appendChild(tabsEl);
    panel.appendChild(bodyEl); panel.appendChild(footEl);
    document.body.appendChild(panel);

    renderTabs();
    renderFoot();
    renderBody();
  }

  function renderTabs() {
    tabsEl.innerHTML = '';
    var list = [['msgs', t().msgs], ['emoji', t().emoji]];
    if (S.role === 'teacher') list.push(['teacher', t().teacher]);
    list.forEach(function (p) {
      var b = el('button', 'pvc-tab' + (tab === p[0] ? ' on' : ''), p[1]);
      b.onclick = function () { tab = p[0]; renderTabs(); renderBody(); renderFoot(); };
      tabsEl.appendChild(b);
    });
  }

  function togglePanel() {
    S.panelOpen = !S.panelOpen;
    panel.classList.toggle('on', S.panelOpen);
    if (S.panelOpen) { S.unread = 0; updateBadge(); renderBody(); }
  }

  function updateBadge() {
    badge.style.display = S.unread > 0 ? 'flex' : 'none';
    badge.textContent = S.unread > 9 ? '9+' : String(S.unread);
  }

  /* ---------- عرض الرسائل ---------- */
  function msgText(m) {
    var L = T[lang()];
    if (typeof m.x === 'string') return m.x;
    if (m.p === -1) return '✋ ' + (L.hand.replace(' ✋', ''));
    if (typeof m.e === 'number') return EMOJI[m.e] || '•';
    var arr = (m.r === 't') ? L.tph : L.ph;
    return arr[m.p] != null ? arr[m.p] : '…';
  }

  function renderBody() {
    if (tab === 'teacher') return renderTeacher();
    bodyEl.innerHTML = '';
    var list = S.msgs.filter(function (m) { return typeof m.e !== 'number'; });
    if (!list.length) { bodyEl.appendChild(el('div', 'pvc-empty', '—')); return; }
    list.forEach(function (m) {
      var cls = 'pvc-msg' + (m.r === 't' ? ' t' : '') + (m.p === -1 ? ' hand' : '');
      var who = m.r === 't' ? t().teacherTag : esc(m.n);
      bodyEl.appendChild(el('div', cls, '<span class="who">' + who + ':</span> ' + esc(msgText(m))));
    });
    bodyEl.scrollTop = bodyEl.scrollHeight;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  /* ---------- أسفل اللوحة ---------- */
  function renderFoot() {
    footEl.innerHTML = '';
    if (tab === 'teacher') return;

    if (!S.open && S.role !== 'teacher') {
      footEl.appendChild(el('div', 'pvc-note', t().isClosed)); return;
    }
    if (S.muted.indexOf(S.name) !== -1 && S.role !== 'teacher') {
      footEl.appendChild(el('div', 'pvc-note', t().isMuted)); return;
    }

    if (tab === 'emoji') {
      var grid = el('div', 'pvc-emo');
      EMOJI.forEach(function (e, i) {
        var b = el('button', null, e);
        b.onclick = function () { send({ e: i }); };
        grid.appendChild(b);
      });
      footEl.appendChild(grid);
      return;
    }

    var chips = el('div', 'pvc-chips');
    var arr = (S.role === 'teacher') ? t().tph : t().ph;
    arr.forEach(function (txt, i) {
      var b = el('button', 'pvc-chip', txt);
      b.onclick = function () { send({ p: i }); };
      chips.appendChild(b);
    });
    footEl.appendChild(chips);

    if (S.role !== 'teacher') {
      var h = el('button', 'pvc-hand', t().hand);
      h.onclick = function () { send({ p: -1 }); };
      footEl.appendChild(h);
    }

    /* الكتابة الحرة — تظهر فقط إذا فتحتها المعلمة */
    if (S.free) {
      var wrap = el('div', 'pvc-write');
      var inp = el('input');
      inp.placeholder = t().write; inp.maxLength = 120;
      var bs = el('button', null, t().sendBtn);
      function doSend() {
        var v = inp.value.trim();
        if (!v) return;
        if (v.length > 120) { toast(t().tooLong); return; }
        if (isBad(v)) { toast(t().badWord); return; }
        if (/\d[\s.\-]?\d[\s.\-]?\d[\s.\-]?\d[\s.\-]?\d[\s.\-]?\d/.test(v)) { toast(t().noNum); return; }
        inp.value = '';
        send({ x: v });
      }
      bs.onclick = doSend;
      inp.onkeydown = function (e) { if (e.key === 'Enter') doSend(); };
      wrap.appendChild(inp); wrap.appendChild(bs);
      footEl.appendChild(wrap);
    }
  }

  /* ---------- لوحة المعلمة ---------- */
  function renderTeacher() {
    bodyEl.innerHTML = '';
    footEl.innerHTML = '';

    var tools = el('div', 'pvc-tools');
    var bClose = el('button', null, S.open ? t().closeChat : t().openChat);
    bClose.onclick = function () { setRoom({ open: !S.open }); };
    var bClear = el('button', null, t().clear);
    bClear.onclick = function () { if (confirm(t().confirmClear)) clearMsgs(); };
    var bFree = el('button', null, S.free ? '✏️ ' + t().freeOn : '🔒 ' + t().freeOff);
    if (S.free) { bFree.style.background = 'var(--teal,#2ec6b6)'; bFree.style.color = '#04231f'; }
    bFree.onclick = function () { setRoom({ free: !S.free }); };
    tools.appendChild(bClose); tools.appendChild(bClear); tools.appendChild(bFree);
    bodyEl.appendChild(tools);

    /* أيادٍ مرفوعة */
    bodyEl.appendChild(el('div', 'pvc-h3', t().hands));
    var hands = [];
    S.msgs.forEach(function (m) { if (m.p === -1 && hands.indexOf(m.n) === -1) hands.push(m.n); });
    if (!hands.length) bodyEl.appendChild(el('div', 'pvc-note', t().none));
    else {
      var hl = el('div', 'pvc-list');
      hands.forEach(function (n) { hl.appendChild(el('div', 'pvc-row', '<span>✋ ' + esc(n) + '</span>')); });
      bodyEl.appendChild(hl);
    }

    /* الطلاب + الكتم */
    var names = [];
    S.msgs.forEach(function (m) {
      if (m.r !== 't' && m.n && names.indexOf(m.n) === -1) names.push(m.n);
    });
    S.muted.forEach(function (n) { if (names.indexOf(n) === -1) names.push(n); });
    if (names.length) {
      bodyEl.appendChild(el('div', 'pvc-h3', '👥'));
      var ul = el('div', 'pvc-list');
      names.forEach(function (n) {
        var row = el('div', 'pvc-row', '<span>' + esc(n) + '</span>');
        var isM = S.muted.indexOf(n) !== -1;
        var b = el('button', null, isM ? t().unmute : t().mute);
        b.onclick = function () {
          var m = S.muted.slice();
          if (isM) m = m.filter(function (x) { return x !== n; }); else m.push(n);
          setRoom({ muted: m });
        };
        row.appendChild(b); ul.appendChild(row);
      });
      bodyEl.appendChild(ul);
    }

    /* الكلمات الممنوعة */
    bodyEl.appendChild(el('div', 'pvc-h3', t().filter));
    var inp = el('input', 'pvc-in'); inp.placeholder = t().addWord;
    var save = el('button', 'pvc-hand', t().save);
    save.style.background = 'var(--gold,#e0b73c)'; save.style.color = '#20180a';
    save.onclick = function () {
      var v = inp.value.trim(); if (!v) return;
      if (wordList.indexOf(v) === -1) wordList.push(v);
      inp.value = ''; saveWords(); renderTeacher();
    };
    bodyEl.appendChild(inp); bodyEl.appendChild(save);

    var wl = el('div', 'pvc-list'); wl.style.marginTop = '8px';
    wordList.forEach(function (w) {
      var row = el('div', 'pvc-row', '<span>' + esc(w) + '</span>');
      var b = el('button', null, '✕');
      b.onclick = function () {
        wordList = wordList.filter(function (x) { return x !== w; });
        saveWords(); renderTeacher();
      };
      row.appendChild(b); wl.appendChild(row);
    });
    bodyEl.appendChild(wl);
  }

  /* ============ الإيموجي الطائرة ============ */
  function fly(i) {
    var e = el('div', 'pvc-fly', EMOJI[i] || '✨');
    e.style.insetInlineStart = (10 + Math.random() * 70) + '%';
    e.style.bottom = '90px';
    document.body.appendChild(e);
    setTimeout(function () { e.remove(); }, 2200);
  }

  /* ============ فايربيس: قراءة/كتابة ============ */
  function roomRef(f) { return f.doc(f.db, 'pv_rooms', S.room); }
  function msgsRef(f) { return f.collection(f.db, 'pv_rooms', S.room, 'msgs'); }

  async function send(payload) {
    if (!S.room || !S.name) return;
    if (!S.open && S.role !== 'teacher') { toast(t().isClosed); return; }
    if (S.muted.indexOf(S.name) !== -1 && S.role !== 'teacher') { toast(t().isMuted); return; }
    var now = Date.now();
    if (now - S.lastSend < 1500) { toast(t().slow); return; }
    S.lastSend = now;

    if (typeof payload.e === 'number') fly(payload.e);   // عرض فوري عند المُرسِل

    var f = await initFB(); if (!f) return;
    var doc = {
      n: String(S.name).slice(0, 24),
      r: S.role === 'teacher' ? 't' : 's',
      ts: now
    };
    if (typeof payload.x === 'string') doc.x = payload.x.slice(0, 120);
    else if (typeof payload.e === 'number') doc.e = payload.e;
    else doc.p = payload.p;
    try { await f.addDoc(msgsRef(f), doc); } catch (e) { console.warn('[PVChat] send', e); }
  }

  async function setRoom(patch) {
    var f = await initFB(); if (!f) return;
    try {
      await f.setDoc(roomRef(f), Object.assign({ open: S.open, free: S.free, muted: S.muted }, patch), { merge: true });
    } catch (e) { console.warn('[PVChat] room', e); }
  }

  async function clearMsgs() {
    var f = await initFB(); if (!f) return;
    try {
      var snap = await f.getDocs(msgsRef(f));
      var jobs = []; snap.forEach(function (d) { jobs.push(f.deleteDoc(d.ref)); });
      await Promise.all(jobs);
      toast(t().cleared);
    } catch (e) { console.warn('[PVChat] clear', e); }
  }

  async function loadWords() {
    var f = await initFB(); if (!f) return;
    try {
      var d = await f.getDoc(f.doc(f.db, 'pv_config', 'filter'));
      if (d.exists() && Array.isArray(d.data().list)) {
        var extra = d.data().list;
        wordList = BASE_WORDS.concat(extra.filter(function (w) {
          return BASE_WORDS.indexOf(w) === -1;
        }));
      }
    } catch (e) { }
  }

  async function saveWords() {
    var f = await initFB(); if (!f) return;
    try {
      await f.setDoc(f.doc(f.db, 'pv_config', 'filter'), { list: wordList }, { merge: true });
      toast(t().saved);
    } catch (e) { console.warn('[PVChat] words', e); }
  }

  /* ============ التشغيل ============ */
  async function start() {
    if (S.started) return;
    S.started = true;
    var f = await initFB(); if (!f) return;

    await loadWords();

    /* حالة الغرفة */
    S.unsubRoom = f.onSnapshot(roomRef(f), function (d) {
      var v = d.exists() ? d.data() : {};
      S.open = v.open !== false;
      S.free = v.free === true;          /* الافتراضي: مغلقة */
      S.muted = Array.isArray(v.muted) ? v.muted : [];
      renderFoot();
      if (tab === 'teacher') renderTeacher();
    }, function () { });

    /* المعلمة تنشئ مستند الغرفة أول مرة */
    if (S.role === 'teacher') setRoom({ open: true, free: S.free === true });

    /* الرسائل */
    var q = f.query(msgsRef(f), f.orderBy('ts', 'desc'), f.limit(40));
    var first = true;
    S.unsubMsgs = f.onSnapshot(q, function (snap) {
      var arr = []; snap.forEach(function (d) { arr.push(d.data()); });
      arr.reverse();

      if (!first) {
        snap.docChanges().forEach(function (ch) {
          if (ch.type !== 'added') return;
          var m = ch.doc.data();
          if (m.n === S.name) return;                       // لا نكرر رسائلنا
          if (typeof m.e === 'number') fly(m.e);
          else if (!S.panelOpen) { S.unread++; updateBadge(); }
        });
      }
      first = false;
      S.msgs = arr;
      if (S.panelOpen) renderBody();
      if (tab === 'teacher') renderTeacher();
    }, function () { });

    fab.style.display = 'flex';
  }

  function stop() {
    if (S.unsubMsgs) { S.unsubMsgs(); S.unsubMsgs = null; }
    if (S.unsubRoom) { S.unsubRoom(); S.unsubRoom = null; }
    S.started = false; S.msgs = []; S.unread = 0;
    if (fab) { fab.style.display = 'none'; updateBadge(); }
    if (panel) { panel.classList.remove('on'); S.panelOpen = false; }
  }


  /* ============ طبقة الغرفة المستقلة (تعمل بأي لعبة) ============ */
  var launchBtn = null, dlg = null;
  var LS_ROOM = 'pv_room', LS_NAME = 'pv_name', LS_ROLE = 'pv_role';

  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { } }

  /* يحاول التقاط اسم اللاعب من اللعبة نفسها إن وُجد */
  function guessName() {
    var c = ['playerName', 'elmName', 'pvName', 'userName'];
    for (var i = 0; i < c.length; i++) {
      try { if (typeof window[c[i]] === 'string' && window[c[i]].length > 1) return window[c[i]]; } catch (e) { }
    }
    try { if (window.G && typeof G.name === 'string' && G.name.length > 1) return G.name; } catch (e) { }
    return lsGet(LS_NAME);
  }

  function buildLauncher() {
    if (launchBtn) return;
    if (!document.body) return;
    launchBtn = el('button', 'pvc-launch', '🏫');
    launchBtn.title = 'غرفة الصف';
    launchBtn.onclick = openDialog;
    document.body.appendChild(launchBtn);

    dlg = el('div', 'pvc-dlg');
    dlg.onclick = function (e) { if (e.target === dlg) closeDialog(); };
    document.body.appendChild(dlg);
  }

  function closeDialog() { if (dlg) dlg.classList.remove('on'); }

  function openDialog() {
    if (!dlg) return;
    dlg.dir = isRTL() ? 'rtl' : 'ltr';
    var box = el('div', 'pvc-box');

    /* لو الغرفة شغّالة: عرض الحالة + زر خروج */
    if (S.room && S.name) {
      box.appendChild(el('h4', null, '🏫 غرفة الصف'));
      box.appendChild(el('div', 'pvc-code', esc(S.room)));
      box.appendChild(el('p', null,
        (S.role === 'teacher' ? '👩‍🏫 أنتِ المعلمة' : '👤 ' + esc(S.name)) +
        ' — الطلاب بيدخلوا بهذا الكود'));
      var bOut = el('button', 'pvc-b gh', 'خروج من الغرفة');
      bOut.onclick = function () {
        lsDel(LS_ROOM); lsDel(LS_ROLE);
        stop(); S.room = ''; S.role = 'student';
        closeDialog();
      };
      var bC = el('button', 'pvc-b', 'إغلاق');
      bC.onclick = closeDialog;
      box.appendChild(bOut); box.appendChild(bC);
      dlg.innerHTML = ''; dlg.appendChild(box); dlg.classList.add('on');
      return;
    }

    box.appendChild(el('h4', null, '🏫 غرفة الصف'));
    box.appendChild(el('p', null, 'اكتبي اسمك، بعدها أنشئي غرفة (للمعلمة) أو انضمي بكود (للطالبة).'));

    var nIn = el('input', 'pvc-in'); nIn.placeholder = 'الاسم'; nIn.maxLength = 24;
    nIn.value = guessName();
    box.appendChild(nIn);

    function name() {
      var v = nIn.value.trim();
      if (v.length < 2) { toast('اكتبي اسمك'); return null; }
      if (isBad(v)) { toast(t().badName); return null; }
      return v;
    }

    var bHost = el('button', 'pvc-b', '👩‍🏫 إنشاء غرفة (للمعلمة)');
    bHost.onclick = function () {
      var v = name(); if (!v) return;
      var code = String(Math.floor(100000 + Math.random() * 900000));
      lsSet(LS_NAME, v); lsSet(LS_ROOM, code); lsSet(LS_ROLE, 'teacher');
      begin(code, v, 'teacher'); closeDialog(); openDialog();
    };

    var cIn = el('input', 'pvc-in');
    cIn.placeholder = 'كود الغرفة (٦ أرقام)'; cIn.inputMode = 'numeric'; cIn.maxLength = 6;

    var bJoin = el('button', 'pvc-b alt', '👤 انضمام (للطالبة)');
    bJoin.onclick = function () {
      var v = name(); if (!v) return;
      var c = cIn.value.trim();
      if (!/^\d{6}$/.test(c)) { toast('اكتبي كود من ٦ أرقام'); return; }
      lsSet(LS_NAME, v); lsSet(LS_ROOM, c); lsSet(LS_ROLE, 'student');
      begin(c, v, 'student'); closeDialog();
    };

    var bX = el('button', 'pvc-b gh', 'إلغاء');
    bX.onclick = closeDialog;

    box.appendChild(bHost);
    box.appendChild(cIn);
    box.appendChild(bJoin);
    box.appendChild(bX);

    dlg.innerHTML = ''; dlg.appendChild(box); dlg.classList.add('on');
    setTimeout(function () { if (!nIn.value) nIn.focus(); }, 60);
  }

  function begin(room, name, role) {
    if (!fab) buildUI();
    stop();
    S.room = room; S.name = name; S.role = role || 'student';
    renderTabs(); renderFoot();
    start();
  }

  /* تشغيل تلقائي: زر الغرفة يظهر بأي لعبة، ولو في غرفة محفوظة بيكمل عليها */
  function auto() {
    if (!fab) buildUI();
    buildLauncher();
    var r = lsGet(LS_ROOM), n = lsGet(LS_NAME), ro = lsGet(LS_ROLE) || 'student';
    if (r && n) begin(r, n, ro);
  }

  /* ============ الواجهة البرمجية ============ */
  window.PVChat = {
    /* PVChat.attach(G) — يراقب حالة اللعبة ويشغّل الشات تلقائيًا */
    attach: function (G) {
      if (!G || window.PVChat._attached) return;
      window.PVChat._attached = true;
      if (!fab) buildUI();
      var lastKey = '';
      setInterval(function () {
        var room = G.room || '';
        var role = (G.mode === 'host') ? 'teacher' : 'student';
        // في وضع "host" المعلمة ما بتدخل اسم، فبنعطيها اسمًا داخليًا
        var name = G.name || (role === 'teacher' ? 'teacher' : '');
        var key = room + '|' + name + '|' + role;
        if (key === lastKey) return;
        lastKey = key;
        stop();
        if (room && name) {
          S.room = room; S.name = name; S.role = role;
          renderTabs(); renderFoot();
          start();
        }
      }, 800);
    },

    /* PVChat.badName('...') — true إذا الاسم فيه كلمة ممنوعة */
    badName: function (n) { return isBad(n); },

    /* رسالة التنبيه الجاهزة عند رفض الاسم */
    badNameMsg: function () { return t().badName; },

    /* تشغيل يدوي بدون attach */
    startWith: function (room, name, role) {
      if (!fab) buildUI();
      stop(); S.room = room; S.name = name; S.role = role || 'student';
      renderTabs(); renderFoot(); start();
    },

    stop: stop,
    words: function () { return wordList.slice(); },

    /* PVChat.auto() — للألعاب اللي ما فيها وضع غرفة صف */
    auto: auto,
    openRoom: openDialog
  };

  /* حمّل قائمة الكلمات مبكرًا حتى يعمل badName قبل بدء اللعب */
  initFB().then(function () { loadWords(); });

  /* تشغيل تلقائي إذا اللعبة ما نادت attach() خلال ثانيتين */
  function bootAuto() {
    setTimeout(function () { if (!window.PVChat._attached) auto(); }, 1500);
  }
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', bootAuto);
  else bootAuto();
})();

</script>

<body>
<div class="flash" id="flash"></div>

<div class="frame">

  var wrap=el('div','scene-wrap');
  wrap.appendChild(el('div','halo'));

  var w=el('div','scene-img');
  var bg=el('img','bg');bg.src=img;bg.alt='';bg.setAttribute('aria-hidden','true');

  w.appendChild(bg);w.appendChild(im);
  w.appendChild(el('div','glow'));

  var sp=el('div','sparks');
  for(var i=0;i<18;i++){
    var s=document.createElement('i');
    var size=(Math.random()*3+1.6).toFixed(1);
    s.style.width=size+'px';s.style.height=size+'px';
    s.style.left=(Math.random()*100).toFixed(1)+'%';
    s.style.animationDuration=(Math.random()*7+7).toFixed(1)+'s';
    s.style.animationDelay=(-Math.random()*12).toFixed(1)+'s';
    s.style.setProperty('--dx',((Math.random()*60)-30).toFixed(0)+'px');
    s.style.opacity=(Math.random()*.5+.5).toFixed(2);
    sp.appendChild(s);
  }
  w.appendChild(sp);
  wrap.appendChild(w);

  ['tl','tr','bl','br'].forEach(function(c){wrap.appendChild(el('span','cnr '+c));});
  if(label)wrap.appendChild(el('div','eyebrow',label));
  return wrap;
}

/* ---------- لوحة النتائج ---------- */
function screenBoard(kind){
  topbar.style.display='none';
  var p=el('div','panel');
  p.appendChild(el('div','narr','<strong>'+(kind==='exam'?'\uD83D\uDCCB سجل الاختبارات':'\uD83C\uDFC6 لوحة نتائج الصف')+'</strong><br>'+
    (kind==='exam'?'للمعلّمة فقط — نتائج نمط الاختبار':'أعلى النتائج في تحدي الصف')));
  var box=el('div','lbbox','<div class="lbempty">جارٍ التحميل… \u23F3</div>');
  p.appendChild(box);
  var b=el('button','cta','رجوع');
  b.onclick=screenModes;p.appendChild(b);
  paint([p]);

  if(!elmDB){box.innerHTML='<div class="lbempty">ما في اتصال بالإنترنت \uD83C\uDF10<br>افتحي اللعبة من الرابط على النت</div>';return;}
  elmDB.collection('playverse_scores').where('game','==',ELM_GAME).limit(400).get().then(function(snap){
    var rows=[];
    snap.forEach(function(d){var o=d.data();o._id=d.id;if(o.mode===kind)rows.push(o);});
    if(!rows.length){box.innerHTML='<div class="lbempty">ما في نتائج بعد.</div>';return;}
    rows.sort(function(a,b){return (b.score||0)-(a.score||0) || (b.lives||0)-(a.lives||0) || (b.ts||0)-(a.ts||0);});
    var html='';
    rows.slice(0,100).forEach(function(o,i){
      var cls=i===0?' g1':i===1?' g2':i===2?' g3':'';
      html+='<div class="lbrow"><span class="rk'+cls+'">'+(i+1)+'</span>'+
            '<span class="nm">'+esc(o.name)+
            (kind==='exam'?'<span class="dt"><br>'+esc(o.date||'')+'</span>':'')+
            '</span><span class="sc">'+(o.score||0)+' / '+(o.total||STAGES.length)+'</span></div>';
    });
    box.innerHTML=html;
  }).catch(function(){box.innerHTML='<div class="lbempty">تعذّر التحميل.</div>';});
}

function pickLock(key){
  S.locks=S.locks.filter(function(k){return k!==key;});

  else screenTrap(LOCK_TRAP[key]);
}

  var p=el('div','panel');

  p.appendChild(el('div','quest',questionHTML(T.q)));
  var box=el('div','opts');

  });
  p.appendChild(box);

}

function answerTrap(T,i,box,p){
  var bs=box.querySelectorAll('.opt');

    bs[i].classList.add('good');fx('win');

    bs[i].classList.add('bad');bs[T.correct].classList.add('good');

    b.onclick=function(){answerStage(i,j,box,p);};
    box.appendChild(b);
  });
  p.appendChild(box);

function answerStage(i,j,box,p){
  var G=STAGES[i];
  var bs=box.querySelectorAll('.opt');
  for(var k=0;k<bs.length;k++)bs[k].disabled=true;

  if(j===G.correct){
    bs[j].classList.add('good');fx('win');
    S.trophies++;hud();
    setTimeout(function(){
      var p2=el('div','panel');
      p2.appendChild(el('div','narr','✓ '+G.winTxt));
      p2.appendChild(el('div','hint',G.hint));
      var b=el('button','cta',i===STAGES.length-1?'إلى المواجهة الأخيرة':'التحدي التالي');
      b.onclick=function(){screenStage(i+1);};
      p2.appendChild(b);
      paint([scene(G.win,'أحسنت'),p2]);
    },520);
  }else{
    bs[j].classList.add('bad');bs[G.correct].classList.add('good');
    fx('lose');S.lives--;hud();
    stage.querySelector('.scene-wrap').classList.add('shake');
    setTimeout(function(){
      if(S.lives<=0)return screenGameOver();
      var p2=el('div','panel');
      p2.appendChild(el('div','narr','✗ '+G.badTxt));
      p2.appendChild(el('div','hint',G.hint));
      var b=el('button','cta dark','حاول مرة ثانية');
      b.onclick=function(){screenStage(i);};
      p2.appendChild(b);
      paint([scene(G.bad,'خسرتِ نجمة'),p2]);
    },520);
  }
}

var GIFTS=[
  '\uD83C\uDFC5 ربحتِ علامتين إضافيتين!',
  '\uD83E\uDD1D بتقدري تنقذي صديقتك بأي عدد من النقاط',
  '\uD83C\uDF81 إلك هدية مميزة… اطلبيها من معلمتك',
  '\uD83C\uDF1F رح تكوني من نجوم PlayVerse هالأسبوع!'
];

function screenVictory(){
  var p=el('div','panel');
  p.appendChild(el('div','narr','طارت عصا <strong>ڤيلمار</strong> من إيده وانطفى الشعاع الأخضر.<br><br>\uD83E\uDDDE\u200D\u2642\uFE0F المارد بيمنحك جائزة… اختاري صندوق واحد لتكشفيه!'));

  var box=el('div','gifts');
  var order=GIFTS.slice();
  for(var k=order.length-1;k>0;k--){var r=Math.floor(Math.random()*(k+1));var t=order[k];order[k]=order[r];order[r]=t;}
  var picked=false;
  order.forEach(function(txt){
    var g=el('button','gift','\uD83C\uDF81');
    g.onclick=function(){
      if(picked)return; picked=true;
      var all=box.querySelectorAll('.gift');
      for(var m=0;m<all.length;m++)all[m].disabled=true;
      g.textContent='\u2728'; fx('win');
      p.insertBefore(el('div','giftout',txt), box.nextSibling);
      var b2=el('button','cta','العبي من جديد');
      b2.onclick=reset; p.appendChild(b2);
    };
    box.appendChild(g);
  });
  p.appendChild(box);
  paint([scene(IMG.genie,'THE GENIE'),p]);
}

function screenGameOver(){
  saveResult();
  var p=el('div','panel');
  var e=el('div','end');
  e.appendChild(el('div','big','خلصت النجوم'));
  e.appendChild(el('div','score','وصلتِ لـ '+S.trophies+' من '+STAGES.length+' كنوز'));
  p.appendChild(e);
  p.appendChild(el('div','narr','ما تزعلي — كل خطأ بيعلّمك القاعدة أحسن.<br><br>راجعي لوح التعاويذ وارجعي أقوى.'));
  var b=el('button','cta','من البداية');
  b.onclick=reset;p.appendChild(b);
  var b2=el('button','cta dark','راجعي القاعدة');
  b2.onclick=screenRules;p.appendChild(b2);
  paint([scene(IMG.duel,'GAME OVER'),p]);
}

function reset(){
  S.lives=3;S.trophies=0;S.locks=['gold','silver','pink'];
  screenCover();
}
window.elmBoard=screenBoard;

/* ---------- الصوت ---------- */
function playBgm(){
  if(!S.sound)return;
  bgm.volume=.30;
  var pr=bgm.play();if(pr&&pr.catch)pr.catch(function(){});
  document.getElementById('btnSound').style.color='#8fd8ff';
}
function pauseBgm(){try{bgm.pause();}catch(e){}}
function startAudio(){playBgm();}
document.getElementById('btnSound').onclick=function(){
  S.sound=!S.sound;
  this.style.color=S.sound?'#8fd8ff':'';
  if(S.sound)playBgm(); else pauseBgm();
};
document.getElementById('btnSound').style.color='#8fd8ff';
document.getElementById('btnRule').onclick=function(){screenRules('peek');};
document.getElementById('btnHome').onclick=function(){
  if(confirm('ترجعي للصفحة الرئيسية؟'))location.href='index.html';
};

/* ---------- شبكة أمان للصوت ---------- */
function kickAudio(){
  if(!S.sound) return;
  if(bgm.paused){ var q=bgm.play();
    if(q&&q.catch)q.catch(function(err){console.log('AUDIO ERROR:',err&&err.name);});
    try{bgm.muted=false;}catch(e){} }
}
document.addEventListener('click', kickAudio, true);
document.addEventListener('touchstart', kickAudio, true);

/* ---------- تشغيل ---------- */
// تحميل مسبق خفيف للصور الأولى فقط
['lostwand','locks','wand','hall'].forEach(function(k){var i=new Image();i.src=IMG[k];});
screenCover();

})();
</script>
