<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAIPA — الغلاف المتحرك</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#020b18;overflow:hidden;font-family:'Cairo',sans-serif}</style>
</head>
<body>
<style>
  #aaipaCover *{box-sizing:border-box}#aaipaCover{font-family:'Cairo',sans-serif}
  #aaipaCover{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#020b18;transition:opacity .9s ease;overflow:hidden}
  #aaipaCover.hide{opacity:0;pointer-events:none}
  #aaipaVid{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);height:min(78vh,150vw);width:auto;max-width:none;
    -webkit-mask-image:radial-gradient(ellipse 46% 36% at 50% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 46% 36% at 50% 50%,#000 55%,transparent 100%)}
  .aaipa-glow{position:absolute;left:50%;top:42%;width:70vmin;height:70vmin;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle,rgba(255,200,80,.22) 0%,rgba(255,170,40,.06) 45%,transparent 70%);animation:aaipaPulse 3.5s ease-in-out infinite;pointer-events:none}
  @keyframes aaipaPulse{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(.95)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
  .aaipa-st{position:absolute;color:#ffd56b;pointer-events:none;animation:aaipaTw 2.6s ease-in-out infinite;text-shadow:0 0 8px #ffb52e}
  @keyframes aaipaTw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
  .aaipa-text{position:absolute;bottom:13vh;left:0;right:0;text-align:center;padding:0 16px;pointer-events:none}
  .aaipa-title{font-family:'Aref Ruqaa',serif;font-size:clamp(22px,5.2vw,46px);line-height:1.5;
    background:linear-gradient(90deg,#a8741a,#ffe08a,#fff6cf,#ffd25a,#a8741a);background-size:250% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:aaipaShine 4s linear infinite;
    filter:drop-shadow(0 2px 8px rgba(255,190,60,.35))}
  .aaipa-sub{margin-top:6px;color:#f3dca0;font-size:clamp(13px,2.6vw,20px);letter-spacing:.5px;opacity:.9}
  @keyframes aaipaShine{to{background-position:-250% center}}
  #aaipaEnter{position:absolute;bottom:4.5vh;z-index:2;font-family:'Cairo';font-weight:800;font-size:clamp(16px,3vw,22px);
    padding:12px 42px;border-radius:40px;border:2px solid #ffd25a;color:#2a1a00;cursor:pointer;
    background:linear-gradient(180deg,#fff0b0,#f5c443 55%,#c98d1d);box-shadow:0 0 24px rgba(255,200,70,.55);
    animation:aaipaBtn 2s ease-in-out infinite}
  @keyframes aaipaBtn{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
</style>
<div id="aaipaCover">
  <div class="aaipa-glow"></div>
  <video id="aaipaVid" src="ipa-academy-cover.mp4" poster="ipa-academy-cover.jpg" autoplay muted loop playsinline preload="auto"></video>
  <div class="aaipa-text">
    <div class="aaipa-title">أكاديمية الملكية الفكرية</div>
    <div class="aaipa-sub">الجمعية الأمريكية العربية لحماية الملكية الفكرية · فرع فلسطين</div>
  </div>
  <button id="aaipaEnter">ادخل ←</button>
</div>
<script>
(function(){
  var c=document.getElementById('aaipaCover');
  for(var i=0;i<26;i++){var s=document.createElement('span');s.className='aaipa-st';s.textContent='✦';
    s.style.cssText='left:'+(4+Math.random()*92)+'%;top:'+(4+Math.random()*78)+'%;font-size:'+(8+Math.random()*14)+'px;animation-delay:'+(Math.random()*2.6).toFixed(2)+'s';c.appendChild(s);}
  var v=document.getElementById('aaipaVid');try{var p=v.play();if(p&&p.catch)p.catch(function(){})}catch(e){}
  document.getElementById('aaipaEnter').onclick=function(){
    c.classList.add('hide');setTimeout(function(){c.style.display='none';try{v.pause()}catch(e){}},950);
  };
})();
</script>
</body>
</html>
