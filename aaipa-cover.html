<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAIPA — الغلاف المتحرك</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#05060f;overflow:hidden;font-family:'Cairo',sans-serif}
  #aaipaCover{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 40%,#2a1d05 0%,#0d0a1c 55%,#04040b 100%);transition:opacity .9s ease}
  #aaipaCover.hide{opacity:0;pointer-events:none}
  #aaipaCanvas{position:absolute;inset:0;width:100%;height:100%}
  .aaipa-glow{position:absolute;left:50%;top:42%;width:70vmin;height:70vmin;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle,rgba(255,200,80,.35) 0%,rgba(255,170,40,.08) 45%,transparent 70%);animation:aaipaPulse 3.5s ease-in-out infinite;pointer-events:none}
  @keyframes aaipaPulse{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(.95)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
  .aaipa-text{position:absolute;bottom:13vh;left:0;right:0;text-align:center;padding:0 16px;pointer-events:none}
  .aaipa-title{font-family:'Aref Ruqaa',serif;font-size:clamp(22px,5.2vw,46px);line-height:1.5;
    background:linear-gradient(90deg,#a8741a,#ffe08a,#fff6cf,#ffd25a,#a8741a);background-size:250% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:aaipaShine 4s linear infinite;
    filter:drop-shadow(0 2px 8px rgba(255,190,60,.35))}
  .aaipa-sub{margin-top:6px;color:#f3dca0;font-size:clamp(13px,2.6vw,20px);letter-spacing:.5px;opacity:.9}
  @keyframes aaipaShine{to{background-position:-250% center}}
  #aaipaEnter{position:absolute;bottom:4.5vh;z-index:2;font-family:'Cairo';font-weight:800;font-size:clamp(16px,3vw,22px);
    padding:12px 42px;border-radius:40px;border:2px solid #ffd25a;color:#2a1a00;cursor:pointer;
    background:linear-gradient(180deg,#fff0b0,#f5c443 55%,#c98d1d);box-shadow:0 0 24px rgba(255,200,70,.55);
    animation:aaipaBtn 2s ease-in-out infinite}
  @keyframes aaipaBtn{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  #aaipaLoading{position:absolute;top:42%;color:#f3dca0;font-size:16px}
</style>
</head>
<body>

<div id="aaipaCover">
  <div class="aaipa-glow"></div>
  <canvas id="aaipaCanvas"></canvas>
  <div id="aaipaLoading">... جارٍ التحميل</div>
  <div class="aaipa-text">
    <div class="aaipa-title">الجمعية الأمريكية العربية لحماية الملكية الفكرية</div>
    <div class="aaipa-sub">AAIPA · فرع فلسطين</div>
  </div>
  <button id="aaipaEnter">ادخل ←</button>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';


const canvas = document.getElementById('aaipaCanvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35,1,0.1,100);
camera.position.set(0,0,6.2);

scene.add(new THREE.AmbientLight(0xffffff,0.35));
const key = new THREE.DirectionalLight(0xfff1cc,2.2); key.position.set(3,4,5); scene.add(key);
const rim = new THREE.PointLight(0xffb84d,30,20); scene.add(rim);

// sparkles
const N=260, pos=new Float32Array(N*3), spd=new Float32Array(N);
for(let i=0;i<N;i++){const r=1.4+Math.random()*2.2,a=Math.random()*Math.PI*2;
  pos[i*3]=Math.cos(a)*r;pos[i*3+1]=(Math.random()-.5)*4.5;pos[i*3+2]=Math.sin(a)*r-0.5;spd[i]=0.2+Math.random()*0.6;}
const pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
const sparkles=new THREE.Points(pg,new THREE.PointsMaterial({color:0xffd56b,size:0.045,transparent:true,opacity:.85,
  blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(sparkles);

const pivot = new THREE.Group(); pivot.position.y = 0.45; scene.add(pivot);

const gold = new THREE.MeshStandardMaterial({color:0xf2c14e, metalness:1, roughness:0.22, envMapIntensity:1.3});

new GLTFLoader().load('aaipa-emblem.glb',(g)=>{
  g.scene.traverse(o=>{ if(o.isMesh){ o.geometry.computeVertexNormals(); o.material=gold; }});
  pivot.add(g.scene);
  document.getElementById('aaipaLoading').remove();
});

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.position.z = w<h ? 6.2*Math.max(1,(h/w)*0.62) : 6.2; camera.updateProjectionMatrix();}
addEventListener('resize',resize); resize();

const clock=new THREE.Clock(); let intro=0;
function loop(){
  const t=clock.getElapsedTime(), dt=clock.getDelta?0:0;
  intro=Math.min(1,intro+0.012); const e=1-Math.pow(1-intro,3);
  pivot.scale.setScalar(0.3+0.7*e);
  pivot.rotation.y = t*0.9 + (1-e)*6;        // continuous spin
  pivot.rotation.x = Math.sin(t*0.8)*0.08;
  pivot.position.y = 0.45 + Math.sin(t*1.3)*0.08; // gentle float
  rim.position.set(Math.cos(t*1.5)*3,1.5,Math.sin(t*1.5)*3);
  const p=pg.attributes.position.array;
  for(let i=0;i<N;i++){p[i*3+1]+=spd[i]*0.006; if(p[i*3+1]>2.3)p[i*3+1]=-2.3;}
  pg.attributes.position.needsUpdate=true; sparkles.rotation.y=t*0.1;
  renderer.render(scene,camera); requestAnimationFrame(loop);
}
loop();

document.getElementById('aaipaEnter').onclick=()=>{
  const c=document.getElementById('aaipaCover'); c.classList.add('hide');
  setTimeout(()=>{ c.style.display='none'; renderer.setAnimationLoop(null); }, 950);
};
</script>
</body>
</html>
