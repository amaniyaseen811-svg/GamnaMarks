<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 شفرة الفكرة المسروقة</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.8s ease-in-out; }
        
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* ===== الغلاف - حركات سينمائية ===== */
        #coverImg {
            width: 100%;
            max-width: 500px;
            height: auto;
            border-radius: 20px;
            margin: 20px auto;
            box-shadow: 0 20px 60px rgba(124, 58, 237, 0.8);
            border: 3px solid #7c3aed;
            display: block;
            animation: coverPulse 3s ease-in-out infinite, coverGlow 4s ease-in-out infinite;
            transition: transform 0.3s ease;
        }

        #coverImg:hover {
            transform: scale(1.02);
            animation: coverPulse 2s ease-in-out infinite, coverGlow 2s ease-in-out infinite;
        }

        @keyframes coverPulse {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 0 20px 60px rgba(124, 58, 237, 0.8);
            }
            50% { 
                transform: scale(1.01);
                box-shadow: 0 30px 80px rgba(124, 58, 237, 1);
            }
        }

        @keyframes coverGlow {
            0%, 100% { 
                border-color: #7c3aed;
                filter: drop-shadow(0 0 10px rgba(124, 58, 237, 0.5));
            }
            50% { 
                border-color: #06b6d4;
                filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.8));
            }
        }

        /* ===== الزر - حركات ديناميكية ===== */
        .start-btn {
            padding: 18px 50px;
            font-size: 20px;
            margin-top: 30px;
            animation: buttonBounce 2s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .start-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .start-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        @keyframes buttonBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .btn { 
            padding: 15px 35px; 
            font-size: 18px; 
            font-weight: bold; 
            background: linear-gradient(135deg, #7c3aed, #06b6d4); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: all 0.3s; 
            position: relative;
            z-index: 1;
        }
        
        .btn:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.5); 
        }

        .btn:active {
            transform: translateY(-1px);
        }

        /* ===== الشخصيات - حركات دوارة ===== */
        #charImage {
            width: 100%;
            max-width: 400px;
            height: 500px;
            object-fit: cover;
            border-radius: 15px;
            margin: 20px auto;
            box-shadow: 0 20px 60px rgba(124, 58, 237, 0.8);
            border: 3px solid #7c3aed;
            display: block;
            animation: charFloat 3s ease-in-out infinite, charBorder 4s ease-in-out infinite;
        }

        @keyframes charFloat {
            0%, 100% { 
                transform: translateY(0);
            }
            50% { 
                transform: translateY(-10px);
            }
        }

        @keyframes charBorder {
            0%, 100% { 
                border-color: #7c3aed;
                box-shadow: 0 20px 60px rgba(124, 58, 237, 0.8);
            }
            50% { 
                border-color: #06b6d4;
                box-shadow: 0 20px 80px rgba(6, 182, 212, 0.8);
            }
        }
        
        #charInfo { 
            font-size: 18px; 
            color: #06b6d4; 
            margin: 20px 0; 
            padding: 15px; 
            background: rgba(124, 58, 237, 0.1); 
            border-radius: 10px; 
            border: 1px solid #7c3aed;
            animation: textGlow 2s ease-in-out infinite;
        }

        @keyframes textGlow {
            0%, 100% { 
                text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
                border-color: #7c3aed;
            }
            50% { 
                text-shadow: 0 0 20px rgba(6, 182, 212, 1);
                border-color: #06b6d4;
            }
        }
        
        .controls { 
            display: flex; 
            gap: 15px; 
            justify-content: center; 
            margin-top: 25px; 
            flex-wrap: wrap; 
        }

        /* ===== الفيديو - حركات ديناميكية ===== */
        h1 {
            font-size: 48px;
            color: #7c3aed;
            margin: 20px 0;
            animation: titleGlow 3s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
        }

        @keyframes titleGlow {
            0%, 100% { 
                color: #7c3aed;
                text-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
            }
            50% { 
                color: #06b6d4;
                text-shadow: 0 0 30px rgba(6, 182, 212, 0.8);
            }
        }
        
        #videoContainer { 
            width: 100%; 
            margin: 30px auto; 
            background: #000; 
            border-radius: 15px; 
            overflow: hidden; 
            box-shadow: 0 20px 60px rgba(124, 58, 237, 0.8);
            animation: videoPulse 4s ease-in-out infinite;
        }

        @keyframes videoPulse {
            0%, 100% { 
                box-shadow: 0 20px 60px rgba(124, 58, 237, 0.8);
            }
            50% { 
                box-shadow: 0 20px 80px rgba(6, 182, 212, 0.8);
            }
        }
        
        #videoPlayer { 
            width: 100%; 
            height: 400px; 
        }
        
        .game-screen { 
            background: rgba(124, 58, 237, 0.1); 
            padding: 30px; 
            border-radius: 15px; 
            border: 2px solid #7c3aed;
            animation: gamePulse 2.5s ease-in-out infinite;
        }

        @keyframes gamePulse {
            0%, 100% { 
                background: rgba(124, 58, 237, 0.1);
                border-color: #7c3aed;
                box-shadow: 0 0 20px rgba(124, 58, 237, 0.3);
            }
            50% { 
                background: rgba(6, 182, 212, 0.1);
                border-color: #06b6d4;
                box-shadow: 0 0 30px rgba(6, 182, 212, 0.5);
            }
        }
    </style>
</head>

let charIdx = 0;

function hideAll() {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
}

function toScreen(n) {
    hideAll();
    document.getElementById('screen' + n).classList.add('active');
    if (n === 2) showChar();
}

function showChar() {
    const c = characters[charIdx];
    document.getElementById('charImage').src = c.img;
    document.getElementById('charInfo').textContent = c.name + ' - ' + c.desc;
}

function nextChar() {
    charIdx = (charIdx + 1) % characters.length;
    showChar();
}
